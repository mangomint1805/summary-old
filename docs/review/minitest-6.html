<script>window.MT={"n":6,"part":4,"partName":"Part 4","sub":"Short Talks · Bài nói ngắn · 18 câu (71–88)","intro":"Trang này chữa <b>Minitest 6 (Part 4)<\/b>. Mỗi bài nói có nút nghe lại, lời bài nói kèm dịch và 3 câu hỏi. <b>Cách học:<\/b> nghe bài nói → tự chọn đáp án → đọc giải thích → mở lời bài nói xem đáp án nằm ở câu nào.","stepsTitle":"Cách làm Part 4: 3 bước","steps":["<b>Nghe câu giới thiệu.<\/b> \"Questions 71 through 73 refer to the following <i>telephone message / announcement / advertisement<\/i>\" cho biết dạng bài nói, giúp đoán trước nội dung (tin nhắn thoại, thông báo, quảng cáo…).","<b>Đọc trước câu hỏi, nghe theo thứ tự.<\/b> Câu đầu (ai nói, ở đâu, chủ đề) thường nằm ở 1–2 câu đầu bài. Câu cuối (sẽ làm gì, đề nghị gì) thường nằm ở cuối bài.","<b>Bắt paraphrase (cách nói lại).<\/b> Đáp án đúng hay nói lại ý bằng từ khác: <i>dispose of → get rid of<\/i>, <i>complimentary → free<\/i>. Đáp án lặp đúng từ trong bài (portable, hot water, renew…) thường là <b>bẫy<\/b>."],"hideOpts":false,"groups":[{"title":"Bài nói 71–73 · Ngân hàng gửi nhầm thẻ","tag":"Tin nhắn thoại","audio":"../audio/mt6/c71.mp3","script":[{"sp":"","t":"Hello, Ms. Grayson. (71) This is Michael Cook calling from **Alliance Financial Bank**.","vi":"Chào chị Grayson. Tôi là Michael Cook gọi từ Ngân hàng Alliance Financial."},{"sp":"","t":"(72) It has recently come to my attention that some clients who renewed their credit card this month **were sent the wrong card**.","vi":"Gần đây tôi được biết một số khách hàng gia hạn thẻ tín dụng trong tháng này đã bị gửi nhầm thẻ."},{"sp":"","t":"We have had multiple calls from bank members saying that they were sent a credit card with someone else's name on it.","vi":"Chúng tôi nhận được nhiều cuộc gọi của khách hàng nói rằng họ nhận được thẻ tín dụng mang tên người khác."},{"sp":"","t":"According to our records, you were also sent the wrong credit card.","vi":"Theo hồ sơ của chúng tôi, chị cũng bị gửi nhầm thẻ."},{"sp":"","t":"(73) We ask that you please **dispose of** the credit card by cutting it with a pair of scissors.","vi":"Chúng tôi đề nghị chị vui lòng huỷ chiếc thẻ đó bằng cách cắt nó bằng kéo."},{"sp":"","t":"In the meantime, we will issue a new credit card and have it delivered by express mail.","vi":"Trong lúc đó, chúng tôi sẽ phát hành thẻ mới và gửi cho chị bằng chuyển phát nhanh."},{"sp":"","t":"(72) We **apologize** for the inconvenience.","vi":"Chúng tôi xin lỗi vì sự bất tiện này."}],"qs":[{"n":71,"q":"Where does the speaker work?","qvi":"Người nói làm việc ở đâu?","opts":[{"t":"At a retail store","vi":"Ở một cửa hàng bán lẻ"},{"t":"At a bank","vi":"Ở một ngân hàng"},{"t":"At a gift shop","vi":"Ở một cửa hàng quà tặng"},{"t":"At a shipping company","vi":"Ở một công ty vận chuyển"}],"ans":["B"],"key":"calling from Alliance Financial Bank","ex":"Ngay câu giới thiệu: \"calling from Alliance Financial <b>Bank<\/b>\" → làm ở ngân hàng. Bài có nói \"delivered by express mail\" (gửi chuyển phát nhanh) nhưng người nói không làm ở công ty vận chuyển, nên (D) là bẫy."},{"n":72,"q":"What does the speaker apologize for?","qvi":"Người nói xin lỗi vì điều gì?","opts":[{"t":"A delivery mistake","vi":"Một lỗi khi gửi hàng"},{"t":"An incorrect charge","vi":"Một khoản phí bị tính sai"},{"t":"A scheduling error","vi":"Một lỗi xếp lịch"},{"t":"A defective product","vi":"Một sản phẩm bị lỗi"}],"ans":["A"],"key":"were sent the wrong card = a delivery mistake","ex":"Ngân hàng gửi nhầm thẻ (thẻ mang tên người khác), cuối bài nói \"We apologize\". Gửi nhầm = lỗi khi gửi: <i>sent the wrong card → a delivery mistake<\/i>. Thẻ không bị hỏng nên (D) sai; không có chuyện tính tiền sai nên (B) sai."},{"n":73,"q":"What does the speaker ask the listener to do?","qvi":"Người nói yêu cầu người nghe làm gì?","opts":[{"t":"Return a call","vi":"Gọi lại"},{"t":"Renew his credit card","vi":"Gia hạn thẻ tín dụng của anh ấy"},{"t":"Get rid of the recently delivered card","vi":"Bỏ đi chiếc thẻ vừa được gửi tới"},{"t":"Sign an application form","vi":"Ký một mẫu đơn"}],"ans":["C"],"key":"dispose of = get rid of","ex":"\"We ask that you please <b>dispose of<\/b> the credit card\": hãy huỷ chiếc thẻ (cắt bằng kéo). <i>dispose of = get rid of<\/i> (bỏ đi, vứt đi). (B) lặp lại từ \"renewed\" và \"credit card\" trong bài nhưng sai ý: chị ấy đã gia hạn rồi."}]},{"title":"Bài nói 74–76 · Trung tâm mua sắm sắp đóng cửa","tag":"Thông báo","audio":"../audio/mt6/c74.mp3","script":[{"sp":"","t":"(74) Attention all **shoppers**.","vi":"Xin quý khách mua sắm chú ý."},{"sp":"","t":"(74) The West Point **Mall** will be closing in 10 minutes.","vi":"Trung tâm mua sắm West Point sẽ đóng cửa sau 10 phút nữa."},{"sp":"","t":"We thank you for shopping with us and greatly appreciate your business.","vi":"Cảm ơn quý khách đã mua sắm tại đây, chúng tôi rất trân trọng sự ủng hộ của quý khách."},{"sp":"","t":"(75) To purchase items, please **bring them to the cashier right now**.","vi":"Để mua hàng, xin vui lòng mang hàng đến quầy thu ngân ngay bây giờ."},{"sp":"","t":"Also, we would like to inform you that a wallet that was found inside the store has been sent to the front desk.","vi":"Ngoài ra, chúng tôi xin thông báo một chiếc ví được tìm thấy trong cửa hàng đã được mang đến quầy lễ tân."},{"sp":"","t":"(76) If your name is Catherine Goya, please stop by the front desk to **claim the wallet**.","vi":"Nếu quý khách tên là Catherine Goya, xin ghé quầy lễ tân để nhận lại chiếc ví."},{"sp":"","t":"Once again, we will be closing in 10 minutes.","vi":"Xin nhắc lại, chúng tôi sẽ đóng cửa sau 10 phút nữa."},{"sp":"","t":"Please finish your shopping immediately.","vi":"Xin quý khách hoàn tất việc mua sắm ngay."}],"qs":[{"n":74,"q":"Where is the announcement being made?","qvi":"Thông báo này được phát ở đâu?","opts":[{"t":"In a subway station","vi":"Ở ga tàu điện ngầm"},{"t":"In a conference hall","vi":"Ở hội trường"},{"t":"In a shopping mall","vi":"Ở trung tâm mua sắm"},{"t":"In a baggage claim area","vi":"Ở khu nhận hành lý"}],"ans":["C"],"key":"shoppers, West Point Mall","ex":"\"Attention all <b>shoppers<\/b>\" và \"The West Point <b>Mall<\/b>\" → trung tâm mua sắm. Chuyện tìm thấy ví dễ làm nghĩ tới khu nhận hành lý (D), nhưng đó là bẫy."},{"n":75,"q":"What are the listeners asked to do?","qvi":"Người nghe được yêu cầu làm gì?","opts":[{"t":"Proceed to the checkout immediately","vi":"Đến quầy thanh toán ngay"},{"t":"Register for a workshop","vi":"Đăng ký một buổi hội thảo"},{"t":"Search for a missing item","vi":"Tìm một món đồ bị mất"},{"t":"Visit a different location","vi":"Đến một địa điểm khác"}],"ans":["A"],"key":"bring them to the cashier right now = proceed to the checkout immediately","ex":"\"Please bring them to the <b>cashier<\/b> right now\": mang hàng ra quầy thu ngân ngay. <i>cashier → checkout<\/i>, <i>right now → immediately<\/i>. Chiếc ví đã được tìm thấy rồi, nên không ai phải đi tìm đồ (C)."},{"n":76,"q":"Why should Ms. Goya go to the front desk?","qvi":"Vì sao cô Goya nên đến quầy lễ tân?","opts":[{"t":"To pay a membership fee","vi":"Để đóng phí hội viên"},{"t":"To recover a lost item","vi":"Để lấy lại món đồ bị mất"},{"t":"To receive a voucher","vi":"Để nhận phiếu giảm giá"},{"t":"To return an item","vi":"Để trả lại một món đồ"}],"ans":["B"],"key":"claim the wallet = recover a lost item","ex":"Cô Goya đánh rơi ví, ví đã được mang tới quầy lễ tân: \"stop by the front desk to <b>claim the wallet<\/b>\" → lấy lại đồ bị mất. <i>wallet → a lost item<\/i>. (D) \"trả lại đồ\" ngược ý: cô ấy đến để nhận, không phải để trả."}]},{"title":"Bài nói 77–79 · Tổng đài cửa hàng kính mắt","tag":"Tin nhắn ghi sẵn","audio":"../audio/mt6/c77.mp3","script":[{"sp":"","t":"(77) Thank you for calling **Joyce Optical**.","vi":"Cảm ơn quý khách đã gọi đến cửa hàng kính mắt Joyce Optical."},{"sp":"","t":"If you are calling to check on the status of an order, press 1.","vi":"Nếu quý khách gọi để kiểm tra tình trạng đơn hàng, xin bấm phím 1."},{"sp":"","t":"(77) Remember, we are the only **glasses store** in town that offers the services of our opticians free of charge.","vi":"Xin nhớ rằng chúng tôi là cửa hàng kính mắt duy nhất trong thị trấn cung cấp dịch vụ của chuyên viên đo mắt hoàn toàn miễn phí."},{"sp":"","t":"(78) That means you can get a **complimentary eye examination** as your vision changes.","vi":"Nghĩa là quý khách có thể được khám mắt miễn phí khi thị lực thay đổi."},{"sp":"","t":"(79) If you would like to **meet with one of our opticians**, press 2 now.","vi":"Nếu quý khách muốn gặp một chuyên viên đo mắt của chúng tôi, xin bấm phím 2 ngay."},{"sp":"","t":"We appreciate you choosing Joyce Optical, and we hope to see you soon.","vi":"Cảm ơn quý khách đã chọn Joyce Optical, mong sớm được gặp quý khách."}],"qs":[{"n":77,"q":"What business created the message?","qvi":"Doanh nghiệp nào làm tin nhắn này?","opts":[{"t":"A glassware factory","vi":"Một nhà máy đồ thuỷ tinh"},{"t":"A pharmacy","vi":"Một nhà thuốc"},{"t":"An eyeglasses store","vi":"Một cửa hàng kính mắt"},{"t":"An insurance company","vi":"Một công ty bảo hiểm"}],"ans":["C"],"key":"Optical, glasses store, opticians","ex":"\"Joyce <b>Optical<\/b>\", \"the only <b>glasses store<\/b> in town\" → cửa hàng kính mắt. Bẫy (A) \"glassware\" nghe giống \"glasses\" nhưng là đồ thuỷ tinh (ly, chén). Có \"khám mắt\" nhưng không phải nhà thuốc (B)."},{"n":78,"q":"According to the speaker, what service does the business offer?","qvi":"Theo người nói, doanh nghiệp này cung cấp dịch vụ gì?","opts":[{"t":"Free eye examinations","vi":"Khám mắt miễn phí"},{"t":"Online purchases","vi":"Mua hàng trực tuyến"},{"t":"Special discounts for regular customers","vi":"Giảm giá đặc biệt cho khách quen"},{"t":"Free delivery on large orders","vi":"Giao hàng miễn phí cho đơn lớn"}],"ans":["A"],"key":"complimentary = free","ex":"\"You can get a <b>complimentary<\/b> eye examination\": <i>complimentary = free<\/i> (miễn phí), cũng khớp với \"free of charge\" ngay câu trước. Bài có nhắc \"order\" (đơn hàng) nhưng không nói gì về giao hàng miễn phí (D)."},{"n":79,"q":"Why would listeners press 2?","qvi":"Người nghe bấm phím 2 để làm gì?","opts":[{"t":"To cancel an order","vi":"Để huỷ đơn hàng"},{"t":"To change delivery information","vi":"Để đổi thông tin giao hàng"},{"t":"To schedule an appointment","vi":"Để đặt lịch hẹn"},{"t":"To leave a message","vi":"Để để lại lời nhắn"}],"ans":["C"],"key":"meet with one of our opticians = schedule an appointment","ex":"\"If you would like to <b>meet with<\/b> one of our opticians, press 2\": muốn gặp chuyên viên đo mắt → đặt lịch hẹn. Phím 1 mới là kiểm tra đơn hàng, nên (A), (B) nhắc tới đơn hàng là bẫy."}]},{"title":"Bài nói 80–82 · Quảng cáo laptop nhỏ gọn","tag":"Quảng cáo","audio":"../audio/mt6/c80.mp3","script":[{"sp":"","t":"(80) Would you like to own a high-powered laptop that is **small enough to fit in your suit pocket or purse**?","vi":"Bạn có muốn sở hữu một chiếc laptop cấu hình mạnh mà nhỏ đến mức bỏ vừa túi áo vest hay ví cầm tay không?"},{"sp":"","t":"Then the new **compact** laptop Hypertop from Hyperline is the one you have been waiting for.","vi":"Vậy thì chiếc laptop nhỏ gọn mới Hypertop của hãng Hyperline chính là thứ bạn đang chờ đợi."},{"sp":"","t":"The laptop also boasts impressive graphics and fast processing time.","vi":"Chiếc laptop còn có đồ hoạ ấn tượng và tốc độ xử lý nhanh."},{"sp":"","t":"However, this is not available at our stores for now.","vi":"Tuy nhiên, hiện tại sản phẩm chưa có bán ở các cửa hàng của chúng tôi."},{"sp":"","t":"(81) To purchase this laptop, you need to **visit our website** and place an order.","vi":"Để mua chiếc laptop này, bạn cần vào trang web của chúng tôi và đặt hàng."},{"sp":"","t":"(82) If you order this laptop this week, we will provide a **portable printer** at no extra charge as a special promotion.","vi":"Nếu bạn đặt mua trong tuần này, chúng tôi sẽ tặng kèm một máy in di động không tính thêm phí, như một chương trình khuyến mãi đặc biệt."},{"sp":"","t":"Don't hesitate. Take advantage of this amazing opportunity!","vi":"Đừng chần chừ. Hãy nắm lấy cơ hội tuyệt vời này!"}],"qs":[{"n":80,"q":"What special feature of the new laptop does the speaker mention?","qvi":"Người nói nhắc tới đặc điểm nổi bật nào của chiếc laptop mới?","opts":[{"t":"It is the lightest in the market.","vi":"Nó nhẹ nhất trên thị trường."},{"t":"It has a built-in high-definition camera.","vi":"Nó có sẵn camera độ nét cao."},{"t":"It is water-resistant.","vi":"Nó chống nước."},{"t":"It is convenient to carry.","vi":"Nó tiện mang theo."}],"ans":["D"],"key":"small enough to fit in your pocket / compact = convenient to carry","ex":"Laptop \"nhỏ đến mức bỏ vừa túi áo hay ví\", \"compact\" (nhỏ gọn) → tiện mang theo. (A) \"nhẹ nhất thị trường\" nghe hợp lý nhưng bài không hề so sánh với máy khác. Camera, chống nước: không được nhắc."},{"n":81,"q":"How can customers purchase the new laptop?","qvi":"Khách hàng có thể mua chiếc laptop mới bằng cách nào?","opts":[{"t":"By accessing a website","vi":"Bằng cách vào một trang web"},{"t":"By stopping by the speaker's office","vi":"Bằng cách ghé văn phòng người nói"},{"t":"By visiting a local store","vi":"Bằng cách đến cửa hàng gần nhà"},{"t":"By calling a customer service hotline","vi":"Bằng cách gọi đường dây nóng chăm sóc khách hàng"}],"ans":["A"],"key":"visit our website = access a website","ex":"\"You need to <b>visit our website<\/b> and place an order\" → <i>visit → access<\/i>. Bẫy (C): câu ngay trước nói rõ \"not available at our stores\" (chưa bán ở cửa hàng)."},{"n":82,"q":"What can customers receive this week?","qvi":"Khách hàng có thể nhận được gì trong tuần này?","opts":[{"t":"An additional battery","vi":"Một viên pin dự phòng"},{"t":"A carrying case","vi":"Một túi đựng"},{"t":"A portable speaker","vi":"Một loa di động"},{"t":"A small printer","vi":"Một máy in nhỏ"}],"ans":["D"],"key":"a portable printer = a small printer","ex":"Đặt mua trong tuần này được tặng \"a <b>portable printer<\/b>\" (máy in di động, tức là máy in nhỏ, xách theo được). (C) lặp từ \"portable\" nhưng là loa, không phải máy in: bẫy lặp từ."}]},{"title":"Bài nói 83–85 · Hợp tác với Walker Studios","tag":"Trích đoạn cuộc họp","audio":"../audio/mt6/c83.mp3","script":[{"sp":"","t":"Hi, thanks for coming for this special meeting today.","vi":"Chào mọi người, cảm ơn đã đến dự cuộc họp đặc biệt hôm nay."},{"sp":"","t":"(83) The reason I called everyone is to **announce a new partnership** with Walker Studios.","vi":"Lý do tôi gọi mọi người đến là để thông báo việc hợp tác mới với Walker Studios."},{"sp":"","t":"As the CEO of Metro Studios, it is my great pleasure to witness this amazing opportunity to work with such a high-caliber company like Walker Studios.","vi":"Là giám đốc điều hành của Metro Studios, tôi rất vui được chứng kiến cơ hội tuyệt vời này: làm việc với một công ty đẳng cấp như Walker Studios."},{"sp":"","t":"They possess a number of studios that are capable of producing cutting-edge quality 3D films.","vi":"Họ sở hữu nhiều xưởng phim có khả năng sản xuất phim 3D chất lượng hàng đầu."},{"sp":"","t":"This will allow our company to begin producing 3D films.","vi":"Việc này sẽ giúp công ty chúng ta bắt đầu sản xuất phim 3D."},{"sp":"","t":"(84) **And why wouldn't we?**","vi":"Và tại sao lại không chứ?"},{"sp":"","t":"The majority of our films are science fiction and I believe a transition into 3D is **an excellent path** for us.","vi":"Phần lớn phim của chúng ta là phim khoa học viễn tưởng, và tôi tin chuyển sang 3D là một hướng đi tuyệt vời cho chúng ta."},{"sp":"","t":"I have ensured that we will have full access to Walker Studios' equipment, and in return they will become a shareholder in our company.","vi":"Tôi đã đảm bảo chúng ta sẽ được dùng toàn bộ thiết bị của Walker Studios, đổi lại họ sẽ trở thành cổ đông của công ty chúng ta."},{"sp":"","t":"(85) I suggest that our studio staff should spend the next few weeks **studying how this new type of equipment works** so we can begin producing content as soon as possible.","vi":"Tôi đề nghị nhân viên xưởng phim của chúng ta dành vài tuần tới tìm hiểu cách loại thiết bị mới này hoạt động, để chúng ta có thể bắt đầu sản xuất sớm nhất có thể."}],"qs":[{"n":83,"q":"What is the reason for the meeting?","qvi":"Lý do của cuộc họp là gì?","opts":[{"t":"To announce a new partnership","vi":"Để thông báo một sự hợp tác mới"},{"t":"To introduce a new manager","vi":"Để giới thiệu một quản lý mới"},{"t":"To propose a budget plan","vi":"Để đề xuất kế hoạch ngân sách"},{"t":"To announce his retirement","vi":"Để thông báo việc nghỉ hưu của ông ấy"}],"ans":["A"],"key":"The reason I called everyone is to announce a new partnership","ex":"Câu hỏi \"reason for the meeting\" khớp với câu \"<b>The reason<\/b> I called everyone is to <b>announce a new partnership<\/b>\": đáp án nói lại gần như nguyên văn. Người nói tự giới thiệu là CEO nhưng không phải để giới thiệu quản lý mới (B)."},{"n":84,"q":"What does the woman imply when she says \"And why wouldn't we?\"","qvi":"Người phụ nữ ngụ ý gì khi nói \"Và tại sao lại không chứ?\"","opts":[{"t":"To suggest the partnership is good","vi":"Cho thấy sự hợp tác này là tốt"},{"t":"To review some materials","vi":"Để xem lại một số tài liệu"},{"t":"To recommend a new method","vi":"Để đề xuất một phương pháp mới"},{"t":"To offer a training program","vi":"Để mời tham gia một khoá đào tạo"}],"ans":["A"],"key":"Why wouldn't we? = tất nhiên nên làm","ex":"\"Why wouldn't we?\" là câu hỏi tu từ, nghĩa là \"tất nhiên chúng ta nên làm\". Ngay sau đó bà ấy nói chuyển sang 3D là \"<b>an excellent path<\/b>\" (hướng đi tuyệt vời) → sự hợp tác này là tốt. Dạng câu ngụ ý: nghe câu ngay trước và ngay sau câu trích."},{"n":85,"q":"What does the woman suggest the studio staff do?","qvi":"Người phụ nữ đề nghị nhân viên xưởng phim làm gì?","opts":[{"t":"Go on vacation","vi":"Đi nghỉ phép"},{"t":"Continue using the old equipment","vi":"Tiếp tục dùng thiết bị cũ"},{"t":"Produce a movie","vi":"Sản xuất một bộ phim"},{"t":"Study the new equipment","vi":"Tìm hiểu thiết bị mới"}],"ans":["D"],"key":"studying how this new type of equipment works = study the new equipment","ex":"\"I suggest that our studio staff should spend the next few weeks <b>studying how this new type of equipment works<\/b>\" → tìm hiểu thiết bị mới. (C) \"sản xuất phim\" là việc làm SAU khi học xong (\"so we can begin producing content\"), không phải điều được đề nghị lúc này."}]},{"title":"Bài nói 86–88 · Phòng tập cắt nước nóng","tag":"Thông báo","audio":"../audio/mt6/c86.mp3","script":[{"sp":"","t":"Hi everybody, this Saturday the fitness centre will be upgrading our water heating system in the bathrooms.","vi":"Chào mọi người, thứ Bảy này phòng tập sẽ nâng cấp hệ thống làm nóng nước trong phòng tắm."},{"sp":"","t":"(86) Unfortunately, **the hot water will be off from 9 a.m. to 12 p.m.**","vi":"Rất tiếc, nước nóng sẽ bị ngắt từ 9 giờ sáng đến 12 giờ trưa."},{"sp":"","t":"(87) If anyone was planning to come in and exercise, **you might want to hold off until later**.","vi":"Nếu ai định đến tập, có lẽ bạn nên đợi đến muộn hơn hãy đến."},{"sp":"","t":"(88) If the work gets delayed, I will **send a text message** to all club members to notify you of any changes.","vi":"Nếu công việc bị chậm trễ, tôi sẽ gửi tin nhắn cho tất cả hội viên để báo về mọi thay đổi."}],"qs":[{"n":86,"q":"What problem does the speaker mention?","qvi":"Người nói nhắc tới vấn đề gì?","opts":[{"t":"A shipment was missed.","vi":"Một lô hàng bị lỡ."},{"t":"The order was wrong.","vi":"Đơn hàng bị sai."},{"t":"The center will have no hot water.","vi":"Trung tâm sẽ không có nước nóng."},{"t":"The hot water is working.","vi":"Nước nóng đang hoạt động."}],"ans":["C"],"key":"the hot water will be off = no hot water","ex":"\"The hot water will be <b>off<\/b> from 9 a.m. to 12 p.m.\": nước nóng bị ngắt → trung tâm không có nước nóng. (D) dùng lại đúng chữ \"hot water\" nhưng nói ngược ý (đang hoạt động)."},{"n":87,"q":"What does the speaker imply when he says, \"you might want to hold off until later\"?","qvi":"Người nói ngụ ý gì khi nói \"có lẽ bạn nên đợi đến muộn hơn\"?","opts":[{"t":"Members of the center should come in the afternoon.","vi":"Hội viên nên đến vào buổi chiều."},{"t":"Members of the center shouldn't come.","vi":"Hội viên không nên đến."},{"t":"There will be a meeting in the morning.","vi":"Sẽ có một cuộc họp vào buổi sáng."},{"t":"The center is closed in the afternoon.","vi":"Trung tâm đóng cửa vào buổi chiều."}],"ans":["A"],"key":"hold off until later = để sau hãy đến (sau 12 giờ trưa)","ex":"<i>hold off<\/i> = hoãn lại, chờ. Nước nóng tắt từ 9 giờ đến 12 giờ trưa, nên \"đợi đến muộn hơn\" nghĩa là đến sau 12 giờ, tức buổi chiều. (B) sai vì người nói không bảo đừng đến hẳn, chỉ bảo đến muộn hơn."},{"n":88,"q":"What does the speaker say he will do?","qvi":"Người nói nói anh ấy sẽ làm gì?","opts":[{"t":"Send a text message","vi":"Gửi tin nhắn điện thoại"},{"t":"Send an email","vi":"Gửi email"},{"t":"Make a phone call","vi":"Gọi điện thoại"},{"t":"Post a letter","vi":"Gửi thư qua bưu điện"}],"ans":["A"],"key":"I will send a text message","ex":"\"I will <b>send a text message<\/b> to all club members\": đáp án lặp lại nguyên văn. Câu hỏi \"will do\" thường nằm ở cuối bài, nghe kỹ câu cuối cùng. Email, gọi điện, gửi thư đều không được nhắc."}]}],"recap":"<h2>Ghi nhớ: đáp án nói lại ý<\/h2><table><tbody><tr><td><b>Trong bài nghe<\/b><\/td><td><b>Trong đáp án<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>were sent the wrong card<\/td><td>a delivery mistake<\/td><td>72<\/td><\/tr><tr><td>dispose of the credit card<\/td><td>get rid of the card<\/td><td>73<\/td><\/tr><tr><td>bring them to the cashier right now<\/td><td>proceed to the checkout immediately<\/td><td>75<\/td><\/tr><tr><td>claim the wallet<\/td><td>recover a lost item<\/td><td>76<\/td><\/tr><tr><td>a complimentary eye examination<\/td><td>free eye examinations<\/td><td>78<\/td><\/tr><tr><td>meet with one of our opticians<\/td><td>schedule an appointment<\/td><td>79<\/td><\/tr><tr><td>small enough to fit in your pocket<\/td><td>convenient to carry<\/td><td>80<\/td><\/tr><tr><td>visit our website<\/td><td>access a website<\/td><td>81<\/td><\/tr><tr><td>a portable printer<\/td><td>a small printer<\/td><td>82<\/td><\/tr><tr><td>the hot water will be off<\/td><td>no hot water<\/td><td>86<\/td><\/tr><tr><td>hold off until later (sau 12 giờ)<\/td><td>come in the afternoon<\/td><td>87<\/td><\/tr><\/tbody><\/table><p><b>Câu hỏi ngụ ý<\/b> (\"What does the speaker imply when he says…\", câu 84, 87): nghe câu ngay trước và ngay sau câu được trích. \"Why wouldn't we?\" = tất nhiên nên làm; \"hold off\" = hoãn lại, chờ.<\/p><p><b>Bẫy lặp từ:<\/b> renew (câu 73), glassware nghe giống glasses (77), stores (81), portable speaker (82), hot water is working (86). Nghe thấy từ quen chưa chắc là đáp án đúng.<\/p><p><b>Bài tập về nhà gợi ý:<\/b> nghe lại audio từng bài nói, với mỗi câu tìm câu gốc trong lời bài nói và câu trả lời tương ứng (paraphrase), ghi vào vở theo bảng trên.<\/p>"};</script>
