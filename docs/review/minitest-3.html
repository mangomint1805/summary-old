<script>window.MT={"n":3,"part":2,"partName":"Part 2","sub":"Question-Response · Hỏi – đáp · 25 câu (7–31)","intro":"Trang này chữa <b>Minitest 3 (Part 2)<\/b>. Mỗi câu có nút nghe lại, 3 câu trả lời và giải thích. Chữ của đáp án được ẩn cho giống đề thật (đề không in). <b>Cách học:<\/b> bấm nghe → chọn A, B hoặc C → đọc giải thích → mở <i>Câu hỏi + dịch<\/i> để xem lại câu hỏi.","stepsTitle":"Cách làm Part 2: 3 bước","steps":["<b>Nghe thật kỹ từ đầu tiên.<\/b> Who / Where / When / Why / How… quyết định kiểu trả lời: Where → nơi chốn, When → thời gian, Who → người.","<b>Loại đáp án bẫy.<\/b> Đáp án lặp lại từ hoặc âm giống câu hỏi thường sai: <i>switch → switched, live → leave, assign → sign<\/i>. Câu hỏi Wh- không trả lời bằng <i>Yes/No<\/i>.","<b>Chấp nhận trả lời gián tiếp.<\/b> Đáp án đúng có khi không trả lời thẳng: <i>\"It's at the top of the page\"<\/i>, <i>\"I'll have to review their résumés\"<\/i>. Câu rủ / đề nghị (<i>Why don't we…?, Can I help…?<\/i>) thì đáp lại bằng đồng ý / cảm ơn."],"hideOpts":true,"hideHint":"Nghe rồi chọn","groups":[{"title":"Câu 7","tag":"Câu hỏi đuôi","audio":"../audio/mt3/c7.mp3","script":[{"sp":"Q","t":"You've been to Japan before, haven't you?","vi":"Bạn đã từng đến Nhật Bản rồi, phải không?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":7,"q":"","qvi":"","opts":[{"t":"After 3:30 P.M.","vi":"Sau 3 giờ 30 chiều."},{"t":"I prefer Japanese food.","vi":"Tôi thích đồ ăn Nhật hơn."},{"t":"No, never.","vi":"Không, chưa bao giờ."}],"ans":["C"],"key":"Hỏi đã từng chưa → trả lời Yes/No","ex":"Câu hỏi đuôi (… haven't you?) hỏi xem đã từng đến Nhật chưa, nên trả lời Yes/No: \"No, never\" (chưa bao giờ). (B) là bẫy lặp từ: Japan → Japanese. (A) nói giờ giấc, hợp với câu hỏi When."}]},{"title":"Câu 8","tag":"Where","audio":"../audio/mt3/c8.mp3","script":[{"sp":"Q","t":"Where's the light switch?","vi":"Công tắc đèn ở đâu?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":8,"q":"","qvi":"","opts":[{"t":"We switched suppliers.","vi":"Chúng tôi đã đổi nhà cung cấp."},{"t":"On the back wall.","vi":"Trên bức tường phía sau."},{"t":"It's too heavy.","vi":"Nó nặng quá."}],"ans":["B"],"key":"Where → nơi chốn (on/in/at…)","ex":"Where hỏi vị trí, nên chọn câu chỉ nơi chốn: \"On the back wall\". (A) là bẫy lặp từ: switch (công tắc) → switched (đã đổi), cùng âm nhưng khác nghĩa."}]},{"title":"Câu 9","tag":"Yes/No (đề nghị)","audio":"../audio/mt3/c9.mp3","script":[{"sp":"Q","t":"Would you like to return this item?","vi":"Bạn có muốn trả lại món hàng này không?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":9,"q":"","qvi":"","opts":[{"t":"Yes, it doesn't fit.","vi":"Vâng, nó không vừa."},{"t":"Medium size, I think.","vi":"Cỡ vừa, tôi nghĩ vậy."},{"t":"No, he left already.","vi":"Không, anh ấy đi rồi."}],"ans":["A"],"key":"Yes + lý do muốn trả hàng","ex":"Hỏi có muốn trả hàng không. (A) đồng ý và nêu lý do: không vừa. (B) nói về cỡ áo, liên quan chủ đề mua sắm nhưng không trả lời câu hỏi. (C) dùng \"he\" trong khi câu hỏi nói với \"you\"."}]},{"title":"Câu 10","tag":"How late","audio":"../audio/mt3/c10.mp3","script":[{"sp":"Q","t":"How late did you work last night?","vi":"Tối qua bạn làm việc muộn đến mấy giờ?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":10,"q":"","qvi":"","opts":[{"t":"Past midnight.","vi":"Quá nửa đêm."},{"t":"Three times, I guess.","vi":"Ba lần, tôi đoán vậy."},{"t":"Don't be late again.","vi":"Đừng đến muộn nữa nhé."}],"ans":["A"],"key":"How late → mốc giờ muộn","ex":"How late hỏi làm muộn đến lúc nào, nên trả lời một mốc giờ: \"Past midnight\" (quá nửa đêm). (B) trả lời How many times (mấy lần). (C) là bẫy lặp từ: late."}]},{"title":"Câu 11","tag":"Why","audio":"../audio/mt3/c11.mp3","script":[{"sp":"Q","t":"Why isn't the heater on?","vi":"Tại sao máy sưởi không bật?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":11,"q":"","qvi":"","opts":[{"t":"A cold winter day.","vi":"Một ngày đông lạnh giá."},{"t":"It broke this morning.","vi":"Nó bị hỏng sáng nay."},{"t":"Yes, it's on.","vi":"Vâng, nó đang bật."}],"ans":["B"],"key":"Why → nêu lý do","ex":"Why hỏi lý do. (B) nêu lý do máy sưởi không bật: nó hỏng sáng nay. Câu hỏi Wh- không trả lời bằng Yes/No nên (C) sai, lại còn lặp từ \"on\". (A) liên tưởng đến máy sưởi (mùa đông lạnh) nhưng không phải lý do."}]},{"title":"Câu 12","tag":"What","audio":"../audio/mt3/c12.mp3","script":[{"sp":"Q","t":"What's the name of the company?","vi":"Tên của công ty là gì?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":12,"q":"","qvi":"","opts":[{"t":"A new CEO has been named.","vi":"Một giám đốc điều hành mới đã được bổ nhiệm."},{"t":"Submit an application.","vi":"Hãy nộp đơn xin việc."},{"t":"It's at the top of the page.","vi":"Nó ở đầu trang."}],"ans":["C"],"key":"Trả lời gián tiếp: chỉ chỗ xem","ex":"Trả lời gián tiếp: không nói tên công ty mà chỉ chỗ để tự xem: \"It's at the top of the page\" (tên ghi ở đầu trang). (A) là bẫy lặp âm: name → named (được bổ nhiệm). (B) liên quan chủ đề công ty nhưng không trả lời."}]},{"title":"Câu 13","tag":"Câu hỏi lựa chọn","audio":"../audio/mt3/c13.mp3","script":[{"sp":"Q","t":"Are you picking up the client today or tomorrow?","vi":"Bạn đón khách hàng hôm nay hay ngày mai?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":13,"q":"","qvi":"","opts":[{"t":"She works in China.","vi":"Cô ấy làm việc ở Trung Quốc."},{"t":"A taxi driver.","vi":"Một tài xế taxi."},{"t":"This afternoon.","vi":"Chiều nay."}],"ans":["C"],"key":"today or tomorrow → This afternoon (= today)","ex":"Câu hỏi lựa chọn \"A or B\": chọn một trong hai. \"This afternoon\" (chiều nay) nghĩa là chọn \"today\". (A), (B) đều không nói về thời gian. (B) liên tưởng đến \"pick up\" (đón xe)."}]},{"title":"Câu 14","tag":"Who","audio":"../audio/mt3/c14.mp3","script":[{"sp":"Q","t":"Who should I assign this task to?","vi":"Tôi nên giao việc này cho ai?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":14,"q":"","qvi":"","opts":[{"t":"Someone in marketing.","vi":"Một người bên phòng tiếp thị."},{"t":"I'll finish it by Tuesday.","vi":"Tôi sẽ làm xong trước thứ Ba."},{"t":"Please sign here.","vi":"Vui lòng ký vào đây."}],"ans":["A"],"key":"Who → người / phòng ban","ex":"Who hỏi người, nên chọn \"Someone in marketing\" (một người bên phòng tiếp thị). (B) nói thời hạn, hợp với When. (C) là bẫy lặp âm: assign → sign."}]},{"title":"Câu 15","tag":"Câu hỏi đuôi","audio":"../audio/mt3/c15.mp3","script":[{"sp":"Q","t":"You are planning to attend the concert on Wednesday, aren't you?","vi":"Bạn định đi buổi hòa nhạc hôm thứ Tư, phải không?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":15,"q":"","qvi":"","opts":[{"t":"No, something urgent came up.","vi":"Không, có việc gấp vừa phát sinh."},{"t":"He tends to speak indirectly.","vi":"Anh ấy hay nói vòng vo."},{"t":"Yes, it was very good.","vi":"Có, nó rất hay."}],"ans":["A"],"key":"No + lý do không đi được","ex":"Hỏi có định đi hòa nhạc (sắp tới) không. (A): không đi, vì có việc gấp. (C) bắt đầu bằng Yes nhưng dùng thì quá khứ \"was\": buổi hòa nhạc chưa diễn ra nên sai. (B) dùng \"he\", không liên quan."}]},{"title":"Câu 16","tag":"Yes/No phủ định","audio":"../audio/mt3/c16.mp3","script":[{"sp":"Q","t":"Isn't Mr. Moore married?","vi":"Chẳng phải ông Moore đã kết hôn rồi sao?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":16,"q":"","qvi":"","opts":[{"t":"It's after the wedding.","vi":"Nó diễn ra sau đám cưới."},{"t":"No, it wasn't.","vi":"Không, nó không phải."},{"t":"Yes, since last year.","vi":"Vâng, từ năm ngoái."}],"ans":["C"],"key":"Isn't…? trả lời như câu thường: Yes = đã cưới","ex":"Câu hỏi phủ định (Isn't…?) trả lời như câu hỏi thường: Yes = có, đã cưới, \"since last year\" (từ năm ngoái). (A) là bẫy liên tưởng: married → wedding. (B) dùng \"it wasn't\", không khớp với ông Moore."}]},{"title":"Câu 17","tag":"Lời đề nghị","audio":"../audio/mt3/c17.mp3","script":[{"sp":"Q","t":"Can I help you carry that?","vi":"Để tôi giúp bạn mang cái đó nhé?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":17,"q":"","qvi":"","opts":[{"t":"That would be appreciated.","vi":"Vậy thì tốt quá, cảm ơn bạn."},{"t":"The box is full of paper.","vi":"Cái hộp đầy giấy."},{"t":"I couldn't find an empty seat.","vi":"Tôi không tìm được ghế trống."}],"ans":["A"],"key":"Đề nghị giúp → nhận lời / cảm ơn","ex":"\"Can I help you…?\" là lời đề nghị giúp đỡ. Đáp lại bằng nhận lời: \"That would be appreciated\" (vậy thì tôi rất cảm kích). (B) liên tưởng đến đồ cần mang nhưng không đáp lời đề nghị. (C) không liên quan."}]},{"title":"Câu 18","tag":"When","audio":"../audio/mt3/c18.mp3","script":[{"sp":"Q","t":"When is the payment due?","vi":"Khi nào là hạn thanh toán?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":18,"q":"","qvi":"","opts":[{"t":"You may use a credit card.","vi":"Bạn có thể dùng thẻ tín dụng."},{"t":"Before March 3.","vi":"Trước ngày 3 tháng 3."},{"t":"Yes, I do.","vi":"Vâng, tôi có."}],"ans":["B"],"key":"When → thời gian (before/by/on…)","ex":"When hỏi thời gian: \"Before March 3\". (A) liên quan chủ đề thanh toán nhưng trả lời cách trả tiền (How). (C) là Yes/No, không dùng cho câu hỏi Wh-."}]},{"title":"Câu 19","tag":"Which","audio":"../audio/mt3/c19.mp3","script":[{"sp":"Q","t":"Which pattern do you like best?","vi":"Bạn thích họa tiết nào nhất?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":19,"q":"","qvi":"","opts":[{"t":"Let's choose the best idea.","vi":"Hãy chọn ý tưởng hay nhất."},{"t":"I think the striped shirt is nice.","vi":"Tôi thấy cái áo kẻ sọc đẹp."},{"t":"The store closes soon.","vi":"Cửa hàng sắp đóng cửa."}],"ans":["B"],"key":"Which → chọn một cái cụ thể","ex":"Which hỏi chọn cái nào: \"the striped shirt\" (cái áo kẻ sọc, tức họa tiết sọc). (A) là bẫy lặp từ: best. (C) liên quan chuyện mua sắm nhưng không trả lời."}]},{"title":"Câu 20","tag":"Câu hỏi lựa chọn","audio":"../audio/mt3/c20.mp3","script":[{"sp":"Q","t":"Do you want to take the bus or drive to the mall?","vi":"Bạn muốn đi xe buýt hay lái xe đến trung tâm mua sắm?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":20,"q":"","qvi":"","opts":[{"t":"The price of gas.","vi":"Giá xăng."},{"t":"Just look at a map.","vi":"Cứ xem bản đồ đi."},{"t":"I prefer public transportation.","vi":"Tôi thích đi phương tiện công cộng hơn."}],"ans":["C"],"key":"bus = public transportation","ex":"Câu hỏi lựa chọn bus hay drive. \"Public transportation\" (phương tiện công cộng) là cách nói lại của \"the bus\". (A) liên tưởng: drive → gas (xăng). (B) liên tưởng: đi đường → bản đồ."}]},{"title":"Câu 21","tag":"How many","audio":"../audio/mt3/c21.mp3","script":[{"sp":"Q","t":"How many new computers were purchased?","vi":"Đã mua bao nhiêu máy tính mới?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":21,"q":"","qvi":"","opts":[{"t":"One for each employee.","vi":"Mỗi nhân viên một cái."},{"t":"It's an e-mail attachment.","vi":"Đó là tệp đính kèm trong email."},{"t":"For the business conference.","vi":"Cho hội nghị kinh doanh."}],"ans":["A"],"key":"How many → số lượng","ex":"How many hỏi số lượng: \"One for each employee\" (mỗi nhân viên một cái), một cách nói số lượng gián tiếp. (B) liên tưởng đến máy tính (email). (C) trả lời mục đích (Why/For what)."}]},{"title":"Câu 22","tag":"Câu trần thuật","audio":"../audio/mt3/c22.mp3","script":[{"sp":"Q","t":"I can't find the file on that client.","vi":"Tôi không tìm thấy hồ sơ về khách hàng đó."}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":22,"q":"","qvi":"","opts":[{"t":"That's fine with me.","vi":"Tôi thấy được đấy."},{"t":"Look in this file cabinet.","vi":"Thử tìm trong tủ hồ sơ này xem."},{"t":"Before the end of the day.","vi":"Trước cuối ngày."}],"ans":["B"],"key":"Nêu vấn đề → đưa cách giải quyết","ex":"Câu trần thuật nêu một vấn đề (không tìm thấy hồ sơ). Đáp lại hợp lý là đưa cách giải quyết: \"Look in this file cabinet\". Ở câu này đáp án đúng có lặp từ \"file\" (vẫn đúng vì hợp nghĩa). (A) là câu đồng ý, (C) nói thời gian: đều không hợp."}]},{"title":"Câu 23","tag":"Lời đề nghị","audio":"../audio/mt3/c23.mp3","script":[{"sp":"Q","t":"Why don't we rent bicycles?","vi":"Hay là chúng ta thuê xe đạp đi?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":23,"q":"","qvi":"","opts":[{"t":"Because Jake wants to.","vi":"Vì Jake muốn thế."},{"t":"Yes, just like the directions said.","vi":"Vâng, đúng như hướng dẫn đã ghi."},{"t":"That sounds fun.","vi":"Nghe vui đấy."}],"ans":["C"],"key":"Why don't we…? = rủ rê → đồng ý","ex":"\"Why don't we…?\" không hỏi lý do mà là lời rủ (hay là ta… đi). Đáp lại: \"That sounds fun\" (nghe vui đấy). (A) là bẫy: thấy Why liền trả lời Because."}]},{"title":"Câu 24","tag":"Yes/No phủ định","audio":"../audio/mt3/c24.mp3","script":[{"sp":"Q","t":"Don't you live in the same neighborhood as Jim?","vi":"Chẳng phải bạn sống cùng khu với Jim sao?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":24,"q":"","qvi":"","opts":[{"t":"No, I don't leave until 6:00 P.M.","vi":"Không, 6 giờ chiều tôi mới đi."},{"t":"Yes, very close in fact.","vi":"Đúng vậy, thật ra là rất gần."},{"t":"It's different from this new product.","vi":"Nó khác với sản phẩm mới này."}],"ans":["B"],"key":"Don't you…? → Yes = có sống cùng khu","ex":"Câu hỏi phủ định trả lời như câu thường: \"Yes, very close in fact\" (đúng, ở rất gần). (A) là bẫy lặp âm: live → leave. (C) bẫy \"same\" → \"different\"."}]},{"title":"Câu 25","tag":"Where","audio":"../audio/mt3/c25.mp3","script":[{"sp":"Q","t":"Where's the nearest gas station?","vi":"Trạm xăng gần nhất ở đâu?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":25,"q":"","qvi":"","opts":[{"t":"It's toxic gas.","vi":"Đó là khí độc."},{"t":"He is at the car show.","vi":"Anh ấy đang ở triển lãm ô tô."},{"t":"Just around the corner.","vi":"Ngay góc phố thôi."}],"ans":["C"],"key":"Where → around the corner","ex":"Where hỏi nơi chốn: \"Just around the corner\" (ngay góc phố, rất gần). (A) là bẫy lặp từ: gas (xăng / khí). (B) liên tưởng: trạm xăng → ô tô, và dùng \"he\" không khớp."}]},{"title":"Câu 26","tag":"Why","audio":"../audio/mt3/c26.mp3","script":[{"sp":"Q","t":"Why is nobody at the park today?","vi":"Tại sao hôm nay công viên không có ai?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":26,"q":"","qvi":"","opts":[{"t":"I forgot the picnic basket.","vi":"Tôi quên giỏ đồ dã ngoại rồi."},{"t":"It is expected to rain.","vi":"Trời được dự báo sẽ mưa."},{"t":"No, he changed his mind.","vi":"Không, anh ấy đổi ý rồi."}],"ans":["B"],"key":"Why → lý do (dự báo mưa)","ex":"Why hỏi lý do công viên vắng: \"It is expected to rain\" (dự báo trời mưa). (A) liên tưởng: park → picnic. (C) có No: câu hỏi Wh- không trả lời Yes/No."}]},{"title":"Câu 27","tag":"Yes/No","audio":"../audio/mt3/c27.mp3","script":[{"sp":"Q","t":"Has your daughter decided on a wedding date?","vi":"Con gái bạn đã chọn được ngày cưới chưa?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":27,"q":"","qvi":"","opts":[{"t":"No, that sounds too luxurious.","vi":"Không, nghe xa xỉ quá."},{"t":"Yes, the last weekend in August.","vi":"Rồi, cuối tuần cuối cùng của tháng Tám."},{"t":"She likes the white dress.","vi":"Cô ấy thích chiếc váy trắng."}],"ans":["B"],"key":"Yes + ngày cụ thể","ex":"Hỏi đã chọn ngày cưới chưa: \"Yes, the last weekend in August\" (rồi, cuối tuần cuối tháng Tám). (A) có No nhưng phần sau không khớp. (C) liên tưởng: đám cưới → váy trắng."}]},{"title":"Câu 28","tag":"Câu hỏi lựa chọn","audio":"../audio/mt3/c28.mp3","script":[{"sp":"Q","t":"Should I park on the street or in the garage?","vi":"Tôi nên đỗ xe ngoài đường hay trong nhà xe?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":28,"q":"","qvi":"","opts":[{"t":"Wherever there is space.","vi":"Chỗ nào còn trống thì đỗ."},{"t":"You left your keys on the counter.","vi":"Bạn để quên chìa khóa trên quầy."},{"t":"They started from a garage band.","vi":"Họ khởi nghiệp từ một ban nhạc tập trong nhà xe."}],"ans":["A"],"key":"A or B → chỗ nào cũng được","ex":"Câu hỏi lựa chọn có thể trả lời \"cái nào cũng được\": \"Wherever there is space\" (chỗ nào còn trống). (C) là bẫy lặp từ: garage. (B) liên tưởng: xe → chìa khóa."}]},{"title":"Câu 29","tag":"Câu trần thuật","audio":"../audio/mt3/c29.mp3","script":[{"sp":"Q","t":"We are going to open a second location next month.","vi":"Tháng sau chúng tôi sẽ mở chi nhánh thứ hai."}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":29,"q":"","qvi":"","opts":[{"t":"Your business is going well.","vi":"Việc kinh doanh của bạn đang thuận lợi nhỉ."},{"t":"I often visit my cousins.","vi":"Tôi hay đi thăm anh chị em họ."},{"t":"No, it was on the third floor.","vi":"Không, nó ở tầng ba."}],"ans":["A"],"key":"Báo tin vui → nhận xét / chúc mừng","ex":"Câu trần thuật báo tin mở thêm chi nhánh. Đáp lại tự nhiên là một lời nhận xét: \"Your business is going well\" (làm ăn thuận lợi nhỉ). (C) là bẫy: second → third, lại dùng No. (B) không liên quan."}]},{"title":"Câu 30","tag":"Lời gợi ý","audio":"../audio/mt3/c30.mp3","script":[{"sp":"Q","t":"Why don't you ask for a few days off from work?","vi":"Sao bạn không xin nghỉ làm vài ngày?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":30,"q":"","qvi":"","opts":[{"t":"I guess I'll have to do that.","vi":"Chắc tôi phải làm vậy thôi."},{"t":"Yes, I'll turn it on.","vi":"Vâng, tôi sẽ bật nó lên."},{"t":"He received a promotion.","vi":"Anh ấy được thăng chức."}],"ans":["A"],"key":"Why don't you…? = khuyên → nhận lời","ex":"\"Why don't you…?\" là lời khuyên (sao bạn không… đi). Đáp lại: \"I guess I'll have to do that\" (chắc phải làm vậy). (B) là bẫy: off → turn on (ngược nghĩa bật/tắt). (C) liên tưởng chuyện công việc nhưng nói về \"he\"."}]},{"title":"Câu 31","tag":"Who","audio":"../audio/mt3/c31.mp3","script":[{"sp":"Q","t":"Who's most qualified for this position?","vi":"Ai là người phù hợp nhất cho vị trí này?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":31,"q":"","qvi":"","opts":[{"t":"Complete the form online.","vi":"Hãy điền mẫu đơn trực tuyến."},{"t":"Actually, I'll have to review their résumés.","vi":"Thật ra tôi phải xem lại hồ sơ của họ đã."},{"t":"They filed an official complaint.","vi":"Họ đã nộp đơn khiếu nại chính thức."}],"ans":["B"],"key":"Trả lời gián tiếp: chưa biết, phải xem đã","ex":"Trả lời gián tiếp: không nêu tên ai, mà nói phải xem hồ sơ (résumé) đã mới biết. Câu bắt đầu bằng \"Actually\" / \"I'll have to check…\" thường là đáp án đúng. (A) liên tưởng chuyện ứng tuyển (điền đơn). (C) liên tưởng: form → filed."}]}],"recap":"<h2>Ghi nhớ: dạng câu hỏi Part 2<\/h2><table><tbody><tr><td><b>Dạng câu hỏi<\/b><\/td><td><b>Trả lời đúng<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>Where…?<\/td><td>nơi chốn: On the back wall, Just around the corner<\/td><td>8, 25<\/td><\/tr><tr><td>When / How late…?<\/td><td>thời gian: Before March 3, Past midnight<\/td><td>18, 10<\/td><\/tr><tr><td>Who…?<\/td><td>người / phòng ban: Someone in marketing<\/td><td>14, 31<\/td><\/tr><tr><td>Why…?<\/td><td>lý do: It broke this morning, It is expected to rain<\/td><td>11, 26<\/td><\/tr><tr><td>A or B?<\/td><td>chọn 1 cái, hoặc \"cái nào cũng được\": This afternoon, public transportation, Wherever there is space<\/td><td>13, 20, 28<\/td><\/tr><tr><td>Câu hỏi đuôi / phủ định (…, haven't you? / Isn't…?)<\/td><td>trả lời như câu thường: Yes = có, No = không<\/td><td>7, 15, 16, 24<\/td><\/tr><tr><td>Why don't we / you…? · Can I help…?<\/td><td>rủ rê, khuyên, đề nghị → đồng ý / cảm ơn<\/td><td>17, 23, 30<\/td><\/tr><tr><td>Câu trần thuật<\/td><td>đưa cách giải quyết hoặc nhận xét<\/td><td>22, 29<\/td><\/tr><\/tbody><\/table><p><b>Bẫy lặp từ / lặp âm:<\/b> Japan → Japanese (7), switch → switched (8), late (10), name → named (12), assign → sign (14), best (19), live → leave (24), gas (25), garage (28), off → turn on (30). Nghe thấy từ giống câu hỏi chưa chắc là đáp án đúng.<\/p><p><b>Bẫy sai thì / sai người:<\/b> câu 15 (sắp đi hòa nhạc mà trả lời \"it was very good\"), câu 9, 25, 30 (hỏi \"you\" mà trả lời về \"he\").<\/p><p><b>Bài tập về nhà gợi ý:<\/b> nghe lại từng câu, chép lại câu hỏi và đáp án đúng vào vở, ghi rõ dạng câu hỏi (Where, Why, A or B…) và bẫy của các đáp án sai.<\/p>"};</script>
