<script>window.MT={"n":2,"part":5,"partName":"Part 5","sub":"Incomplete Sentences · Hoàn thành câu · 30 câu (101–130)","intro":"Trang này chữa <b>Minitest 2 (Part 5)<\/b>. Mỗi câu có một chỗ trống, chọn từ đúng để điền. <b>Cách học:<\/b> tự chọn đáp án trước → đọc giải thích → ghi lại dạng câu (🔑) vào vở. Câu nào sai thì làm lại sau vài ngày.","stepsTitle":"Cách làm Part 5: 3 bước","steps":["<b>Nhìn 4 đáp án trước.<\/b> Nếu cùng gốc từ khác đuôi (excite, exciting, excitement…) là câu <b>từ loại<\/b>: không cần dịch cả câu. Nếu 4 từ khác nghĩa là câu <b>từ vựng<\/b>: phải hiểu nghĩa.","<b>Nhìn từ đứng trước và sau chỗ trống.<\/b> Trước danh từ → tính từ. Giữa chủ ngữ và động từ → trạng từ -ly. Sau giới từ, sau tính từ → danh từ. Sau must/will/can → động từ nguyên mẫu.","<b>Kiểm tra chủ động / bị động và số ít / số nhiều.<\/b> Chủ ngữ là vật (da, cơn đau…) thường dùng bị động <i>be + V3<\/i>. Động từ <i>have<\/i> đi với chủ ngữ số nhiều."],"hideOpts":false,"groups":[{"title":"Câu 101–105","tag":"Từ loại · Bị động · Từ vựng","qs":[{"n":101,"q":"Our spokesperson will explain an _______ opportunity for property investors.","qvi":"Người phát ngôn của chúng tôi sẽ giới thiệu một cơ hội (hấp dẫn) cho các nhà đầu tư bất động sản.","opts":[{"t":"excitedly","vi":"một cách hào hứng (trạng từ)"},{"t":"excitement","vi":"sự hào hứng (danh từ)"},{"t":"excited","vi":"cảm thấy hào hứng (tính từ -ed)"},{"t":"exciting","vi":"hấp dẫn, thú vị (tính từ -ing)"}],"ans":["D"],"key":"Giữa a/an và danh từ cần tính từ · -ing: gây cảm xúc, -ed: bị cảm xúc","ex":"Chỗ trống đứng giữa <b>an<\/b> và danh từ <b>opportunity<\/b> nên cần tính từ: loại (A) trạng từ và (B) danh từ. Cơ hội là thứ <b>gây ra<\/b> sự hào hứng cho người khác nên dùng <b>exciting<\/b>. <b>Excited<\/b> dùng cho người cảm thấy hào hứng (I am excited), nên (C) là bẫy."},{"n":102,"q":"Some of the leather used in this handbag must _______ from Italy.","qvi":"Một phần da dùng trong chiếc túi xách này chắc hẳn (được nhập khẩu) từ Ý.","opts":[{"t":"will import","vi":"sẽ nhập khẩu"},{"t":"be imported","vi":"được nhập khẩu (bị động)"},{"t":"to import","vi":"để nhập khẩu"},{"t":"have imported","vi":"đã nhập khẩu (chủ động)"}],"ans":["B"],"key":"Sau must + V nguyên mẫu · vật bị tác động → bị động be + V3","ex":"Sau động từ khuyết thiếu <b>must<\/b> phải là động từ nguyên mẫu: loại (A) vì có thêm will, loại (C) vì có to. Chủ ngữ là <b>da<\/b>, da không tự nhập khẩu mà <b>được<\/b> người ta nhập khẩu, nên dùng bị động <b>be imported<\/b>. (D) have imported là chủ động nên sai nghĩa."},{"n":103,"q":"Rockwell Bank's automated teller machines are _______ located in various sections of the city.","qvi":"Các máy rút tiền tự động của Ngân hàng Rockwell được đặt (một cách thuận tiện) ở nhiều khu vực khác nhau trong thành phố.","opts":[{"t":"abruptly","vi":"đột ngột"},{"t":"conveniently","vi":"thuận tiện"},{"t":"fluently","vi":"trôi chảy (nói ngôn ngữ)"},{"t":"periodically","vi":"định kỳ"}],"ans":["B"],"key":"conveniently located = được đặt ở vị trí thuận tiện","ex":"Cả 4 đáp án đều là trạng từ, nên phải chọn theo nghĩa. Máy rút tiền đặt ở nhiều nơi trong thành phố thì <b>thuận tiện<\/b> cho khách: <b>conveniently located<\/b> là cụm rất hay gặp trong TOEIC. Đột ngột (A), trôi chảy (C), định kỳ (D) không hợp với \"được đặt ở\"."},{"n":104,"q":"As soon as both sides reach _______ terms, the licensing contract will be signed.","qvi":"Ngay khi hai bên đạt được các điều khoản (mà cả hai đồng ý được), hợp đồng cấp phép sẽ được ký.","opts":[{"t":"agreeable","vi":"có thể chấp nhận, đồng ý được (tính từ)"},{"t":"agree","vi":"đồng ý (động từ)"},{"t":"agreement","vi":"sự đồng ý, thỏa thuận (danh từ)"},{"t":"agreed","vi":"đã đồng ý (V3)"}],"ans":["A"],"key":"Trước danh từ cần tính từ · agreeable terms = điều khoản chấp nhận được","ex":"Chỗ trống đứng trước danh từ <b>terms<\/b> (điều khoản) nên cần tính từ: loại (B) động từ và (C) danh từ. <b>Agreeable<\/b> nghĩa là \"có thể đồng ý được\", đúng ý câu. (D) agreed cũng có thể đứng trước danh từ, nhưng đề này chọn tính từ thật sự là agreeable: gặp đuôi <b>-able<\/b> trước danh từ thì ưu tiên chọn."},{"n":105,"q":"Anyone who cannot _______ one of the safety training workshops before September 1 should inform a manager.","qvi":"Bất kỳ ai không thể (tham dự) một trong các buổi tập huấn an toàn trước ngày 1 tháng 9 thì nên báo cho quản lý.","opts":[{"t":"impress","vi":"gây ấn tượng"},{"t":"employ","vi":"tuyển dụng"},{"t":"attend","vi":"tham dự"},{"t":"reply","vi":"trả lời"}],"ans":["C"],"key":"attend a workshop = tham dự buổi tập huấn","ex":"Bốn đáp án đều là động từ, chọn theo nghĩa. Đi với <b>workshops<\/b> (buổi hội thảo, tập huấn) là <b>attend<\/b> (tham dự). (D) reply phải đi với <b>to<\/b> (reply to an email) và cũng không hợp nghĩa. Impress, employ không hợp với buổi tập huấn."}]},{"title":"Câu 106–110","tag":"Danh từ · Lượng từ · Từ loại","qs":[{"n":106,"q":"_______ for using the hotel's spa and dining services have appeared on the final invoice.","qvi":"(Các khoản phí) sử dụng dịch vụ spa và ăn uống của khách sạn đã có trên hóa đơn cuối cùng.","opts":[{"t":"Charge","vi":"khoản phí (số ít)"},{"t":"Charges","vi":"các khoản phí (số nhiều)"},{"t":"Charging","vi":"việc tính phí (V-ing)"},{"t":"Charged","vi":"đã bị tính phí (V3)"}],"ans":["B"],"key":"Đầu câu làm chủ ngữ cần danh từ · động từ \"have\" → chủ ngữ số nhiều","ex":"Chỗ trống là chủ ngữ của câu nên cần danh từ. Động từ chính là <b>have appeared<\/b> (have, không phải has), nên chủ ngữ phải số nhiều: <b>Charges<\/b>. (A) Charge là số ít, không đi với have. (C), (D) không phải danh từ chỉ khoản phí."},{"n":107,"q":"Members of the security team have been instructed to report _______ unattended bag to the local police department.","qvi":"Các thành viên đội an ninh đã được hướng dẫn báo cho sở cảnh sát địa phương về (bất kỳ) chiếc túi nào bị bỏ quên.","opts":[{"t":"any","vi":"bất kỳ"},{"t":"much","vi":"nhiều (danh từ không đếm được)"},{"t":"most","vi":"hầu hết"},{"t":"all","vi":"tất cả"}],"ans":["A"],"key":"any + danh từ số ít đếm được = bất kỳ … nào","ex":"Sau chỗ trống là <b>bag<\/b>, danh từ đếm được ở dạng <b>số ít<\/b>. Chỉ <b>any<\/b> đi được với danh từ số ít (any bag = bất kỳ túi nào). (B) much đi với danh từ không đếm được. (C) most và (D) all đi với danh từ số nhiều (most bags, all bags)."},{"n":108,"q":"The head chef has the restaurant manager _______ the order for the ingredients every evening.","qvi":"Bếp trưởng nhờ quản lý nhà hàng (duyệt) đơn đặt nguyên liệu mỗi tối.","opts":[{"t":"authoritative","vi":"có uy quyền (tính từ)"},{"t":"authority","vi":"quyền hạn (danh từ)"},{"t":"authorities","vi":"chính quyền, nhà chức trách (danh từ số nhiều)"},{"t":"authorize","vi":"phê duyệt, cho phép (động từ)"}],"ans":["D"],"key":"have + người + V nguyên mẫu (nhờ ai làm gì)","ex":"Cấu trúc <b>have somebody do something<\/b>: nhờ / để ai làm gì, sau người là <b>động từ nguyên mẫu<\/b>. Sau chỗ trống có tân ngữ <b>the order<\/b> nên càng chắc cần động từ: <b>authorize<\/b> (phê duyệt). (A) tính từ, (B), (C) danh từ đều không đứng được ở vị trí này."},{"n":109,"q":"The automotive company _______ pursued technologies that would improve the efficiency of its engines.","qvi":"Công ty ô tô đã (tích cực / mạnh mẽ) theo đuổi các công nghệ giúp cải thiện hiệu suất động cơ.","opts":[{"t":"aggressive","vi":"mạnh mẽ, quyết liệt (tính từ)"},{"t":"aggressiveness","vi":"sự quyết liệt (danh từ)"},{"t":"aggressively","vi":"một cách mạnh mẽ, tích cực (trạng từ)"},{"t":"aggression","vi":"sự gây hấn (danh từ)"}],"ans":["C"],"key":"Giữa chủ ngữ và động từ cần trạng từ (-ly)","ex":"Chỗ trống đứng giữa chủ ngữ <b>The automotive company<\/b> và động từ <b>pursued<\/b>. Vị trí bổ nghĩa cho động từ cần <b>trạng từ<\/b>: <b>aggressively<\/b> (đuôi -ly). (A) là tính từ, phải đứng trước danh từ. (B), (D) là danh từ, không chen vào giữa chủ ngữ và động từ được."},{"n":110,"q":"On the first day of the painting course, students should provide the teacher with proof of _______.","qvi":"Vào ngày đầu của khóa học vẽ, học viên nên đưa cho giáo viên giấy tờ chứng minh (đã đăng ký).","opts":[{"t":"registration","vi":"sự đăng ký"},{"t":"proposal","vi":"đề xuất"},{"t":"accumulation","vi":"sự tích lũy"},{"t":"copyright","vi":"bản quyền"}],"ans":["A"],"key":"proof of registration = bằng chứng đã đăng ký","ex":"Cả 4 đáp án đều là danh từ, chọn theo nghĩa. Ngày đầu khóa học, học viên đưa giáo viên <b>proof of registration<\/b> (giấy chứng nhận đã đăng ký khóa học). Đề xuất, tích lũy, bản quyền không hợp với việc đi học."}]},{"title":"Câu 111–115","tag":"Đại từ · Giới từ · Trạng từ","qs":[{"n":111,"q":"The furniture in this apartment is not _______ but belongs to the landlord and must be returned at the end of the lease.","qvi":"Đồ nội thất trong căn hộ này không phải (của chúng tôi) mà thuộc về chủ nhà và phải được trả lại khi hết hạn thuê.","opts":[{"t":"ours","vi":"của chúng tôi (đại từ sở hữu)"},{"t":"we","vi":"chúng tôi (chủ ngữ)"},{"t":"our","vi":"của chúng tôi (+ danh từ)"},{"t":"us","vi":"chúng tôi (tân ngữ)"}],"ans":["A"],"key":"Sau to be, không có danh từ theo sau → đại từ sở hữu (ours = our furniture)","ex":"Sau <b>is not<\/b> là chỗ trống, phía sau không có danh từ. <b>Ours<\/b> = our furniture (đồ của chúng tôi), đứng một mình được. (C) our phải có danh từ đi kèm (our furniture). (B) we là chủ ngữ, (D) us là tân ngữ, đều không mang nghĩa \"của chúng tôi\"."},{"n":112,"q":"The driver _______ Mr. Dwight is expected to arrive at the conference venue 20 minutes prior to the ending time.","qvi":"Tài xế (của / dành cho) ông Dwight dự kiến sẽ đến địa điểm hội nghị 20 phút trước giờ kết thúc.","opts":[{"t":"until","vi":"cho đến khi"},{"t":"in","vi":"trong"},{"t":"for","vi":"cho, dành cho"},{"t":"among","vi":"giữa (nhiều người)"}],"ans":["C"],"key":"the driver for Mr. Dwight = tài xế dành cho / đưa đón ông Dwight","ex":"Chỗ trống nối <b>The driver<\/b> với <b>Mr. Dwight<\/b>: tài xế <b>dành cho<\/b> ông Dwight, dùng <b>for<\/b>. (A) until chỉ thời gian (đến lúc), (B) in chỉ nơi chốn bên trong, (D) among dùng cho nhóm từ 3 người trở lên, đều không hợp."},{"n":113,"q":"Three of the new chemists, who _______ developed the material, will be recognized by the CEO at Saturday's ceremony.","qvi":"Ba nhà hóa học mới, những người đã (cùng nhau / hợp tác) phát triển vật liệu này, sẽ được Tổng giám đốc khen thưởng tại buổi lễ hôm thứ Bảy.","opts":[{"t":"collaborating","vi":"đang hợp tác (V-ing)"},{"t":"collaborate","vi":"hợp tác (động từ)"},{"t":"collaboratively","vi":"một cách hợp tác, cùng nhau (trạng từ)"},{"t":"collaborative","vi":"mang tính hợp tác (tính từ)"}],"ans":["C"],"key":"Trước động từ (developed) cần trạng từ","ex":"Trong mệnh đề <b>who ___ developed the material<\/b>, động từ chính đã có là <b>developed<\/b>. Chỗ trống đứng trước động từ nên cần <b>trạng từ<\/b>: <b>collaboratively<\/b> (cùng nhau). (B) collaborate là động từ, câu sẽ có 2 động từ liền nhau nên sai. (A) V-ing và (D) tính từ không bổ nghĩa cho động từ."},{"n":114,"q":"The goal of the program is to make health services readily available to those in both rural and urban _______.","qvi":"Mục tiêu của chương trình là giúp người dân ở cả (khu vực / môi trường) nông thôn và thành thị đều dễ dàng tiếp cận dịch vụ y tế.","opts":[{"t":"purposes","vi":"mục đích"},{"t":"settings","vi":"môi trường, khu vực, bối cảnh"},{"t":"monuments","vi":"đài tưởng niệm"},{"t":"standards","vi":"tiêu chuẩn"}],"ans":["B"],"key":"rural and urban settings = khu vực nông thôn và thành thị","ex":"Chọn theo nghĩa. <b>Rural<\/b> (nông thôn) và <b>urban<\/b> (thành thị) chỉ nơi sống, nên danh từ hợp là <b>settings<\/b> (môi trường, khu vực). Purposes (mục đích), monuments (đài tưởng niệm), standards (tiêu chuẩn) không chỉ nơi chốn."},{"n":115,"q":"Please send a check in the amount of £550 _______ the document that needs to be checked by our agency.","qvi":"Vui lòng gửi một tấm séc trị giá 550 bảng (kèm theo) tài liệu cần cơ quan chúng tôi kiểm tra.","opts":[{"t":"despite","vi":"mặc dù (+ danh từ)"},{"t":"while","vi":"trong khi"},{"t":"with","vi":"cùng với, kèm theo"},{"t":"through","vi":"xuyên qua, thông qua"}],"ans":["C"],"key":"send A with B = gửi A kèm theo B","ex":"Gửi séc <b>cùng với<\/b> tài liệu: dùng <b>with<\/b>. (A) despite là \"mặc dù\", trái nghĩa với ý câu. (B) while là liên từ, phải nối với một mệnh đề (có chủ ngữ + động từ). (D) through là \"xuyên qua / thông qua\", không hợp."}]},{"title":"Câu 116–120","tag":"Bị động · Từ vựng · Giới từ","qs":[{"n":116,"q":"Using a fingerprint system is generally _______ as the primary means of security at laboratories in this country.","qvi":"Việc dùng hệ thống vân tay nhìn chung (được chấp nhận) là phương thức bảo mật chính tại các phòng thí nghiệm ở nước này.","opts":[{"t":"to accept","vi":"để chấp nhận"},{"t":"accept","vi":"chấp nhận"},{"t":"accepting","vi":"đang chấp nhận"},{"t":"accepted","vi":"được chấp nhận (V3)"}],"ans":["D"],"key":"is + (trạng từ) + V3 = bị động · be accepted as = được công nhận là","ex":"Có <b>is<\/b> ở trước (generally chỉ là trạng từ chen vào), nên sau đó là V-ing (tiếp diễn) hoặc V3 (bị động). Chủ ngữ là \"việc dùng hệ thống vân tay\", nó không tự chấp nhận được mà <b>được<\/b> người ta chấp nhận: bị động <b>is accepted<\/b>. Sau chỗ trống cũng không có tân ngữ, nên (C) accepting sai."},{"n":117,"q":"Living further from the city center will _______ your rental costs, but it affects your commute.","qvi":"Sống xa trung tâm thành phố sẽ (giảm) chi phí thuê nhà của bạn, nhưng ảnh hưởng đến việc đi lại.","opts":[{"t":"shorten","vi":"rút ngắn"},{"t":"misplace","vi":"để thất lạc"},{"t":"lower","vi":"hạ thấp, giảm"},{"t":"collapse","vi":"sụp đổ"}],"ans":["C"],"key":"lower costs = giảm chi phí","ex":"Chọn theo nghĩa. Ở xa trung tâm thì tiền thuê nhà rẻ hơn: <b>lower your rental costs<\/b> (giảm chi phí). Chữ <b>but<\/b> cho thấy vế sau là điểm bất lợi (đi lại xa), nên vế trước phải là điểm lợi. (A) shorten dùng cho độ dài, thời gian (shorten a meeting), không dùng cho chi phí."},{"n":118,"q":"FryMate brand cookware can be purchased directly from the company's website or at a retailer _______ you.","qvi":"Bạn có thể mua dụng cụ nấu ăn hiệu FryMate trực tiếp trên trang web của công ty hoặc tại một cửa hàng (gần) bạn.","opts":[{"t":"against","vi":"chống lại"},{"t":"to","vi":"đến, tới"},{"t":"along","vi":"dọc theo"},{"t":"near","vi":"gần"}],"ans":["D"],"key":"a retailer near you = cửa hàng gần bạn","ex":"Chọn giới từ theo nghĩa: cửa hàng <b>gần<\/b> bạn là <b>near you<\/b>, cụm rất hay gặp trong quảng cáo. Against (chống lại), to (hướng tới), along (dọc theo) không hợp nghĩa."},{"n":119,"q":"Weekly _______ of the facility help to ensure that minor maintenance issues are discovered and resolved early.","qvi":"Các cuộc (kiểm tra) hằng tuần tại cơ sở giúp đảm bảo các vấn đề bảo trì nhỏ được phát hiện và xử lý sớm.","opts":[{"t":"investigations","vi":"các cuộc kiểm tra, điều tra (danh từ số nhiều)"},{"t":"investigated","vi":"đã điều tra (V3)"},{"t":"investigative","vi":"mang tính điều tra (tính từ)"},{"t":"investigates","vi":"điều tra (động từ số ít)"}],"ans":["A"],"key":"Sau tính từ (Weekly) cần danh từ · làm chủ ngữ","ex":"<b>Weekly<\/b> (hằng tuần) là tính từ, sau tính từ cần <b>danh từ<\/b>. Cụm \"Weekly ___ of the facility\" là chủ ngữ của động từ <b>help<\/b> (số nhiều), nên chọn danh từ số nhiều <b>investigations<\/b>. (B), (C), (D) không phải danh từ."},{"n":120,"q":"Patients should call the emergency line immediately if they experience _______ changes in temperature.","qvi":"Bệnh nhân nên gọi ngay đường dây cấp cứu nếu thấy nhiệt độ cơ thể thay đổi (đột ngột).","opts":[{"t":"sudden","vi":"đột ngột"},{"t":"contemporary","vi":"đương đại, hiện đại"},{"t":"ideal","vi":"lý tưởng"},{"t":"reasonable","vi":"hợp lý"}],"ans":["A"],"key":"sudden changes = thay đổi đột ngột","ex":"Chọn tính từ theo nghĩa. Phải gọi cấp cứu <b>ngay<\/b> khi nhiệt độ thay đổi <b>đột ngột<\/b>: <b>sudden changes<\/b>. Contemporary (hiện đại), ideal (lý tưởng), reasonable (hợp lý) đều là thay đổi tốt, không cần gọi cấp cứu."}]},{"title":"Câu 121–125","tag":"Cụm cố định · Từ vựng · Trạng từ","qs":[{"n":121,"q":"Participants who are taking part in the half-day historical tour should be at the meeting point _______ than 7:45 A.M.","qvi":"Những người tham gia chuyến tham quan lịch sử nửa ngày nên có mặt ở điểm hẹn (không muộn hơn) 7 giờ 45 sáng.","opts":[{"t":"as for","vi":"còn về"},{"t":"particularly","vi":"đặc biệt là"},{"t":"whenever","vi":"bất cứ khi nào"},{"t":"no later","vi":"không muộn hơn"}],"ans":["D"],"key":"no later than + giờ = không muộn hơn, chậm nhất là","ex":"Thấy chữ <b>than<\/b> ngay sau chỗ trống thì nghĩ ngay đến cụm <b>no later than<\/b> (chậm nhất là). Đây là cụm cố định rất hay gặp trong TOEIC khi nói về hạn chót, giờ hẹn. Ba đáp án còn lại không đi với than."},{"n":122,"q":"The supervisor allowed Mr. Martin to take three additional vacation days because of his _______ achievement.","qvi":"Người giám sát cho anh Martin nghỉ thêm ba ngày phép vì thành tích (đáng chú ý / nổi bật) của anh ấy.","opts":[{"t":"unlimited","vi":"không giới hạn"},{"t":"noteworthy","vi":"đáng chú ý, nổi bật"},{"t":"identical","vi":"giống hệt"},{"t":"satisfied","vi":"hài lòng (người cảm thấy)"}],"ans":["B"],"key":"noteworthy achievement = thành tích nổi bật","ex":"Được thưởng thêm ngày nghỉ là nhờ thành tích <b>nổi bật<\/b>: <b>noteworthy achievement<\/b>. (D) satisfied dùng cho <b>người<\/b> cảm thấy hài lòng (satisfied customers), không dùng cho thành tích. Unlimited (không giới hạn), identical (giống hệt) không hợp nghĩa."},{"n":123,"q":"Ms. Stevens _______ acknowledged that she was unable to complete the task in the specified time frame.","qvi":"Cô Stevens (tiếc nuối) thừa nhận rằng cô ấy không thể hoàn thành công việc trong khoảng thời gian quy định.","opts":[{"t":"regretfully","vi":"một cách tiếc nuối (trạng từ)"},{"t":"regret","vi":"sự tiếc nuối / tiếc (danh từ, động từ)"},{"t":"regrets","vi":"tiếc (động từ số ít)"},{"t":"regretful","vi":"đáng tiếc (tính từ)"}],"ans":["A"],"key":"Giữa chủ ngữ và động từ cần trạng từ (-ly)","ex":"Giống câu 109: chỗ trống đứng giữa chủ ngữ <b>Ms. Stevens<\/b> và động từ <b>acknowledged<\/b>, nên cần <b>trạng từ<\/b>: <b>regretfully<\/b>. (C) regrets là động từ, câu sẽ có 2 động từ liền nhau. (B) và (D) cũng không bổ nghĩa cho động từ được."},{"n":124,"q":"The customer's steak was _______ undercooked, so he requested that it be sent back to the kitchen.","qvi":"Miếng bít tết của khách (khá) chưa chín, nên anh ấy yêu cầu mang lại vào bếp.","opts":[{"t":"rather","vi":"khá, hơi"},{"t":"such","vi":"như vậy, đến nỗi"},{"t":"many","vi":"nhiều"},{"t":"rarely","vi":"hiếm khi"}],"ans":["A"],"key":"rather + tính từ = khá …","ex":"Chỗ trống đứng trước tính từ <b>undercooked<\/b> (chưa chín), cần một từ chỉ mức độ: <b>rather<\/b> (khá). (B) such phải đi với danh từ (such a steak). (C) many đi với danh từ số nhiều. (D) rarely (hiếm khi) sai nghĩa: nếu miếng thịt \"hiếm khi chưa chín\" thì khách đã không trả lại."},{"n":125,"q":"The contact details provided on this survey are for in-house purposes and will not be _______ to a third party.","qvi":"Thông tin liên lạc trong bản khảo sát này chỉ dùng cho mục đích nội bộ và sẽ không được (cung cấp / tiết lộ) cho bên thứ ba.","opts":[{"t":"suspended","vi":"bị đình chỉ"},{"t":"responded","vi":"được trả lời"},{"t":"equipped","vi":"được trang bị"},{"t":"released","vi":"được cung cấp, công bố"}],"ans":["D"],"key":"release information to … = cung cấp, tiết lộ thông tin cho …","ex":"Chọn theo nghĩa. Thông tin cá nhân <b>không được tiết lộ<\/b> cho bên thứ ba: <b>will not be released to a third party<\/b>, câu rất hay gặp trong các mẫu khảo sát. (B) respond là nội động từ (respond to something), không dùng ở dạng bị động như vậy. Suspended, equipped không hợp nghĩa."}]},{"title":"Câu 126–130","tag":"Đại từ · Quan hệ · Từ loại","qs":[{"n":126,"q":"Mr. Brannon can assemble the shelves for the booth _______ as long as he has a set of tools.","qvi":"Anh Brannon có thể (tự mình) lắp ráp các kệ cho gian hàng miễn là anh ấy có một bộ dụng cụ.","opts":[{"t":"his","vi":"của anh ấy"},{"t":"himself","vi":"tự anh ấy (đại từ phản thân)"},{"t":"him","vi":"anh ấy (tân ngữ)"},{"t":"his own","vi":"của riêng anh ấy"}],"ans":["B"],"key":"Câu đã đủ thành phần → đại từ phản thân (himself) để nhấn mạnh \"tự mình\"","ex":"Câu đã đủ: chủ ngữ (Mr. Brannon), động từ (assemble), tân ngữ (the shelves). Chỗ trống chỉ thêm ý nhấn mạnh \"<b>tự mình<\/b> làm\": dùng đại từ phản thân <b>himself<\/b>. (A) his, (D) his own phải có danh từ đi sau. (C) him là tân ngữ, nhưng tân ngữ (the shelves) đã có rồi."},{"n":127,"q":"Ms. Stevenson contacted the real estate agent _______ name and phone number appeared on the advertisement.","qvi":"Cô Stevenson đã liên hệ với người môi giới bất động sản (mà) tên và số điện thoại của người đó có trên quảng cáo.","opts":[{"t":"what","vi":"cái gì"},{"t":"which","vi":"cái mà (chỉ vật)"},{"t":"whose","vi":"của người mà (sở hữu)"},{"t":"who","vi":"người mà"}],"ans":["C"],"key":"whose + danh từ = mà … của người đó","ex":"Sau chỗ trống là danh từ <b>name and phone number<\/b> (tên và số điện thoại), và đó là tên <b>của<\/b> người môi giới. Đại từ quan hệ chỉ sở hữu là <b>whose<\/b>, sau whose luôn có danh từ. (D) who và (B) which phải đi với động từ hoặc chủ ngữ, không đi thẳng với danh từ sở hữu. (A) what không dùng sau một danh từ."},{"n":128,"q":"The home's sale becomes _______ when the official document is recorded at the county office.","qvi":"Việc bán căn nhà trở nên (chính thức / hoàn tất) khi văn bản chính thức được đăng ký tại văn phòng hạt.","opts":[{"t":"finally","vi":"cuối cùng thì (trạng từ)"},{"t":"finalize","vi":"hoàn tất (động từ)"},{"t":"finals","vi":"các trận chung kết (danh từ)"},{"t":"final","vi":"cuối cùng, chính thức, hoàn tất (tính từ)"}],"ans":["D"],"key":"become + tính từ","ex":"Sau động từ <b>becomes<\/b> (trở nên) cần <b>tính từ<\/b>: <b>final<\/b>. Giống như sau is, seem, become đều dùng tính từ. (A) trạng từ, (B) động từ, (C) danh từ số nhiều đều không đứng sau become với nghĩa này."},{"n":129,"q":"The main activity performed at the workshop required team members to _______ with each other.","qvi":"Hoạt động chính tại buổi hội thảo yêu cầu các thành viên trong nhóm phải (hợp tác) với nhau.","opts":[{"t":"cooperate","vi":"hợp tác"},{"t":"oversee","vi":"giám sát"},{"t":"shrink","vi":"co lại"},{"t":"encounter","vi":"tình cờ gặp"}],"ans":["A"],"key":"cooperate with each other = hợp tác với nhau","ex":"Chọn theo nghĩa và giới từ đi kèm. <b>Cooperate with<\/b> = hợp tác với, rất hợp với \"team members … each other\". (B) oversee và (D) encounter đi thẳng với tân ngữ, không cần with (oversee a project). (C) shrink (co lại) sai nghĩa."},{"n":130,"q":"According to the physician, Ms. Oliver's pain _______ within two hours of taking the medication.","qvi":"Theo bác sĩ, cơn đau của cô Oliver (sẽ được làm dịu) trong vòng hai giờ sau khi uống thuốc.","opts":[{"t":"alleviated","vi":"đã làm dịu (chủ động, quá khứ)"},{"t":"will be alleviated","vi":"sẽ được làm dịu (bị động, tương lai)"},{"t":"is alleviating","vi":"đang làm dịu"},{"t":"should alleviate","vi":"chắc sẽ làm dịu (chủ động)"}],"ans":["B"],"key":"alleviate (làm dịu) cần tân ngữ · cơn đau bị làm dịu → bị động","ex":"<b>Alleviate<\/b> nghĩa là \"làm dịu, giảm bớt\" một thứ gì đó: thuốc làm dịu cơn đau. Ở đây chủ ngữ là <b>cơn đau<\/b>, cơn đau <b>được<\/b> làm dịu, nên cần bị động. Chỉ (B) <b>will be alleviated<\/b> là bị động. Sau chỗ trống không có tân ngữ nên (A), (C), (D) dạng chủ động đều sai. Bác sĩ nói về chuyện sau khi uống thuốc nên dùng tương lai (will) là hợp."}]}],"recap":"<h2>Ghi nhớ: nhìn vị trí chỗ trống<\/h2><table><tbody>\n<tr><td><b>Vị trí chỗ trống<\/b><\/td><td><b>Cần từ loại<\/b><\/td><td><b>Câu<\/b><\/td><\/tr>\n<tr><td>a/an/the + ___ + danh từ<\/td><td>tính từ (exciting, agreeable)<\/td><td>101, 104<\/td><\/tr>\n<tr><td>Chủ ngữ + ___ + động từ<\/td><td>trạng từ -ly (aggressively, regretfully)<\/td><td>109, 123<\/td><\/tr>\n<tr><td>who + ___ + động từ<\/td><td>trạng từ (collaboratively)<\/td><td>113<\/td><\/tr>\n<tr><td>Đầu câu / sau tính từ, làm chủ ngữ<\/td><td>danh từ (Charges, investigations)<\/td><td>106, 119<\/td><\/tr>\n<tr><td>become / is + ___<\/td><td>tính từ (final)<\/td><td>128<\/td><\/tr>\n<tr><td>have + người + ___<\/td><td>động từ nguyên mẫu (authorize)<\/td><td>108<\/td><\/tr>\n<tr><td>must / will + ___<\/td><td>động từ nguyên mẫu, vật thì bị động (be imported)<\/td><td>102, 130<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Đại từ và từ nối<\/h2><table><tbody>\n<tr><td>is not <b>ours<\/b> (không có danh từ sau)<\/td><td>đại từ sở hữu<\/td><td>111<\/td><\/tr>\n<tr><td>assemble the shelves <b>himself<\/b><\/td><td>tự mình làm, câu đã đủ<\/td><td>126<\/td><\/tr>\n<tr><td>the agent <b>whose<\/b> name …<\/td><td>whose + danh từ<\/td><td>127<\/td><\/tr>\n<tr><td><b>any<\/b> unattended bag<\/td><td>any + danh từ số ít<\/td><td>107<\/td><\/tr>\n<tr><td><b>no later than<\/b> 7:45<\/td><td>chậm nhất là<\/td><td>121<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Cụm từ vựng nên học thuộc<\/h2><p>conveniently located (103) · attend a workshop (105) · proof of registration (110) · rural and urban settings (114) · lower costs (117) · a retailer near you (118) · sudden changes (120) · noteworthy achievement (122) · rather undercooked (124) · release to a third party (125) · cooperate with (129)<\/p>\n<p><b>Bẫy hay gặp:<\/b> -ing / -ed (exciting hay excited, câu 101); chủ động hay bị động (102, 116, 130): hỏi \"chủ ngữ tự làm hay được làm?\"; số ít hay số nhiều (106, 107).<\/p>\n<p><b>Bài tập về nhà gợi ý:<\/b> với mỗi câu sai, chép lại cả câu đã điền đúng, gạch chân từ đứng trước và sau chỗ trống, ghi tên dạng câu (từ loại / bị động / từ vựng…) vào vở.<\/p>","qviAfter":true};</script>
