<script>window.MT={"n":4,"part":6,"partName":"Part 6","sub":"Text Completion · Điền vào đoạn văn · 16 câu (131–146)","intro":"Trang này chữa <b>Minitest 4 (Part 6)<\/b>. Có 4 đoạn văn, mỗi đoạn 4 chỗ trống: 3 chỗ điền từ / cụm từ và 1 chỗ điền cả câu. <b>Cách học:<\/b> đọc đoạn văn → tự chọn đáp án từng câu → đọc giải thích → mở phần dịch để hiểu cả đoạn.","stepsTitle":"Cách làm Part 6: 3 bước","steps":["<b>Nhìn 4 đáp án trước.<\/b> Nếu 4 đáp án là cùng một từ đổi đuôi (active / actively…) thì đó là câu <b>ngữ pháp<\/b>: chỉ cần đọc câu chứa chỗ trống. Nếu 4 đáp án khác nghĩa thì là câu <b>từ vựng<\/b> hoặc <b>từ nối<\/b>: phải đọc câu trước và câu sau.","<b>Câu từ nối (Therefore, However…):<\/b> xem quan hệ giữa câu trước và câu sau: nguyên nhân → kết quả (<i>Therefore<\/i>), trái ngược (<i>However<\/i>), thêm ý (<i>In addition<\/i>).","<b>Câu điền câu:<\/b> đọc kỹ câu <b>ngay trước và ngay sau<\/b> chỗ trống. Câu đúng phải nối được ý hai bên. Đáp án lặp lại từ trong bài (<i>communities<\/i>, <i>doctor<\/i>…) nhưng sai ý thường là <b>bẫy<\/b>."],"hideOpts":false,"groups":[{"title":"Đoạn 131–134 · Thông báo nội bộ: thay hệ thống thẻ ra vào","tag":"Thông báo (notice)","passage":["To: All Staff","From: Michael Davis, Head Technician","Subject: Network Upgrade","We regret to inform the staff that as of next week, from Monday the 13th of November to sometime midweek, the employee key card system will not be active. In order to get into and out of the building, you will need to buzz security. In order to unlock, or lock, any door, you will ⟦131⟧ assistance from the security team.","The old system was reviewed and many vulnerabilities were discovered. ⟦132⟧, the company has decided to replace the old system. This process should take three to four days.","As part of the process, new key cards will be issued to each member of the staff. Key cards will be available for you to pick up from Wednesday, the 15th of November, in the security office. Please, feel free to stop by any time ⟦133⟧ the day to collect yours. ⟦134⟧","We apologize for any inconvenience this may cause."],"scriptLabel":"📜 Dịch đoạn văn","script":[{"sp":"","t":"To: All Staff. From: Michael Davis, Head Technician. Subject: Network Upgrade.","vi":"Gửi: Toàn thể nhân viên. Từ: Michael Davis, Trưởng bộ phận kỹ thuật. Chủ đề: Nâng cấp hệ thống mạng."},{"sp":"","t":"We regret to inform the staff that as of next week, from Monday the 13th of November to sometime midweek, the employee key card system will not be active.","vi":"Chúng tôi rất tiếc phải thông báo rằng từ tuần sau, từ thứ Hai ngày 13/11 đến khoảng giữa tuần, hệ thống thẻ ra vào của nhân viên sẽ không hoạt động."},{"sp":"","t":"In order to get into and out of the building, you will need to buzz security.","vi":"Để ra vào tòa nhà, các bạn cần bấm chuông gọi bảo vệ."},{"sp":"","t":"(131) In order to unlock, or lock, any door, you will **have to request** assistance from the security team.","vi":"Để mở hoặc khóa bất kỳ cửa nào, các bạn sẽ phải nhờ đội bảo vệ giúp."},{"sp":"","t":"The old system was reviewed and many vulnerabilities were discovered.","vi":"Hệ thống cũ đã được kiểm tra và phát hiện nhiều lỗ hổng (điểm yếu về an ninh)."},{"sp":"","t":"(132) **Therefore**, the company has decided to replace the old system. This process should take three to four days.","vi":"Vì vậy, công ty đã quyết định thay hệ thống cũ. Việc này sẽ mất khoảng ba đến bốn ngày."},{"sp":"","t":"As part of the process, new key cards will be issued to each member of the staff.","vi":"Trong quá trình này, mỗi nhân viên sẽ được cấp thẻ ra vào mới."},{"sp":"","t":"Key cards will be available for you to pick up from Wednesday, the 15th of November, in the security office.","vi":"Các bạn có thể nhận thẻ từ thứ Tư ngày 15/11 tại phòng bảo vệ."},{"sp":"","t":"(133) Please, feel free to stop by any time **during** the day to collect yours.","vi":"Các bạn cứ ghé qua bất cứ lúc nào trong ngày để lấy thẻ của mình."},{"sp":"","t":"(134) **The security office is open 24 hours a day.**","vi":"Phòng bảo vệ mở cửa 24 giờ mỗi ngày."},{"sp":"","t":"We apologize for any inconvenience this may cause.","vi":"Chúng tôi xin lỗi vì sự bất tiện này."}],"qs":[{"n":131,"opts":[{"t":"is requesting","vi":"đang yêu cầu"},{"t":"has requested","vi":"đã yêu cầu"},{"t":"have to request","vi":"phải yêu cầu"},{"t":"had to request","vi":"đã phải yêu cầu"}],"key":"will + động từ nguyên mẫu (V1): will have to request","ex":"Sau will phải là động từ nguyên mẫu không chia. Chỉ (C) have to request bắt đầu bằng động từ nguyên mẫu have. (A) is, (B) has, (D) had đều đã chia nên không đứng sau will được.","q":"","qvi":"","ans":["C"]},{"n":132,"opts":[{"t":"Unfortunately","vi":"Thật không may"},{"t":"Therefore","vi":"Vì vậy, do đó"},{"t":"Regardless","vi":"Bất kể, dù sao"},{"t":"Finally","vi":"Cuối cùng"}],"key":"Nguyên nhân → kết quả: dùng Therefore (vì vậy)","ex":"Câu trước nói hệ thống cũ có nhiều lỗ hổng (nguyên nhân). Câu sau nói công ty quyết định thay hệ thống (kết quả). Nối nguyên nhân với kết quả dùng Therefore. (A) Unfortunately nghe hợp ý \"tin xấu\" nhưng không nối được quan hệ nhân quả; (D) Finally dùng cho bước cuối của một chuỗi việc.","q":"","qvi":"","ans":["B"]},{"n":133,"opts":[{"t":"upon","vi":"ngay khi, dựa trên"},{"t":"during","vi":"trong suốt"},{"t":"before","vi":"trước"},{"t":"at","vi":"tại, vào lúc"}],"key":"during the day = trong ngày","ex":"any time during the day = bất cứ lúc nào trong ngày. during + khoảng thời gian (the day, the meeting…). (C) before the day (trước ngày) không hợp nghĩa; (D) at đi với giờ cụ thể (at 9:00), không nói at the day.","q":"","qvi":"","ans":["B"]},{"n":134,"opts":[{"t":"The move from keys to keyless entry should make the facility more secure.","vi":"Việc chuyển từ chìa khóa sang ra vào không cần chìa sẽ giúp tòa nhà an toàn hơn."},{"t":"We will be looking forward to seeing you sometime next week.","vi":"Chúng tôi mong được gặp bạn vào khoảng tuần sau."},{"t":"The security office is open 24 hours a day.","vi":"Phòng bảo vệ mở cửa 24 giờ mỗi ngày."},{"t":"This is for product security.","vi":"Việc này là vì an toàn sản phẩm."}],"key":"\"stop by any time\" → văn phòng mở 24 giờ","ex":"Câu điền câu: xem câu ngay trước. Câu trước mời nhân viên \"ghé phòng bảo vệ bất cứ lúc nào trong ngày\" để lấy thẻ. Câu (C) giải thích lý do: phòng bảo vệ mở cửa 24/24. (A) sai vì công ty chỉ đổi thẻ cũ sang thẻ mới, không phải chuyển từ chìa khóa sang không chìa. (D) nói \"sản phẩm\", bài không nhắc đến.","q":"","qvi":"","ans":["C"]}]},{"title":"Đoạn 135–138 · Tuyển giáo viên piano","tag":"Quảng cáo tuyển dụng","passage":["Music Teacher Needed","Mike's Music School is ⟦135⟧ seeking a new piano instructor for weekend and evening classes. Mike's Music School has been operating in the Central district since 1992. ⟦136⟧ Because of this, we hope to hire a long-time resident of Central to join our team. Applicants should be well versed in ⟦137⟧ teaching techniques. If you are interested in ⟦138⟧ for the position, we will be holding interviews and auditions this Saturday at 12:00 at our main studio on Elm Street and Dupont Ave."],"scriptLabel":"📜 Dịch đoạn văn","script":[{"sp":"","t":"Music Teacher Needed.","vi":"Cần tuyển giáo viên âm nhạc."},{"sp":"","t":"(135) Mike's Music School is **actively** seeking a new piano instructor for weekend and evening classes.","vi":"Trường nhạc Mike đang tích cực tìm một giáo viên piano mới cho các lớp cuối tuần và buổi tối."},{"sp":"","t":"Mike's Music School has been operating in the Central district since 1992.","vi":"Trường nhạc Mike đã hoạt động ở quận Central từ năm 1992."},{"sp":"","t":"(136) **Our commitment to the community is as important as our commitment to our students.**","vi":"Sự gắn bó của chúng tôi với cộng đồng quan trọng ngang với sự tận tâm với học viên."},{"sp":"","t":"Because of this, we hope to hire a long-time resident of Central to join our team.","vi":"Vì thế, chúng tôi mong tuyển một người đã sống lâu năm ở Central vào đội ngũ."},{"sp":"","t":"(137) Applicants should be well versed in **contemporary** teaching techniques.","vi":"Người ứng tuyển nên thành thạo các phương pháp dạy hiện đại."},{"sp":"","t":"(138) If you are interested in **applying** for the position, we will be holding interviews and auditions this Saturday at 12:00 at our main studio on Elm Street and Dupont Ave.","vi":"Nếu bạn muốn ứng tuyển vị trí này, chúng tôi sẽ tổ chức phỏng vấn và thử tài vào 12 giờ thứ Bảy này tại phòng tập chính ở góc đường Elm và đại lộ Dupont."}],"qs":[{"n":135,"opts":[{"t":"active","vi":"tích cực (tính từ)"},{"t":"actived","vi":"(không có từ này)"},{"t":"actively","vi":"một cách tích cực (trạng từ)"},{"t":"activated","vi":"đã được kích hoạt"}],"key":"is ___ seeking: chỗ trống bổ nghĩa cho động từ → trạng từ (-ly)","ex":"is seeking là động từ (đang tìm). Từ đứng giữa để bổ nghĩa cho động từ là trạng từ, thường có đuôi -ly: actively. (A) active là tính từ, đi với danh từ. (B) actived là từ sai, không tồn tại.","q":"","qvi":"","ans":["C"]},{"n":136,"opts":[{"t":"Our company tries to work with outside communities.","vi":"Công ty chúng tôi cố gắng hợp tác với các cộng đồng bên ngoài."},{"t":"Our commitment to the community is as important as our commitment to our students.","vi":"Sự gắn bó với cộng đồng quan trọng ngang với sự tận tâm với học viên."},{"t":"Our company is unique and uses strange instruments.","vi":"Công ty chúng tôi độc đáo và dùng những nhạc cụ lạ."},{"t":"Our company is in a special location, next to the auto service center.","vi":"Công ty chúng tôi ở vị trí đặc biệt, cạnh trung tâm sửa xe."}],"key":"Câu sau: \"Because of this, … a long-time resident of Central\"","ex":"Câu điền câu: xem câu ngay sau. \"Vì thế, chúng tôi muốn tuyển người sống lâu năm ở Central\". Vậy câu trống phải nói lý do liên quan đến cộng đồng địa phương: (B). (A) là bẫy: có từ communities nhưng nói cộng đồng **bên ngoài**, ngược với ý muốn tuyển người địa phương. (C), (D) không liên quan.","q":"","qvi":"","ans":["B"]},{"n":137,"opts":[{"t":"contemporary","vi":"hiện đại, đương đại"},{"t":"unknown","vi":"không ai biết"},{"t":"strange","vi":"kỳ lạ"},{"t":"boring","vi":"nhàm chán"}],"key":"Từ vựng: contemporary = hiện đại","ex":"Trường muốn giáo viên thành thạo phương pháp dạy hiện đại: contemporary teaching techniques. Các từ còn lại (không ai biết, kỳ lạ, nhàm chán) là ý tiêu cực, không trường nào đưa vào tin tuyển dụng.","q":"","qvi":"","ans":["A"]},{"n":138,"opts":[{"t":"apply","vi":"ứng tuyển (nguyên mẫu)"},{"t":"applied","vi":"đã ứng tuyển"},{"t":"applying","vi":"việc ứng tuyển (V-ing)"},{"t":"to apply","vi":"để ứng tuyển"}],"key":"be interested in + V-ing","ex":"Sau giới từ in dùng danh từ hoặc V-ing: interested in applying. (D) to apply là bẫy: không đi sau giới từ in. (A), (B) cũng không đứng sau giới từ được.","q":"","qvi":"","ans":["C"]}]},{"title":"Đoạn 139–142 · Quảng cáo thuốc ngủ Saldesta","tag":"Quảng cáo","passage":["Saldesta","Rest Your Mind and Body","It's what you've been dreaming of. Peaceful sleep without a struggle is what you need. That's what Saldesta ⟦139⟧. Saldesta helps people fall asleep quickly and stay asleep the entire night. It's the only non-narcotic sleeping aid, and it's ⟦140⟧ for long-term use. ⟦141⟧ Talk to your doctor first before using sleeping aids for extended periods. Tonight, just close your eyes, and leave everything else to Saldesta.","Find out how to improve your sleep at www.saldesta.com. Or call 1-800-Saldesta.","Important Safety Information: Saldesta works quickly and should be taken right ⟦142⟧ bed. Be sure you have at least eight hours to devote to sleep before becoming active. Do not use alcohol while taking Saldesta. Most sleep medication carries some risk of dependency."],"scriptLabel":"📜 Dịch đoạn văn","script":[{"sp":"","t":"Saldesta. Rest Your Mind and Body.","vi":"Saldesta. Cho tâm trí và cơ thể được nghỉ ngơi."},{"sp":"","t":"It's what you've been dreaming of. Peaceful sleep without a struggle is what you need.","vi":"Đó là điều bạn hằng mơ ước. Thứ bạn cần là một giấc ngủ yên bình, không phải vật lộn."},{"sp":"","t":"(139) That's what Saldesta **offers**.","vi":"Đó chính là điều Saldesta mang lại."},{"sp":"","t":"Saldesta helps people fall asleep quickly and stay asleep the entire night.","vi":"Saldesta giúp mọi người ngủ nhanh và ngủ ngon suốt đêm."},{"sp":"","t":"(140) It's the only non-narcotic sleeping aid, and it's **approved** for long-term use.","vi":"Đây là thuốc hỗ trợ giấc ngủ duy nhất không gây nghiện, và đã được phép dùng lâu dài."},{"sp":"","t":"(141) **So you can feel comfortable taking it night after night.**","vi":"Vì vậy bạn có thể yên tâm dùng nó đêm này qua đêm khác."},{"sp":"","t":"Talk to your doctor first before using sleeping aids for extended periods.","vi":"Hãy hỏi bác sĩ trước khi dùng thuốc hỗ trợ giấc ngủ trong thời gian dài."},{"sp":"","t":"Tonight, just close your eyes, and leave everything else to Saldesta.","vi":"Tối nay, bạn chỉ cần nhắm mắt lại, mọi việc còn lại cứ để Saldesta lo."},{"sp":"","t":"Find out how to improve your sleep at www.saldesta.com. Or call 1-800-Saldesta.","vi":"Tìm hiểu cách ngủ ngon hơn tại www.saldesta.com. Hoặc gọi 1-800-Saldesta."},{"sp":"","t":"(142) Important Safety Information: Saldesta works quickly and should be taken right **before** bed.","vi":"Thông tin an toàn quan trọng: Saldesta có tác dụng nhanh và nên uống ngay trước khi đi ngủ."},{"sp":"","t":"Be sure you have at least eight hours to devote to sleep before becoming active.","vi":"Hãy chắc rằng bạn có ít nhất tám tiếng để ngủ trước khi bắt đầu hoạt động."},{"sp":"","t":"Do not use alcohol while taking Saldesta. Most sleep medication carries some risk of dependency.","vi":"Không uống rượu bia khi dùng Saldesta. Phần lớn thuốc ngủ đều có nguy cơ gây phụ thuộc."}],"qs":[{"n":139,"opts":[{"t":"offers","vi":"mang lại, cung cấp"},{"t":"sustains","vi":"duy trì, chống đỡ"},{"t":"mitigates","vi":"làm giảm nhẹ"},{"t":"maintains","vi":"giữ, bảo trì"}],"key":"Từ vựng: offer = mang lại, cung cấp (cho khách)","ex":"Giấc ngủ yên bình là thứ bạn cần, và đó là thứ Saldesta mang lại: offers. (C) mitigates (làm giảm) phải đi với điều xấu như đau, rủi ro. (B), (D) sustains / maintains (duy trì) không hợp: sản phẩm không \"duy trì\" giấc ngủ mà bạn chưa có.","q":"","qvi":"","ans":["A"]},{"n":140,"opts":[{"t":"to approve","vi":"để phê duyệt"},{"t":"approves","vi":"phê duyệt (chủ động)"},{"t":"approving","vi":"đang phê duyệt"},{"t":"approved","vi":"được phê duyệt (bị động)"}],"key":"it's (= it is) + V3: bị động \"được phép\"","ex":"Thuốc không tự phê duyệt, mà **được** cơ quan y tế phê duyệt → câu bị động: is + approved (V3). (B) approves không đứng sau is. (C) is approving nghĩa là thuốc đang đi phê duyệt cái khác, sai nghĩa.","q":"","qvi":"","ans":["D"]},{"n":141,"opts":[{"t":"So you can feel comfortable taking it night after night.","vi":"Vì vậy bạn có thể yên tâm dùng nó đêm này qua đêm khác."},{"t":"Talk to your doctor today to see if it's right for you.","vi":"Hãy hỏi bác sĩ ngay hôm nay xem nó có hợp với bạn không."},{"t":"This is the only stimulant approved for prolonged use that is approved by the FDA.","vi":"Đây là chất kích thích duy nhất được FDA cho phép dùng lâu dài."},{"t":"Enter this code for a free sample and discounts.","vi":"Nhập mã này để nhận mẫu thử miễn phí và giảm giá."}],"key":"\"approved for long-term use\" → \"taking it night after night\"","ex":"Câu điền câu: câu trước nói thuốc được phép dùng lâu dài, nên câu (A) nối tiếp tự nhiên: vì vậy bạn yên tâm dùng mỗi đêm. (B) là bẫy: nghe hợp nhưng câu ngay sau đã nói \"Talk to your doctor first\", đặt (B) vào sẽ bị lặp ý. (C) sai vì thuốc ngủ không phải stimulant (chất kích thích, làm tỉnh). (D) nhắc đến \"mã\" nhưng bài không có mã nào.","q":"","qvi":"","ans":["A"]},{"n":142,"opts":[{"t":"during","vi":"trong lúc"},{"t":"around","vi":"quanh, khoảng"},{"t":"before","vi":"trước"},{"t":"after","vi":"sau"}],"key":"right before bed = ngay trước khi đi ngủ","ex":"Thuốc ngủ có tác dụng nhanh nên uống ngay trước khi đi ngủ: right before bed. (A) during bed (trong lúc ngủ) vô lý; (D) after bed (sau khi ngủ) cũng sai nghĩa.","q":"","qvi":"","ans":["C"]}]},{"title":"Đoạn 143–146 · Xin ý kiến cho tiệc công ty","tag":"Bài đăng trên web","passage":["Employee Message Board","Request for Feedback","Posted by James Frohm, Human Resources Director","Hello colleagues,","The holiday season is fast approaching and we need to ⟦143⟧ our office party! There have been several ⟦144⟧ for locations and themes made to me directly, but I wanted to invite everyone in the office to give me their feedback. All ideas are welcome, but I must remind everyone that our office ⟦145⟧. Our party can include all forms of secular celebration, but out of respect for everyone, there may be no religious themes. Please respond to me directly by e-mail at jamesfrohm@ccn.net, so I can get started making plans. ⟦146⟧","Sincerely,","James"],"scriptLabel":"📜 Dịch đoạn văn","script":[{"sp":"","t":"Employee Message Board. Request for Feedback. Posted by James Frohm, Human Resources Director.","vi":"Bảng tin nhân viên. Xin ý kiến góp ý. Người đăng: James Frohm, Giám đốc Nhân sự."},{"sp":"","t":"Hello colleagues,","vi":"Chào các đồng nghiệp,"},{"sp":"","t":"(143) The holiday season is fast approaching and we need to **plan** our office party!","vi":"Mùa lễ sắp đến rồi và chúng ta cần lên kế hoạch cho bữa tiệc của văn phòng!"},{"sp":"","t":"(144) There have been several **suggestions** for locations and themes made to me directly, but I wanted to invite everyone in the office to give me their feedback.","vi":"Đã có vài gợi ý về địa điểm và chủ đề gửi trực tiếp cho tôi, nhưng tôi muốn mời mọi người trong văn phòng cùng góp ý."},{"sp":"","t":"(145) All ideas are welcome, but I must remind everyone that our office **is a safe space for all customs and cultures**.","vi":"Mọi ý tưởng đều được chào đón, nhưng tôi phải nhắc mọi người rằng văn phòng chúng ta là nơi tôn trọng mọi phong tục và nền văn hóa."},{"sp":"","t":"Our party can include all forms of secular celebration, but out of respect for everyone, there may be no religious themes.","vi":"Bữa tiệc có thể có mọi hình thức vui chơi không thuộc tôn giáo, nhưng để tôn trọng mọi người, sẽ không có chủ đề tôn giáo."},{"sp":"","t":"Please respond to me directly by e-mail at jamesfrohm@ccn.net, so I can get started making plans.","vi":"Hãy trả lời trực tiếp cho tôi qua email jamesfrohm@ccn.net để tôi bắt đầu lên kế hoạch."},{"sp":"","t":"(146) **I look forward to your ideas and enthusiasm.**","vi":"Tôi mong nhận được ý tưởng và sự nhiệt tình của mọi người."},{"sp":"","t":"Sincerely, James","vi":"Trân trọng, James"}],"qs":[{"n":143,"opts":[{"t":"make","vi":"làm"},{"t":"plan","vi":"lên kế hoạch"},{"t":"conceive","vi":"nghĩ ra, hình thành ý tưởng"},{"t":"deliver","vi":"giao, chuyển"}],"key":"plan a party = lên kế hoạch cho bữa tiệc","ex":"Lễ sắp đến nên cần lên kế hoạch cho tiệc: plan our office party. Cuối bài cũng nhắc lại \"get started making **plans**\". (A) make a party không phải cách nói tự nhiên; (D) deliver (giao hàng) sai nghĩa.","q":"","qvi":"","ans":["B"]},{"n":144,"opts":[{"t":"comments","vi":"bình luận, nhận xét"},{"t":"suggestions","vi":"gợi ý, đề xuất"},{"t":"spots","vi":"chỗ, địa điểm"},{"t":"suggested","vi":"đã gợi ý (động từ)"}],"key":"several + danh từ số nhiều; suggestion for = gợi ý cho","ex":"Sau several cần danh từ số nhiều, nên loại (D) suggested (động từ). Người ta gửi gợi ý về địa điểm và chủ đề: suggestions for locations and themes. (A) comments thường đi với on/about, và \"nhận xét\" chưa đúng ý \"đề xuất\" bằng. (C) spots (chỗ) không đi với \"for locations\".","q":"","qvi":"","ans":["B"]},{"n":145,"opts":[{"t":"is a safe space for all customs and cultures","vi":"là nơi tôn trọng mọi phong tục và văn hóa"},{"t":"stays open late on Tuesday","vi":"mở cửa muộn vào thứ Ba"},{"t":"needs a new janitor","vi":"cần một nhân viên vệ sinh mới"},{"t":"will move next week","vi":"sẽ chuyển chỗ vào tuần sau"}],"key":"Câu sau: \"out of respect for everyone, no religious themes\"","ex":"Câu sau nói vì tôn trọng mọi người nên không có chủ đề tôn giáo. Vậy câu trước phải nhắc đến việc tôn trọng các phong tục, văn hóa: (A). Các đáp án còn lại (giờ mở cửa, nhân viên vệ sinh, chuyển văn phòng) không liên quan đến chủ đề bữa tiệc.","q":"","qvi":"","ans":["A"]},{"n":146,"opts":[{"t":"I look forward to your ideas and enthusiasm.","vi":"Tôi mong nhận được ý tưởng và sự nhiệt tình của mọi người."},{"t":"I'm look forward to your ideas and enthusiasm.","vi":"(sai ngữ pháp: I'm look)"},{"t":"I look forward to your undivided attention.","vi":"Tôi mong mọi người tập trung hoàn toàn."},{"t":"I hope you reply before its too late.","vi":"Tôi mong bạn trả lời trước khi quá muộn. (sai: its → it's)"}],"key":"Câu kết thư xin ý kiến: I look forward to your ideas","ex":"Bài đăng xin mọi người góp ý tưởng, nên câu kết hợp nhất là (A). (B) sai ngữ pháp: phải là I look forward hoặc I'm looking forward. (C) \"tập trung hoàn toàn\" không liên quan đến việc xin ý kiến. (D) sai chính tả its (phải là it's) và giọng hơi đe dọa.","q":"","qvi":"","ans":["A"]}]}],"recap":"<h2>Ghi nhớ: các cấu trúc trong bài<\/h2><table><tbody><tr><td><b>Cấu trúc<\/b><\/td><td><b>Ví dụ trong bài<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>will + V nguyên mẫu<\/td><td>will <b>have to request<\/b><\/td><td>131<\/td><\/tr><tr><td>Nguyên nhân → kết quả<\/td><td><b>Therefore<\/b>, the company has decided…<\/td><td>132<\/td><\/tr><tr><td>during + khoảng thời gian<\/td><td>any time <b>during<\/b> the day<\/td><td>133<\/td><\/tr><tr><td>Trạng từ (-ly) bổ nghĩa cho động từ<\/td><td>is <b>actively<\/b> seeking<\/td><td>135<\/td><\/tr><tr><td>Giới từ + V-ing<\/td><td>interested in <b>applying<\/b><\/td><td>138<\/td><\/tr><tr><td>Bị động: be + V3<\/td><td>it's <b>approved<\/b> for long-term use<\/td><td>140<\/td><\/tr><tr><td>several + danh từ số nhiều<\/td><td>several <b>suggestions<\/b><\/td><td>144<\/td><\/tr><\/tbody><\/table><p><b>Câu điền câu (134, 136, 141, 145, 146):<\/b> luôn đọc câu ngay trước và ngay sau. Ví dụ câu 136: câu sau có <i>Because of this<\/i>, nên câu trống phải là lý do.<\/p><p><b>Bẫy lặp từ:<\/b> <i>communities<\/i> (136), <i>doctor<\/i> (141). Có từ giống trong bài chưa chắc là đúng ý.<\/p><p><b>Bài tập về nhà gợi ý:<\/b> chép 7 cấu trúc trong bảng trên vào vở, mỗi cấu trúc tự đặt thêm 1 câu ví dụ.<\/p>"};</script>
