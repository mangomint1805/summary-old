<script>window.MT={"n":7,"part":7,"partName":"Part 7","sub":"Reading Comprehension · Đọc hiểu · 34 câu (147–180)","intro":"Trang này chữa <b>Minitest 7 (Part 7)<\/b>. Mỗi văn bản có hình đề gốc (bấm vào để phóng to), các câu hỏi kèm dịch, và phần dịch ý chính. <b>Cách học:<\/b> đọc câu hỏi → tìm câu trong bài chứa đáp án → tự chọn → đọc giải thích → mở phần dịch xem câu nào chứa đáp án (số câu đánh dấu ở đầu dòng).","stepsTitle":"Cách làm Part 7: 3 bước","steps":["<b>Đọc câu hỏi trước, gạch từ khóa.<\/b> Tên người, ngày tháng, con số (Ms. Ward, September, 12:10…) giúp tìm nhanh chỗ cần đọc trong bài.","<b>Câu hỏi mục đích / chủ đề:<\/b> đọc tiêu đề và đoạn đầu. <b>Câu hỏi chi tiết:<\/b> dò đúng chỗ có từ khóa rồi đọc kỹ câu đó và câu bên cạnh.","<b>Chọn đáp án nói lại ý (paraphrase).<\/b> Đáp án đúng thường dùng từ khác: <i>free shipping → at no charge<\/i>. Đáp án lặp đúng chữ trong bài nhưng sai ý (snacks, community, North Point…) thường là <b>bẫy<\/b>."],"hideOpts":false,"groups":[{"title":"Câu 147–148 · Hóa đơn","tag":"1 văn bản","imgs":["img/mt7/p1.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Henderson Inc. Order for Susan Ward, Pleasantville, NY: (147) **Extra-large microwave**, **Four-door refrigerator**, **Smart toaster**.","vi":"Hóa đơn của công ty Henderson gửi khách Susan Ward (sống ở Pleasantville): lò vi sóng cỡ lớn, tủ lạnh bốn cửa, máy nướng bánh mì thông minh."},{"sp":"","t":"Total due: $2,825.67.","vi":"Tổng tiền phải trả: 2.825,67 đô la."},{"sp":"","t":"(148) **Local customers** are eligible for **free shipping** on purchases **over $1,000**.","vi":"Khách hàng ở địa phương được miễn phí giao hàng khi mua trên 1.000 đô la."}],"qs":[{"n":147,"q":"What does Henderson Inc. sell?","qvi":"Công ty Henderson bán gì?","opts":[{"t":"Home appliances","vi":"Đồ gia dụng (thiết bị điện trong nhà)"},{"t":"Office furniture","vi":"Nội thất văn phòng"},{"t":"Computer equipment","vi":"Thiết bị máy tính"},{"t":"Construction materials","vi":"Vật liệu xây dựng"}],"ans":["A"],"key":"microwave, refrigerator, toaster = home appliances","ex":"Ba món trong hóa đơn là lò vi sóng, tủ lạnh, máy nướng bánh mì: đều là đồ điện dùng trong nhà, gọi chung là home appliances. Không có bàn ghế hay máy tính nên (B), (C) sai."},{"n":148,"q":"What is indicated about Ms. Ward?","qvi":"Điều gì được nói về cô Ward?","opts":[{"t":"She must pick up her items in person.","vi":"Cô ấy phải tự đến lấy hàng."},{"t":"She is eligible for a special discount.","vi":"Cô ấy được giảm giá đặc biệt."},{"t":"She will receive her deliveries at no charge.","vi":"Cô ấy sẽ được giao hàng miễn phí."},{"t":"She paid with a check.","vi":"Cô ấy trả bằng séc."}],"ans":["C"],"key":"free shipping = deliveries at no charge","ex":"Câu cuối: khách địa phương mua trên 1.000 đô được **free shipping**. Cô Ward ở Pleasantville (cùng thành phố với công ty) và tổng tiền 2.825 đô, nên được giao miễn phí: free shipping = at no charge. Đây là dạng câu phải ghép 2 chi tiết (địa chỉ + số tiền). Bài không nói giảm giá hay cách trả tiền nên (B), (D) sai."}]},{"title":"Câu 149–150 · Tin nhắn","tag":"câu hỏi ý định","imgs":["img/mt7/p2.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Dan Cooper: Did you finish your meeting? / Heather Berry: Not yet.","vi":"Dan: Chị họp xong chưa? / Heather: Chưa."},{"sp":"","t":"(149) Heather Berry: I'm free now. **They took a break** for snacks and the bathroom.","vi":"Heather: Giờ chị rảnh rồi. Mọi người đang nghỉ giải lao để ăn nhẹ và đi vệ sinh (tức là cuộc họp chưa xong, chỉ tạm nghỉ)."},{"sp":"","t":"Dan Cooper: I was wondering if you'd **take the interns to lunch** today.","vi":"Dan: Không biết hôm nay chị có thể dẫn các thực tập sinh đi ăn trưa không."},{"sp":"","t":"(150) Heather Berry: Are you **bailing on it**? / Dan Cooper: I have to. I need to be in North Point by 2.","vi":"Heather: Em định bỏ (không đi) à? / Dan: Em buộc phải vậy. Em phải có mặt ở North Point trước 2 giờ."},{"sp":"","t":"Heather Berry: No worries. I'll take them. / Dan Cooper: Thanks. I'd hate to cancel on them.","vi":"Heather: Không sao, chị sẽ dẫn họ đi. / Dan: Cảm ơn chị. Em không muốn hủy hẹn với họ."}],"qs":[{"n":149,"q":"What is suggested about Ms. Berry?","qvi":"Có thể suy ra điều gì về cô Berry?","opts":[{"t":"She is eating a snack.","vi":"Cô ấy đang ăn nhẹ."},{"t":"She will be promoted.","vi":"Cô ấy sắp được thăng chức."},{"t":"She is in the middle of meetings.","vi":"Cô ấy đang họp dở."},{"t":"She plans on cancelling a lunch appointment.","vi":"Cô ấy định hủy một buổi hẹn ăn trưa."}],"ans":["C"],"key":"Not yet + took a break = đang họp dở","ex":"Lúc 10:10 cô nói chưa họp xong, lúc 10:11 cô nói mọi người **nghỉ giải lao**. Vậy cuộc họp vẫn đang diễn ra, cô chỉ rảnh tạm thời. (A) là bẫy lặp từ snacks: người khác nghỉ để ăn nhẹ, không nói cô đang ăn. (D) sai vì chính Dan mới là người không đi ăn trưa."},{"n":150,"q":"At 10:13, what does Ms. Berry mean when she writes, \"Are you bailing on it?\"","qvi":"Lúc 10:13, cô Berry có ý gì khi viết \"Are you bailing on it?\"","opts":[{"t":"She's asking if Mr. Cooper has finished his meeting.","vi":"Cô hỏi anh Cooper họp xong chưa."},{"t":"She's inquiring if Mr. Cooper will be missing the appointment.","vi":"Cô hỏi có phải anh Cooper sẽ vắng mặt ở buổi hẹn không."},{"t":"She wants to know if Mr. Cooper will go to North Point.","vi":"Cô muốn biết anh Cooper có đi North Point không."},{"t":"She would like Mr. Cooper to notify her when he leaves.","vi":"Cô muốn anh Cooper báo khi anh rời đi."}],"ans":["B"],"key":"bail on something = bỏ, không tham gia việc đã hẹn","ex":"Dan nhờ cô dẫn thực tập sinh đi ăn trưa, cô hỏi lại: \"Em định bỏ buổi đó à?\". Dan trả lời \"I have to\" (em buộc phải vậy) và \"I'd hate to cancel\". Vậy câu hỏi nghĩa là anh ấy có **vắng mặt** buổi ăn trưa không. (C) là bẫy: North Point có trong bài nhưng là câu trả lời của Dan, không phải ý của câu hỏi. Mẹo: đọc câu ngay trước và ngay sau câu được trích."}]},{"title":"Câu 151–152 · Tờ rơi rạp phim","tag":"1 văn bản","imgs":["img/mt7/p3.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(151) Superbox Theaters is now offering **reduced prices on matinée tickets** this December. Use this early-bird special and **pay half the price** for the first matinée show.","vi":"Rạp Superbox đang giảm giá vé suất chiếu ban ngày trong tháng 12. Hãy dùng ưu đãi đi sớm này và chỉ trả nửa giá cho suất chiếu ban ngày đầu tiên."},{"sp":"","t":"Tickets can be purchased in person from theater staff or online.","vi":"Có thể mua vé trực tiếp từ nhân viên rạp hoặc mua trên mạng."},{"sp":"","t":"(152) When buying tickets online, we offer the convenience of **choosing your seat number**.","vi":"Khi mua vé trên mạng, bạn được tự chọn số ghế ngồi cho tiện."}],"qs":[{"n":151,"q":"What is indicated about Superbox Theaters?","qvi":"Điều gì được nói về rạp Superbox?","opts":[{"t":"It will screen fewer films this December.","vi":"Tháng 12 này rạp sẽ chiếu ít phim hơn."},{"t":"It is hiring part-timers.","vi":"Rạp đang tuyển nhân viên bán thời gian."},{"t":"It will be adding a new theater location.","vi":"Rạp sẽ mở thêm một địa điểm mới."},{"t":"It is providing lower prices on certain screenings.","vi":"Rạp đang giảm giá cho một số suất chiếu."}],"ans":["D"],"key":"reduced prices on matinée tickets = lower prices on certain screenings","ex":"Câu đầu tiên: rạp giảm giá vé **suất chiếu ban ngày** (matinée). reduced prices = lower prices, matinée tickets = certain screenings (chỉ một số suất). (A) là bẫy lặp từ December: bài không nói chiếu ít phim hơn."},{"n":152,"q":"What are customers able to do on the website?","qvi":"Khách hàng có thể làm gì trên trang web?","opts":[{"t":"Demand a refund","vi":"Yêu cầu hoàn tiền"},{"t":"Select a seat location","vi":"Chọn vị trí ghế ngồi"},{"t":"Sign up for a newsletter","vi":"Đăng ký nhận bản tin"},{"t":"Renew their membership","vi":"Gia hạn thẻ thành viên"}],"ans":["B"],"key":"choosing your seat number = select a seat location","ex":"Bài viết: mua vé online thì được **choose your seat number**, nói lại là select a seat location (choose = select). Trang web còn có thông tin và nhận xét phim, nhưng không có đáp án nào nói vậy. Hoàn tiền, bản tin, thẻ thành viên đều không có trong bài."}]},{"title":"Câu 153–154 · Email đổi lịch họp","tag":"1 văn bản","imgs":["img/mt7/p4.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"This month's business review meeting is scheduled for Thursday, November 15.","vi":"Cuộc họp đánh giá kinh doanh tháng này được xếp vào thứ Năm, ngày 15/11."},{"sp":"","t":"(154) **As an advertising agency**, it's crucial we stay informed about the newest market trends.","vi":"Là một công ty quảng cáo, chúng ta phải luôn nắm được xu hướng thị trường mới nhất."},{"sp":"","t":"I heard that Tsuyoshi Ito, **manager of our Japanese branch**, would be visiting this Friday.","vi":"Tôi nghe nói anh Tsuyoshi Ito, quản lý chi nhánh Nhật Bản của công ty mình, sẽ đến vào thứ Sáu này."},{"sp":"","t":"(153) I would like to **change the meeting date** so that Mr. Ito can attend.","vi":"Tôi muốn đổi ngày họp để anh Ito có thể tham dự."},{"sp":"","t":"I would like you to pick him up from the airport.","vi":"Tôi muốn anh ra sân bay đón anh ấy."}],"qs":[{"n":153,"q":"What is the purpose of the e-mail?","qvi":"Mục đích của email là gì?","opts":[{"t":"To reschedule a meeting","vi":"Để dời lịch một cuộc họp"},{"t":"To request a monthly operating report","vi":"Để yêu cầu báo cáo hoạt động hằng tháng"},{"t":"To introduce a new employee","vi":"Để giới thiệu một nhân viên mới"},{"t":"To propose a new marketing strategy","vi":"Để đề xuất một chiến lược marketing mới"}],"ans":["A"],"key":"change the meeting date = reschedule a meeting","ex":"Tiêu đề là Tuesday's Meeting, và ý chính nằm ở cuối đoạn 1: ông Miller muốn **đổi ngày họp** để anh Ito dự được. change the date = reschedule. (C) sai: anh Ito là quản lý chi nhánh, không phải nhân viên mới."},{"n":154,"q":"What does the e-mail indicate about Mr. Ito?","qvi":"Email cho biết gì về anh Ito?","opts":[{"t":"He is changing positions.","vi":"Anh ấy đang đổi vị trí công việc."},{"t":"He often travels for business.","vi":"Anh ấy hay đi công tác."},{"t":"He works in advertising.","vi":"Anh ấy làm trong ngành quảng cáo."},{"t":"He is a client of Mr. Miller's.","vi":"Anh ấy là khách hàng của ông Miller."}],"ans":["C"],"key":"our Japanese branch (của Miller Advertising) → works in advertising","ex":"Anh Ito là **manager of our Japanese branch**: quản lý chi nhánh Nhật của Miller Advertising, mà công ty này tự giới thiệu là an advertising agency. Vậy anh ấy làm ngành quảng cáo. (B) sai: email nói đây là lần đầu anh đến nước này. (D) sai: anh là người cùng công ty, không phải khách hàng."}]},{"title":"Câu 155–157 · Email về lô hàng","tag":"điền câu","imgs":["img/mt7/p5.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Our shipment of beverages will arrive tomorrow morning around 10:00 A.M.","vi":"Lô hàng đồ uống của chúng ta sẽ đến sáng mai khoảng 10 giờ."},{"sp":"","t":"(155) **Please keep inventory** and **make sure** that all the shipments are accurate as they are unloaded.","vi":"Chị hãy kiểm hàng và đảm bảo mọi lô hàng đều đúng khi dỡ xuống."},{"sp":"","t":"(156) Some of the beverages will need to be **refrigerated** right away.","vi":"Một số đồ uống cần cho vào tủ lạnh ngay."},{"sp":"","t":"– [2] – (157) The **temperatures are expected to be high** tomorrow so we'll need to get all the shipments to storage as soon as possible.","vi":"[2] Nhiệt độ ngày mai dự báo sẽ cao, nên ta cần đưa hết hàng vào kho càng sớm càng tốt."},{"sp":"","t":"If there are any problems, please contact me by phone.","vi":"Nếu có vấn đề gì, hãy gọi điện cho tôi."}],"qs":[{"n":155,"q":"What is the purpose of the e-mail?","qvi":"Mục đích của email là gì?","opts":[{"t":"To inform the suppliers of a mistake","vi":"Để báo cho nhà cung cấp về một lỗi"},{"t":"To give an employee instructions","vi":"Để hướng dẫn công việc cho một nhân viên"},{"t":"To order a shipment of beverages","vi":"Để đặt một lô đồ uống"},{"t":"To keep inventory of products","vi":"Để kiểm kê hàng hóa"}],"ans":["B"],"key":"Please keep… / make sure… = instructions","ex":"Victor viết cho Bridget toàn câu dặn việc: Please keep inventory, make sure…, please make sure…. Đó là **hướng dẫn** cho nhân viên. (D) là bẫy lặp từ keep inventory: đó là một việc Bridget phải làm, không phải mục đích của cả email. (C) sai: hàng đã đặt rồi, sáng mai đến."},{"n":156,"q":"Why is Victor concerned about the shipment?","qvi":"Vì sao Victor lo về lô hàng?","opts":[{"t":"The products are fragile.","vi":"Hàng dễ vỡ."},{"t":"They may arrive late.","vi":"Hàng có thể đến trễ."},{"t":"They are temperature sensitive.","vi":"Hàng dễ hỏng vì nhiệt độ."},{"t":"They are for an important client.","vi":"Hàng dành cho khách quan trọng."}],"ans":["C"],"key":"need to be refrigerated + temperatures high = temperature sensitive","ex":"Đồ uống phải cho vào tủ lạnh ngay, và trời mai sẽ nóng, nên phải đưa vào kho sớm, còn gửi xe lạnh. Tất cả đều nói hàng **nhạy cảm với nhiệt độ**. Bài không nói hàng dễ vỡ hay đến trễ."},{"n":157,"q":"In which of the positions marked [1], [2], [3] and [4] does the following sentence belong? \"I'm worried about the weather.\"","qvi":"Câu sau đặt ở vị trí nào trong [1], [2], [3], [4]? \"Tôi lo về thời tiết.\"","opts":[{"t":"[1]","vi":"Vị trí [1]"},{"t":"[2]","vi":"Vị trí [2]"},{"t":"[3]","vi":"Vị trí [3]"},{"t":"[4]","vi":"Vị trí [4]"}],"ans":["B"],"key":"worried about the weather → ngay sau là temperatures are expected to be high","ex":"Câu cần điền nói \"lo về thời tiết\", nên câu ngay sau phải giải thích thời tiết thế nào. Sau [2] là The temperatures are expected to be high tomorrow (mai trời nóng): khớp ý. Đặt ở [1], [3], [4] thì câu trước/sau không nói gì về thời tiết."}]},{"title":"Câu 158–160 · Quảng cáo tiệm bánh","tag":"1 văn bản","imgs":["img/mt7/p6.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Marigold Bakery is a family-run business that has been making sweet treats for over 30 years.","vi":"Tiệm bánh Marigold là cơ sở gia đình, làm bánh ngọt hơn 30 năm nay."},{"sp":"","t":"(158) We offer: **Gluten- or sugar-free** refreshments and **vegetarian** sandwiches.","vi":"Chúng tôi có: đồ ăn nhẹ không gluten hoặc không đường, và bánh mì kẹp chay."},{"sp":"","t":"(159) We will be **closing this September** in order to **expand the size of our store**.","vi":"Tháng 9 này tiệm sẽ đóng cửa để mở rộng diện tích cửa hàng."},{"sp":"","t":"(160) We are currently holding a cooking class **for teenagers in the community**.","vi":"Hiện tiệm đang mở lớp nấu ăn cho các bạn tuổi teen trong khu vực."}],"qs":[{"n":158,"q":"What is mentioned about Marigold Bakery?","qvi":"Điều gì được nhắc đến về tiệm bánh Marigold?","opts":[{"t":"It is internationally known.","vi":"Tiệm nổi tiếng thế giới."},{"t":"It employs local students.","vi":"Tiệm thuê học sinh địa phương."},{"t":"It offers options for those with dietary restrictions.","vi":"Tiệm có món cho người phải ăn kiêng."},{"t":"Its store space can be rented for various events.","vi":"Có thể thuê mặt bằng tiệm để tổ chức sự kiện."}],"ans":["C"],"key":"gluten-free, sugar-free, vegetarian = for those with dietary restrictions","ex":"Mục We offer có đồ không gluten, không đường, bánh chay: đó là món cho người **ăn kiêng** (dietary restrictions: những giới hạn trong ăn uống). (D) là bẫy: tiệm làm bánh cho tiệc cưới, sự kiện công ty, chứ không cho thuê chỗ."},{"n":159,"q":"According to the advertisement, what will happen in September?","qvi":"Theo quảng cáo, chuyện gì sẽ xảy ra vào tháng 9?","opts":[{"t":"The store will shut down for renovations.","vi":"Tiệm sẽ đóng cửa để sửa sang."},{"t":"A classroom will be constructed.","vi":"Một phòng học sẽ được xây."},{"t":"The menu will be expanded.","vi":"Thực đơn sẽ có thêm món."},{"t":"The shop will cater a community event.","vi":"Tiệm sẽ cung cấp đồ ăn cho một sự kiện cộng đồng."}],"ans":["A"],"key":"closing to expand the size of our store = shut down for renovations","ex":"Mục Hours: tháng 9 tiệm **đóng cửa** để **mở rộng cửa hàng**. closing = shut down, mở rộng tiệm là một kiểu sửa sang (renovations). (C) là bẫy: expand nói về diện tích tiệm, không phải thực đơn."},{"n":160,"q":"What is indicated about the cooking class?","qvi":"Điều gì được nói về lớp nấu ăn?","opts":[{"t":"It will be held at a community center this year.","vi":"Năm nay lớp học ở nhà văn hóa."},{"t":"It has been going on for over 30 years.","vi":"Lớp đã mở hơn 30 năm."},{"t":"It is taught by an experienced baker.","vi":"Lớp do một thợ làm bánh giàu kinh nghiệm dạy."},{"t":"It is designed for local teenagers.","vi":"Lớp dành cho thanh thiếu niên địa phương."}],"ans":["D"],"key":"for teenagers in the community = for local teenagers","ex":"Mục cuối: lớp nấu ăn dành cho **teenagers in the community**, nói lại là local teenagers. (B) là bẫy: \"hơn 30 năm\" là tuổi của tiệm, không phải của lớp học. (A) bẫy lặp từ community."}]},{"title":"Câu 161–164 · Trò chuyện trực tuyến","tag":"câu hỏi ý định","imgs":["img/mt7/p7.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Peter Jones: I'm heading to the new pizza parlor across the street for lunch. Does anyone want to join me?","vi":"Peter: Tôi sang tiệm pizza mới bên kia đường ăn trưa. Có ai muốn đi cùng không?"},{"sp":"","t":"(162) Martin Lee: **Count me in!**","vi":"Martin: Cho tôi đi với!"},{"sp":"","t":"(161) Laura Vans: Theo and I are working on **our presentation** for tomorrow so we can't.","vi":"Laura: Tôi với Theo đang làm bài thuyết trình cho ngày mai nên không đi được."},{"sp":"","t":"(163) Peter Jones: Is your presentation about **the new product line**? / Laura Vans: Yes, we're almost finished but we're working on making **the visuals** more impressive.","vi":"Peter: Bài thuyết trình về dòng sản phẩm mới à? / Laura: Đúng, gần xong rồi, nhưng bọn tôi đang làm cho phần hình ảnh ấn tượng hơn."},{"sp":"","t":"(164) Martin Lee: I can **help you with the visuals**. I have a bit of a background in **computer graphics**.","vi":"Martin: Tôi có thể giúp phần hình ảnh. Tôi có chút kinh nghiệm về đồ họa máy tính."}],"qs":[{"n":161,"q":"Where most likely are the participants?","qvi":"Những người tham gia nhiều khả năng đang ở đâu?","opts":[{"t":"At a restaurant","vi":"Ở nhà hàng"},{"t":"At a pizza shop","vi":"Ở tiệm pizza"},{"t":"At a company","vi":"Ở công ty"},{"t":"In an electronics shop","vi":"Ở cửa hàng điện tử"}],"ans":["C"],"key":"presentation, new product line → đồng nghiệp ở công ty","ex":"Họ hỏi nhau đi ăn trưa, đang làm bài thuyết trình về **dòng sản phẩm mới**: đó là đồng nghiệp đang ở **công ty**. (B) là bẫy: tiệm pizza là nơi Peter sắp đi, không phải nơi họ đang ở."},{"n":162,"q":"At 12:10, what does Martin Lee mean when he says, \"Count me in\"?","qvi":"Lúc 12:10, Martin Lee có ý gì khi nói \"Count me in\"?","opts":[{"t":"He's doing a presentation.","vi":"Anh ấy đang làm thuyết trình."},{"t":"He's in his office.","vi":"Anh ấy đang ở văn phòng."},{"t":"He would like to go out for lunch.","vi":"Anh ấy muốn đi ăn trưa."},{"t":"He's currently in a meeting.","vi":"Anh ấy đang họp."}],"ans":["C"],"key":"Count me in = tính cả tôi vào (tôi tham gia)","ex":"Peter hỏi \"có ai muốn đi ăn trưa cùng không?\", Martin trả lời \"Count me in!\" nghĩa là **cho tôi tham gia**. Vậy anh muốn đi ăn trưa. Sau đó Peter cũng nói \"When Martin and I come back\": hai người cùng đi."},{"n":163,"q":"What is indicated about the presentation?","qvi":"Điều gì được nói về bài thuyết trình?","opts":[{"t":"It will be presented after lunch.","vi":"Sẽ trình bày sau bữa trưa."},{"t":"It is about new products.","vi":"Nói về sản phẩm mới."},{"t":"It is very long.","vi":"Rất dài."},{"t":"It needs more information.","vi":"Cần thêm thông tin."}],"ans":["B"],"key":"the new product line = new products","ex":"Peter hỏi bài có phải về the new product line không, Laura trả lời **Yes**. (A) sai: thuyết trình vào ngày mai. (D) sai: Laura nói gần xong rồi, chỉ cần làm hình ảnh đẹp hơn, không thiếu thông tin."},{"n":164,"q":"What will Martin Lee most likely help the presenters with?","qvi":"Martin Lee nhiều khả năng sẽ giúp người thuyết trình việc gì?","opts":[{"t":"Their graphics","vi":"Phần đồ họa (hình ảnh)"},{"t":"Their information","vi":"Phần thông tin"},{"t":"Their computer use","vi":"Việc dùng máy tính"},{"t":"Their presentation format","vi":"Bố cục bài thuyết trình"}],"ans":["A"],"key":"help you with the visuals = graphics","ex":"Martin nói: \"I can help you with **the visuals**… computer graphics\". visuals (hình ảnh minh họa) = graphics. (C) là bẫy: Theo nói họ dùng tốt các chương trình máy tính cơ bản rồi, chỉ yếu phần làm hình."}]},{"title":"Câu 165–167 · Email dọn dẹp công viên","tag":"câu hỏi NOT","imgs":["img/mt7/p8.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(165) I am **urging all of our employees to take part in** the upcoming **community park cleanup** sponsored by the city of Harrisburg.","vi":"Tôi kêu gọi toàn bộ nhân viên tham gia buổi dọn dẹp công viên của cộng đồng sắp tới, do thành phố Harrisburg tài trợ."},{"sp":"","t":"The cleanup will be held next Friday, February 18, from 1:00 to 5:00 P.M.","vi":"Buổi dọn dẹp diễn ra thứ Sáu tới, 18/2, từ 1 giờ đến 5 giờ chiều."},{"sp":"","t":"(166) Volunteers are asked to bring supplies such as **protective outerwear, tools, insect repellent, trash bags, and snacks**.","vi":"Tình nguyện viên được đề nghị mang theo đồ như áo khoác bảo hộ, dụng cụ, thuốc chống côn trùng, túi rác và đồ ăn nhẹ."},{"sp":"","t":"(167) If you have a specific preference concerning **the type of work** you would like to do, please **contact Event Organizer Don Lewis**.","vi":"Nếu bạn muốn làm một loại việc cụ thể, hãy liên hệ người tổ chức sự kiện Don Lewis."}],"qs":[{"n":165,"q":"What is the purpose of the e-mail?","qvi":"Mục đích của email là gì?","opts":[{"t":"To organize a business trip","vi":"Để tổ chức chuyến công tác"},{"t":"To request updated information","vi":"Để yêu cầu thông tin mới cập nhật"},{"t":"To offer additional skills training","vi":"Để mở thêm khóa đào tạo kỹ năng"},{"t":"To promote a community event","vi":"Để kêu gọi tham gia một sự kiện cộng đồng"}],"ans":["D"],"key":"urging employees to take part in the community park cleanup = promote a community event","ex":"Mục đích thường nằm ở đoạn đầu: ông Hanes **kêu gọi** nhân viên tham gia buổi dọn công viên của cộng đồng. promote ở đây là quảng bá, kêu gọi mọi người tham gia. Có xe buýt đưa đi nhưng không phải chuyến công tác nên (A) sai."},{"n":166,"q":"What would probably NOT be necessary for participants?","qvi":"Thứ gì có lẽ KHÔNG cần cho người tham gia?","opts":[{"t":"A company uniform","vi":"Đồng phục công ty"},{"t":"A mosquito spray can","vi":"Bình xịt muỗi"},{"t":"A rake","vi":"Cái cào"},{"t":"A sandwich","vi":"Bánh mì kẹp"}],"ans":["A"],"key":"Câu NOT: dò từng đáp án, cái nào KHÔNG có trong bài là đáp án","ex":"Danh sách đồ cần mang: áo bảo hộ, **dụng cụ** (cái cào là một dụng cụ), **thuốc chống côn trùng** (bình xịt muỗi), túi rác, **đồ ăn nhẹ** (bánh mì kẹp). Chỉ có **đồng phục công ty** là không được nhắc. Chú ý: protective outerwear là áo bảo hộ, không phải đồng phục."},{"n":167,"q":"According to the e-mail, what is Mr. Lewis responsible for?","qvi":"Theo email, ông Lewis phụ trách việc gì?","opts":[{"t":"Raising awareness about food waste","vi":"Nâng cao nhận thức về lãng phí thức ăn"},{"t":"Analyzing customer feedback","vi":"Phân tích ý kiến khách hàng"},{"t":"Assigning individuals tasks","vi":"Phân công việc cho từng người"},{"t":"Cleaning a community center","vi":"Dọn dẹp nhà văn hóa"}],"ans":["C"],"key":"preference concerning the type of work → contact Don Lewis = assigning tasks","ex":"Muốn chọn loại việc mình làm thì liên hệ ông Don Lewis, người tổ chức. Nghĩa là ông ấy **phân công việc** cho mọi người. (D) là bẫy: buổi dọn dẹp ở công viên, không phải nhà văn hóa."}]},{"title":"Câu 168–171 · Trang web đại lý ô tô","tag":"từ đồng nghĩa","imgs":["img/mt7/p9.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(168) Carlos Sanchez always had **the dream of owning his own car dealership**… After saving his money for ten years, he **finally opened Sanchez Motors**.","vi":"Carlos Sanchez luôn mơ có đại lý ô tô của riêng mình… Sau mười năm dành dụm, cuối cùng ông mở được Sanchez Motors."},{"sp":"","t":"(169) Sanchez Motors **carries** all kinds of vehicles, from sports cars and vans to SUVs and trucks.","vi":"Sanchez Motors bán đủ loại xe, từ xe thể thao, xe van đến xe SUV và xe tải."},{"sp":"","t":"(170) Come on down and **try driving** a variety of vehicles to see what's right for you.","vi":"Hãy ghé qua và lái thử nhiều loại xe để xem xe nào hợp với bạn."},{"sp":"","t":"(171) Until the end of the year… If you make a down payment of just $3,000, you will be eligible for **an extremely low interest rate on your monthly installments**.","vi":"Đến hết năm… Nếu bạn trả trước chỉ 3.000 đô, bạn sẽ được lãi suất cực thấp khi trả góp hằng tháng."},{"sp":"","t":"Sanchez Motors is located just outside of the town of Stockton. We are open 7 days a week.","vi":"Sanchez Motors nằm ngay ngoài thị trấn Stockton. Mở cửa cả 7 ngày trong tuần."}],"qs":[{"n":168,"q":"What is indicated about Mr. Sanchez?","qvi":"Điều gì được nói về ông Sanchez?","opts":[{"t":"He works at an auto repair shop.","vi":"Ông làm ở tiệm sửa xe."},{"t":"He started his own business.","vi":"Ông tự mở công ty riêng."},{"t":"He is a race car driver.","vi":"Ông là tay đua xe."},{"t":"He designs a variety of vehicles.","vi":"Ông thiết kế nhiều loại xe."}],"ans":["B"],"key":"opened Sanchez Motors (own car dealership) = started his own business","ex":"Ông mơ có đại lý xe riêng và cuối cùng đã **mở Sanchez Motors**: started his own business. (A) là bẫy: tiệm sửa xe là nơi ông làm trước đây (started working as an assistant), giờ không còn."},{"n":169,"q":"The word \"carries\" in paragraph 1, line 4, is closest in meaning to","qvi":"Từ \"carries\" ở đoạn 1, dòng 4 gần nghĩa nhất với","opts":[{"t":"moves","vi":"di chuyển, chở"},{"t":"manufactures","vi":"sản xuất"},{"t":"sells","vi":"bán"},{"t":"develops","vi":"phát triển"}],"ans":["C"],"key":"carry (cửa hàng carries hàng) = có bán","ex":"carry thường nghĩa là \"mang, chở\", nhưng khi nói cửa hàng carries sản phẩm thì nghĩa là **có bán** mặt hàng đó. Sanchez Motors là đại lý xe, nên carries all kinds of vehicles = bán đủ loại xe. (A) moves là bẫy nghĩa quen thuộc. Mẹo: thay từng đáp án vào câu xem câu nào hợp nghĩa."},{"n":170,"q":"What is suggested about Sanchez Motors?","qvi":"Có thể suy ra điều gì về Sanchez Motors?","opts":[{"t":"It allows customers to test products.","vi":"Cho khách dùng thử sản phẩm."},{"t":"It operates a store in downtown Stockton.","vi":"Có cửa hàng ở trung tâm Stockton."},{"t":"It offers vehicle customization.","vi":"Nhận độ xe theo ý khách."},{"t":"It closes on weekends.","vi":"Đóng cửa cuối tuần."}],"ans":["A"],"key":"try driving vehicles = test products","ex":"Bài mời khách **lái thử** nhiều loại xe: try driving = test, vehicles = products. (B) sai: tiệm ở ngoài thị trấn Stockton, không phải trung tâm. (D) sai: mở cả 7 ngày."},{"n":171,"q":"What is available to customers until the end of the year?","qvi":"Khách hàng được hưởng gì cho đến hết năm?","opts":[{"t":"Discounts on sports cars and vans","vi":"Giảm giá xe thể thao và xe van"},{"t":"An extended warranty at no extra cost","vi":"Bảo hành kéo dài miễn phí"},{"t":"A special payment option","vi":"Một cách thanh toán đặc biệt"},{"t":"A free oil change with any purchase","vi":"Thay dầu miễn phí khi mua xe"}],"ans":["C"],"key":"down payment $3,000 + low interest on monthly installments = special payment option","ex":"Đoạn 2: đến hết năm, trả trước 3.000 đô thì được **lãi suất rất thấp khi trả góp**. Đây là một cách thanh toán ưu đãi. (A) là bẫy: ưu đãi dành cho xe bán tải và SUV, còn sports cars and vans lấy từ đoạn 1, và cũng không phải giảm giá."}]},{"title":"Câu 172–175 · Bài báo nhà máy mới","tag":"điền câu","imgs":["img/mt7/p10.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(172) The town of Korden has much to celebrate as the new hydrogen fuel car company, Newmark, **plans to open a massive manufacturing plant** in the next few months. – [1] –","vi":"Thị trấn Korden có nhiều điều để ăn mừng vì Newmark, công ty xe chạy bằng nhiên liệu hydro mới, định mở một nhà máy sản xuất rất lớn trong vài tháng tới. [1]"},{"sp":"","t":"Newmark already supplies some of the greenest cities around the world with hydrogen-fueled public buses and taxis. – [2] –","vi":"Newmark đã cung cấp xe buýt và taxi chạy hydro cho một số thành phố xanh nhất thế giới. [2]"},{"sp":"","t":"(174) The company is **forecast to grow** by 120% in the next 5 years. Furthermore, the opening of the plant in Korden is expected to **bring in 300 new jobs**. – [3] –","vi":"Công ty được dự báo tăng trưởng 120% trong 5 năm tới. Hơn nữa, nhà máy ở Korden dự kiến tạo ra 300 việc làm mới. [3]"},{"sp":"","t":"(173) **The old Handai facilities** will be **the site of the new Newmark facilities**.","vi":"Các cơ sở cũ của Handai sẽ là nơi đặt cơ sở mới của Newmark."},{"sp":"","t":"The mayor of Korden is also working to provide government subsidies to those who purchase a hydrogen-fueled car. – [4] –","vi":"Thị trưởng Korden cũng đang tìm cách hỗ trợ tiền cho người mua xe chạy hydro. [4]"},{"sp":"","t":"(175) Câu cần điền: This is **welcome news** for a town that has **suffered economically** after the closure of its car manufacturing plants in the 1990's.","vi":"Đây là tin vui cho một thị trấn đã gặp khó khăn về kinh tế sau khi các nhà máy ô tô đóng cửa vào thập niên 1990 và kinh tế đình trệ từ đó đến nay."}],"qs":[{"n":172,"q":"What is the main topic of the article?","qvi":"Chủ đề chính của bài báo là gì?","opts":[{"t":"Alternative energy sources","vi":"Các nguồn năng lượng thay thế"},{"t":"Environmentally friendly cities","vi":"Các thành phố thân thiện môi trường"},{"t":"The opening of a new factory","vi":"Việc mở một nhà máy mới"},{"t":"The future of car companies","vi":"Tương lai của các hãng xe"}],"ans":["C"],"key":"plans to open a massive manufacturing plant = the opening of a new factory","ex":"Câu đầu bài nói ý chính: Newmark sắp **mở nhà máy lớn** ở Korden (plant = factory). Các câu sau đều nói về lợi ích của nhà máy này. (A), (B) là bẫy: hydro và thành phố xanh chỉ là chi tiết phụ."},{"n":173,"q":"What will happen to the old car factories?","qvi":"Chuyện gì sẽ xảy ra với các nhà máy ô tô cũ?","opts":[{"t":"They will be destroyed and rebuilt.","vi":"Sẽ bị phá đi và xây lại."},{"t":"They will be the new site of the hydrogen fuel car company.","vi":"Sẽ là nơi đặt cơ sở mới của công ty xe hydro."},{"t":"They will be turned into office buildings.","vi":"Sẽ được chuyển thành tòa văn phòng."},{"t":"They will house all the old conventional cars.","vi":"Sẽ chứa tất cả xe chạy xăng cũ."}],"ans":["B"],"key":"the old Handai facilities will be the site of the new Newmark facilities","ex":"Câu sau [3]: **cơ sở cũ của Handai** (hãng xe cũ) sẽ là nơi đặt cơ sở mới của Newmark (công ty xe hydro). Gần như giữ nguyên chữ site. Bài không nói phá đi hay làm văn phòng."},{"n":174,"q":"What is suggested about Korden?","qvi":"Có thể suy ra điều gì về Korden?","opts":[{"t":"It will become one of the greenest cities.","vi":"Sẽ thành một trong những thành phố xanh nhất."},{"t":"Its economy will stay stagnant.","vi":"Kinh tế sẽ tiếp tục đình trệ."},{"t":"It will attract new car companies.","vi":"Sẽ thu hút thêm nhiều hãng xe mới."},{"t":"It will grow economically.","vi":"Kinh tế sẽ phát triển."}],"ans":["D"],"key":"300 new jobs + company forecast to grow = grow economically","ex":"Nhà máy mới mang đến **300 việc làm**, công ty dự báo tăng trưởng mạnh: kinh tế Korden sẽ **đi lên**. (A) là bẫy: \"thành phố xanh nhất\" là những nơi Newmark đã cung cấp xe (Vancouver, Singapore…), không phải Korden. (B) ngược nghĩa. (C) sai: chỉ có một công ty là Newmark."},{"n":175,"q":"In which of the positions marked [1], [2], [3] and [4] does the following sentence belong? \"This is welcome news for a town that has suffered economically after the closure of its car manufacturing plants in the 1990's and after its stagnant growth since then.\"","qvi":"Câu sau đặt ở vị trí nào? \"Đây là tin vui cho một thị trấn đã khó khăn về kinh tế sau khi các nhà máy ô tô đóng cửa vào thập niên 1990 và đình trệ từ đó đến nay.\"","opts":[{"t":"[1]","vi":"Vị trí [1]"},{"t":"[2]","vi":"Vị trí [2]"},{"t":"[3]","vi":"Vị trí [3]"},{"t":"[4]","vi":"Vị trí [4]"}],"ans":["C"],"key":"welcome news (tin vui) + suffered economically → nối với tin tốt phía trước và ý kinh tế phía sau","ex":"Theo đáp án, câu nằm ở [2]: \"tin vui\" chỉ việc một công ty đã cung cấp xe cho các thành phố xanh nhất thế giới nay mở nhà máy ở Korden. Sau đó các câu tiếp tục nói về lợi ích **kinh tế** (tăng trưởng 120%, 300 việc làm), nối với ý \"thị trấn đã khó khăn về kinh tế\". Mẹo dạng điền câu: tìm từ chỉ lại ý phía trước (This, news) và ý được nói tiếp phía sau."}]},{"title":"Câu 176–180 · Email + trang web ngân hàng","tag":"2 văn bản","imgs":["img/mt7/p11.jpg"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Email của Kevin Draper gửi Sam Brown: Below is a summary of the loan: (180) **Home Opportunity Loan**, $70,000, 15 years.","vi":"Email: Dưới đây là tóm tắt khoản vay của anh: Khoản vay \"Cơ hội mua nhà\", 70.000 đô, trả trong 15 năm."},{"sp":"","t":"(176) We advise you to **schedule a time to meet** with Ms. King so she can help to further familiarize you with your home loan.","vi":"Chúng tôi khuyên anh hẹn một buổi gặp chị King để chị ấy giúp anh hiểu rõ hơn về khoản vay mua nhà."},{"sp":"","t":"(177) If you sign up for our **online banking services**, you will be able to quickly and conveniently **check on your repayment progress**.","vi":"Nếu anh đăng ký dịch vụ ngân hàng trực tuyến, anh có thể kiểm tra tiến độ trả nợ nhanh và tiện."},{"sp":"","t":"(178) Trang web: Listed below are **the various home loans** available… Review **the loan choices** below.","vi":"Trang web: Dưới đây là các loại khoản vay mua nhà… Hãy xem các lựa chọn vay và chọn loại hợp với bạn."},{"sp":"","t":"(179) **Interest-Only Mortgage Loan**: This option is suitable for those with **fluctuating incomes**.","vi":"Vay chỉ trả lãi: Lựa chọn này hợp với người có thu nhập lên xuống thất thường."},{"sp":"","t":"(180) **Home Opportunity Loan**: This special loan is designed for **first-time home buyers**.","vi":"Vay \"Cơ hội mua nhà\": Khoản vay đặc biệt dành cho người mua nhà lần đầu."}],"qs":[{"n":176,"q":"What does Mr. Draper suggest Mr. Brown do?","qvi":"Ông Draper gợi ý ông Brown làm gì?","opts":[{"t":"Apply for a position","vi":"Ứng tuyển một vị trí"},{"t":"Arrange a meeting","vi":"Sắp xếp một buổi gặp"},{"t":"Make a down payment in April","vi":"Trả trước tiền vào tháng 4"},{"t":"Become a bank member","vi":"Trở thành thành viên ngân hàng"}],"ans":["B"],"key":"We advise you to schedule a time to meet = arrange a meeting","ex":"We advise you to… là dấu hiệu của lời gợi ý: hẹn gặp chị King. schedule a time to meet = arrange a meeting. (D) là bẫy: chữ members nằm ở trang web, và ông Brown đã vay ở ngân hàng này rồi."},{"n":177,"q":"How is Mr. Brown advised to keep track of his loan?","qvi":"Ông Brown được khuyên theo dõi khoản vay bằng cách nào?","opts":[{"t":"By meeting with Mr. Draper","vi":"Gặp ông Draper"},{"t":"By reading a regular e-mail from a bank","vi":"Đọc email ngân hàng gửi định kỳ"},{"t":"By using banking services on the Internet","vi":"Dùng dịch vụ ngân hàng trên mạng"},{"t":"By calling a bank hotline","vi":"Gọi đường dây nóng của ngân hàng"}],"ans":["C"],"key":"online banking services = banking services on the Internet; check on repayment progress = keep track","ex":"Đăng ký **online banking** thì kiểm tra được tiến độ trả nợ. online = on the Internet, check on progress = keep track. (A) sai: người cần gặp là chị King, không phải ông Draper."},{"n":178,"q":"What information does the web page provide?","qvi":"Trang web cung cấp thông tin gì?","opts":[{"t":"Bank account statements","vi":"Sao kê tài khoản"},{"t":"Quarterly interest rates","vi":"Lãi suất theo quý"},{"t":"Repayment options","vi":"Các lựa chọn trả nợ"},{"t":"A roster of members","vi":"Danh sách thành viên"}],"ans":["C"],"key":"various home loans / loan choices = repayment options","ex":"Trang web liệt kê **các loại khoản vay** và cách trả của từng loại (lãi cố định, lãi điều chỉnh, chỉ trả lãi…): đó là các **lựa chọn trả nợ**. Trang web không có con số lãi suất cụ thể nên (B) sai."},{"n":179,"q":"What plan is suitable for those with unstable earnings?","qvi":"Gói vay nào hợp với người có thu nhập không ổn định?","opts":[{"t":"Fixed-Rate Mortgage Loan","vi":"Vay lãi suất cố định"},{"t":"Adjustable-Rate Mortgage Loan","vi":"Vay lãi suất điều chỉnh"},{"t":"Interest-Only Mortgage Loan","vi":"Vay chỉ trả lãi"},{"t":"Home Opportunity Loan","vi":"Vay \"Cơ hội mua nhà\""}],"ans":["C"],"key":"fluctuating incomes = unstable earnings","ex":"Mục Interest-Only Mortgage Loan ghi: hợp với người có **fluctuating incomes** (thu nhập lên xuống) = unstable earnings. Tiền ít thì chỉ trả lãi, tiền nhiều thì trả thêm gốc."},{"n":180,"q":"What is indicated about Mr. Brown?","qvi":"Điều gì được nói về ông Brown?","opts":[{"t":"He made a large down payment.","vi":"Ông đã trả trước một khoản lớn."},{"t":"He earns a steady salary.","vi":"Ông có lương ổn định."},{"t":"He recently bought his first home.","vi":"Ông vừa mua căn nhà đầu tiên."},{"t":"He will retire in the near future.","vi":"Ông sắp nghỉ hưu."}],"ans":["C"],"key":"Email: Home Opportunity Loan + Web: for first-time home buyers","ex":"Câu nối 2 văn bản. Email cho biết ông Brown vay gói **Home Opportunity Loan**. Trang web nói gói này dành cho **người mua nhà lần đầu**. Ghép lại: ông vừa mua căn nhà đầu tiên. (A) là bẫy ngược: gói này không cần trả trước nhiều."}]}],"recap":"<h2>Ghi nhớ: đáp án nói lại ý<\/h2><table><tbody><tr><td><b>Trong bài đọc<\/b><\/td><td><b>Trong đáp án<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>microwave, refrigerator, toaster<\/td><td>home appliances<\/td><td>147<\/td><\/tr><tr><td>free shipping<\/td><td>deliveries at no charge<\/td><td>148<\/td><\/tr><tr><td>reduced prices on matinée tickets<\/td><td>lower prices on certain screenings<\/td><td>151<\/td><\/tr><tr><td>choosing your seat number<\/td><td>select a seat location<\/td><td>152<\/td><\/tr><tr><td>change the meeting date<\/td><td>reschedule a meeting<\/td><td>153<\/td><\/tr><tr><td>need to be refrigerated<\/td><td>temperature sensitive<\/td><td>156<\/td><\/tr><tr><td>gluten-free, sugar-free, vegetarian<\/td><td>for those with dietary restrictions<\/td><td>158<\/td><\/tr><tr><td>closing … to expand the store<\/td><td>shut down for renovations<\/td><td>159<\/td><\/tr><tr><td>teenagers in the community<\/td><td>local teenagers<\/td><td>160<\/td><\/tr><tr><td>visuals<\/td><td>graphics<\/td><td>164<\/td><\/tr><tr><td>opened his own car dealership<\/td><td>started his own business<\/td><td>168<\/td><\/tr><tr><td>carries (vehicles)<\/td><td>sells<\/td><td>169<\/td><\/tr><tr><td>try driving vehicles<\/td><td>test products<\/td><td>170<\/td><\/tr><tr><td>manufacturing plant<\/td><td>factory<\/td><td>172<\/td><\/tr><tr><td>schedule a time to meet<\/td><td>arrange a meeting<\/td><td>176<\/td><\/tr><tr><td>online banking services<\/td><td>banking services on the Internet<\/td><td>177<\/td><\/tr><tr><td>fluctuating incomes<\/td><td>unstable earnings<\/td><td>179<\/td><\/tr><\/tbody><\/table><p><b>Các dạng câu cần nhớ:<\/b> câu hỏi ý định (\"what does … mean when…\": đọc câu ngay trước và sau, câu 150, 162) · câu NOT (dò từng đáp án, câu 166) · từ đồng nghĩa (thay từng đáp án vào câu, câu 169) · điền câu (tìm từ nối ý trước/sau, câu 157, 175) · câu nối 2 văn bản (ghép thông tin, câu 180).<\/p><p><b>Bẫy lặp từ:<\/b> snacks (149), North Point (150), December (151), keep inventory (155), community (160, 167), pizza shop (161), auto repair shop (168), greenest cities (174). Thấy chữ giống trong bài chưa chắc là đáp án đúng.<\/p>\n<p><b>Bài tập về nhà gợi ý:<\/b> với mỗi câu, gạch dưới câu trong bài chứa đáp án và chép cặp \"trong bài → trong đáp án\" vào vở theo bảng trên.<\/p>"};</script>
