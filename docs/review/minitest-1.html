<script>window.MT={"n":1,"part":1,"partName":"Part 1","sub":"Photographs · Mô tả tranh · 6 câu (1–6)","intro":"Trang này chữa <b>Minitest 1 (Part 1)<\/b>. Mỗi câu có tranh, nút nghe lại và 4 câu mô tả (giống đề thật, chữ của đáp án được ẩn đến khi bạn chọn). <b>Cách học:<\/b> nhìn tranh → nghe → tự chọn đáp án → đọc dịch và giải thích vì sao các câu kia sai.","stepsTitle":"Cách làm Part 1: 3 bước","steps":["<b>Nhìn tranh trước khi nghe.<\/b> Tự hỏi: có mấy người, họ đang <i>làm gì<\/i>, có <i>đồ vật<\/i> gì, ở <i>đâu<\/i>. Tranh không có người thì đáp án thường nói về đồ vật, nơi chốn.","<b>Nghe kỹ động từ.<\/b> Đa số câu có dạng <i>is/are + V-ing<\/i> (đang làm gì). Sai một động tác là loại: <i>holding<\/i> (cầm) ≠ <i>writing<\/i> (viết), <i>standing<\/i> ≠ <i>sitting<\/i>.","<b>Loại trừ từng câu.<\/b> Nghe câu nào đánh dấu đúng / sai câu đó. Cẩn thận <b>bẫy<\/b>: câu nhắc đúng đồ vật có trong tranh (pot, notepad, chef) nhưng sai hành động, hoặc từ nghe gần giống nhưng nghĩa ngược (<i>occupied<\/i> / <i>unoccupied<\/i>)."],"hideOpts":true,"hideHint":"Nghe rồi chọn","groups":[{"title":"Câu 1","tag":"Họp nhóm bên bàn","audio":"../audio/mt1/c1.mp3","imgs":["img/mt1/p1.webp"],"qs":[{"n":1,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"One of the women is handing some paper to the man.","vi":"Một trong những người phụ nữ đang đưa giấy cho người đàn ông."},{"t":"They are all using laptops.","vi":"Tất cả họ đều đang dùng máy tính xách tay."},{"t":"The lady is typing on the laptop.","vi":"Người phụ nữ đang gõ phím trên máy tính xách tay."},{"t":"The man is presenting in the office.","vi":"Người đàn ông đang thuyết trình trong văn phòng."}],"ans":["A"],"key":"hand sth to sb = đưa cái gì cho ai","ex":"Tranh: nhiều người ngồi quanh bàn họp, cô gái bên trái đang đưa tờ giấy về phía người đàn ông đeo kính. (B) sai: chỉ có 2 cái laptop, không phải ai cũng dùng. (C) sai: không ai đang gõ phím. (D) sai: không ai đứng thuyết trình, mọi người đều ngồi trao đổi."}]},{"title":"Câu 2","tag":"Nhà hàng","audio":"../audio/mt1/c2.mp3","imgs":["img/mt1/p2.webp"],"qs":[{"n":2,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"The waiter is writing in his notepad.","vi":"Người phục vụ đang viết vào sổ tay."},{"t":"The man is drinking a cup of coffee.","vi":"Người đàn ông đang uống một tách cà phê."},{"t":"The woman is ordering some food.","vi":"Người phụ nữ đang gọi món ăn."},{"t":"The waiter is talking to the man.","vi":"Người phục vụ đang nói chuyện với người đàn ông."}],"ans":["C"],"key":"order food = gọi món","ex":"Tranh: người phụ nữ chỉ tay vào món ăn, người phục vụ cầm sổ đứng nghe, nên cô ấy đang gọi món. (A) là bẫy: phục vụ có cầm sổ và bút nhưng chưa viết (cầm ≠ viết). (B) sai: người đàn ông không uống gì. (D) sai: phục vụ đang nhìn người phụ nữ, không nói chuyện với người đàn ông."}]},{"title":"Câu 3","tag":"Hội trường trống","audio":"../audio/mt1/c3.mp3","imgs":["img/mt1/p3.webp"],"qs":[{"n":3,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"There are cleaners in the lecture hall.","vi":"Có nhân viên dọn dẹp trong giảng đường."},{"t":"The lecture hall is occupied.","vi":"Giảng đường đang có người."},{"t":"There are many people in the lecture hall.","vi":"Có nhiều người trong giảng đường."},{"t":"The lecture hall is unoccupied.","vi":"Giảng đường đang trống (không có ai)."}],"ans":["D"],"key":"unoccupied = trống, không có người","ex":"Tranh chỉ có ghế, màn chiếu, không có ai: unoccupied (không có người). (B) occupied nghĩa ngược lại là \"có người\": nghe gần giống nên dễ chọn nhầm. (A) và (C) sai vì không có người nào trong tranh. Tranh không người thì loại ngay câu có người."}]},{"title":"Câu 4","tag":"Đi bộ trên hành lang kính","audio":"../audio/mt1/c4.mp3","imgs":["img/mt1/p4.webp"],"qs":[{"n":4,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"The man is holding the umbrella with his hand.","vi":"Người đàn ông đang cầm chiếc ô trong tay."},{"t":"The woman is strolling along the path.","vi":"Người phụ nữ đang đi dạo dọc con đường."},{"t":"They are boarding the train.","vi":"Họ đang lên tàu."},{"t":"They are lined up against the wall.","vi":"Họ đang đứng xếp hàng sát tường."}],"ans":["A"],"key":"hold = cầm, nắm","ex":"Tranh: người đàn ông tay phải cầm chiếc ô, tay trái cầm cặp, đi cạnh người phụ nữ. (A) tả đúng và rõ nhất. (B) dễ phân vân: cô ấy đang đi, nhưng là đi trong hành lang có mái kính (path thường là lối đi ngoài trời) và đi cùng người khác, nên không chắc bằng (A). (C) sai: không có tàu. (D) sai: họ đang đi, không đứng xếp hàng sát tường."}]},{"title":"Câu 5","tag":"Đầu bếp nấu ăn","audio":"../audio/mt1/c5.mp3","imgs":["img/mt1/p5.webp"],"qs":[{"n":5,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"The woman is boiling water in the pot.","vi":"Người phụ nữ đang đun nước trong nồi."},{"t":"The woman is putting pepper into the pot.","vi":"Người phụ nữ đang cho tiêu vào nồi."},{"t":"The woman is pouring oil into the pan.","vi":"Người phụ nữ đang rót dầu vào chảo."},{"t":"The woman is wearing a chef's hat.","vi":"Người phụ nữ đang đội mũ đầu bếp."}],"ans":["C"],"key":"pour oil into the pan = rót dầu vào chảo","ex":"Tranh: tay cô cầm chai rót dầu xuống chảo, tay kia cầm cán chảo. (A) và (B) là bẫy: trong tranh có cái nồi (pot) nhưng cô không đun nước hay cho tiêu vào nồi. (D) là bẫy: cô mặc áo đầu bếp nhưng không đội mũ."}]},{"title":"Câu 6","tag":"Bắt tay","audio":"../audio/mt1/c6.mp3","imgs":["img/mt1/p6.webp"],"qs":[{"n":6,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"They are signing a contract.","vi":"Họ đang ký hợp đồng."},{"t":"They are shaking hands with each other.","vi":"Họ đang bắt tay nhau."},{"t":"They are sitting next to each other.","vi":"Họ đang ngồi cạnh nhau."},{"t":"They are sharing business cards with each other.","vi":"Họ đang trao danh thiếp cho nhau."}],"ans":["B"],"key":"shake hands = bắt tay","ex":"Tranh: hai người đứng hai bên bàn, đang bắt tay nhau. (A) sai: không ai cầm bút ký. (C) sai: họ đang đứng, không ngồi. (D) sai: không có danh thiếp. Hai người gặp nhau trong văn phòng dễ khiến mình nghĩ tới ký hợp đồng, trao danh thiếp: chỉ chọn cái nhìn thấy được."}]}],"recap":"<h2>Ghi nhớ: từ vựng tả tranh<\/h2><table><tbody><tr><td><b>Cụm từ<\/b><\/td><td><b>Nghĩa<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>hand some paper to sb<\/td><td>đưa giấy cho ai<\/td><td>1<\/td><\/tr><tr><td>type on the laptop<\/td><td>gõ phím máy tính<\/td><td>1<\/td><\/tr><tr><td>order some food<\/td><td>gọi món<\/td><td>2<\/td><\/tr><tr><td>write in a notepad<\/td><td>viết vào sổ tay<\/td><td>2<\/td><\/tr><tr><td>occupied / unoccupied<\/td><td>có người / trống<\/td><td>3<\/td><\/tr><tr><td>hold the umbrella<\/td><td>cầm ô<\/td><td>4<\/td><\/tr><tr><td>stroll along the path<\/td><td>đi dạo dọc lối đi<\/td><td>4<\/td><\/tr><tr><td>board the train<\/td><td>lên tàu<\/td><td>4<\/td><\/tr><tr><td>be lined up<\/td><td>xếp hàng<\/td><td>4<\/td><\/tr><tr><td>pour oil into the pan<\/td><td>rót dầu vào chảo<\/td><td>5<\/td><\/tr><tr><td>boil water in the pot<\/td><td>đun nước trong nồi<\/td><td>5<\/td><\/tr><tr><td>shake hands<\/td><td>bắt tay<\/td><td>6<\/td><\/tr><tr><td>sign a contract<\/td><td>ký hợp đồng<\/td><td>6<\/td><\/tr><tr><td>business cards<\/td><td>danh thiếp<\/td><td>6<\/td><\/tr><\/tbody><\/table><p><b>Các bẫy hay gặp:<\/b> đúng đồ vật nhưng sai hành động (cầm sổ ≠ viết sổ ở câu 2, có nồi nhưng không đun nước ở câu 5); có đồ vật gần giống nhưng không có thật (mũ đầu bếp ở câu 5, danh thiếp ở câu 6); từ trái nghĩa nghe gần giống (occupied / unoccupied ở câu 3).<\/p>\n<p><b>Bài tập về nhà gợi ý:<\/b> nghe lại từng câu, chép 4 câu mô tả vào vở, đánh dấu đúng/sai và ghi vì sao sai (người/vật không có, sai động tác). Sau đó tự tả mỗi tranh bằng 2 câu <i>is/are + V-ing<\/i>.<\/p>"};</script>
