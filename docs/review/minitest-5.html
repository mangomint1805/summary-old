<script>window.MT={"n":5,"part":3,"partName":"Part 3","sub":"Short Conversations · Hội thoại ngắn · 30 câu (32–61)","intro":"Trang này chữa <b>Minitest 5 (Part 3)<\/b> theo bài chữa trên lớp. Mỗi đoạn hội thoại có nút nghe lại, lời thoại kèm dịch và 3 câu hỏi. <b>Cách học:<\/b> nghe đoạn hội thoại → tự chọn đáp án → đọc giải thích → mở lời thoại xem đáp án nằm ở câu nào.","stats":{"lop":"PRE115275","avg":"14,0/30","max":"27/30","n":22,"note":"Tính lần làm đầu tiên làm đủ bài. Dưới 10 câu: 6 bạn · 10–19 câu: 12 bạn · từ 20 câu: 4 bạn.","unit":"đoạn hội thoại","groups":[["32–34",41,""],["35–37",44,""],["38–40",47,""],["41–43",62,""],["44–46",33,"khó nhất"],["47–49",45,""],["50–52",44,""],["53–55",48,""],["56–58",48,""],["59–61",55,""]]},"stepsTitle":"Cách làm Part 3: 3 bước","steps":["<b>Đọc trước câu hỏi.<\/b> Gạch từ khóa: who / why / what … next, và câu hỏi về <i>man<\/i> hay <i>woman<\/i>.","<b>Nghe theo thứ tự.<\/b> Đáp án xuất hiện lần lượt: câu đầu ở đầu bài, câu cuối ở cuối bài.","<b>Bắt paraphrase (cách nói lại).<\/b> Đáp án đúng thường nói lại ý bằng từ khác: <i>short-term job → part-time job<\/i>. Đáp án lặp lại đúng từ trong bài (Tokyo, cameras, magazine…) thường là <b>bẫy<\/b>."],"groups":[{"title":"Hội thoại 32–34 · Nhờ dịch tài liệu","audio":"../audio/mt5/c32.mp3","script":[{"sp":"W","t":"Hi, Mr. Joyce. This is Sally Walker calling from Frohman Publishing. (32) My company has a three-page text that we need translated into Chinese. I know you sometimes do these kinds of **short-term jobs** for our company.","vi":"Chào anh Joyce. Tôi là Sally Walker gọi từ Nhà xuất bản Frohman. Công ty tôi có một văn bản ba trang cần dịch sang tiếng Trung. Tôi biết anh thỉnh thoảng nhận những việc ngắn hạn như thế này cho công ty chúng tôi."},{"sp":"M","t":"Yeah, I would be happy to. (33) However, you should know that it is my policy to be **paid in advance**. Is that OK?","vi":"Vâng, tôi rất sẵn lòng. Nhưng chị nên biết nguyên tắc của tôi là được trả tiền trước. Như vậy có được không?"},{"sp":"W","t":"That's no problem. I'll transfer the money into your bank account immediately. (34) The **deadline** for this translation hasn't been decided yet. Once I know, I will inform you.","vi":"Không vấn đề gì. Tôi sẽ chuyển tiền vào tài khoản ngân hàng của anh ngay. Hạn chót của bản dịch này chưa được quyết định. Khi nào biết, tôi sẽ báo anh."},{"sp":"M","t":"Thank you for your understanding. Please e-mail me the document. I'll do my best.","vi":"Cảm ơn chị đã thông cảm. Chị gửi email tài liệu cho tôi nhé. Tôi sẽ cố gắng hết sức."}],"qs":[{"n":32,"q":"Why is the woman calling?","qvi":"Vì sao người phụ nữ gọi điện?","opts":[{"t":"To extend a rental period","vi":"Để gia hạn thời gian thuê"},{"t":"To confirm an appointment","vi":"Để xác nhận một cuộc hẹn"},{"t":"To offer a part-time job","vi":"Để mời làm một công việc bán thời gian"},{"t":"To accept a proposal","vi":"Để chấp nhận một lời đề nghị"}],"ans":["C"],"key":"short-term job = part-time job","ex":"Câu sai nhiều nhất của đoạn này. Cô Sally gọi để giao việc dịch, một công việc ngắn hạn: short-term job = part-time job. Không có cuộc hẹn nào nên (B) sai. Có 11 bạn chọn (B).","cls":{"A":2,"B":11,"C":5,"D":4},"of":22},{"n":33,"q":"What does the man ask the woman to do?","qvi":"Người đàn ông yêu cầu người phụ nữ làm gì?","opts":[{"t":"Interpret for her supervisor","vi":"Phiên dịch cho cấp trên của cô ấy"},{"t":"Send an advance payment","vi":"Gửi tiền trả trước"},{"t":"Submit an official request","vi":"Nộp một yêu cầu chính thức"},{"t":"Provide a work space","vi":"Cung cấp chỗ làm việc"}],"ans":["B"],"key":"paid in advance = advance payment","ex":"Anh Joyce nói chính sách của anh là được trả tiền trước: paid in advance = an advance payment. Câu này khoảng một nửa lớp làm đúng.","cls":{"A":2,"B":11,"C":6,"D":3},"of":22},{"n":34,"q":"What will the woman inform the man about?","qvi":"Người phụ nữ sẽ báo cho người đàn ông về điều gì?","opts":[{"t":"A requirement","vi":"Một yêu cầu, điều kiện"},{"t":"A deadline","vi":"Hạn chót"},{"t":"A meeting time","vi":"Giờ họp"},{"t":"A company policy","vi":"Một chính sách của công ty"}],"ans":["B"],"key":"\"Once I know (the deadline), I will inform you\"","ex":"Hạn chót chưa được quyết định; khi biết, cô ấy sẽ báo → a deadline. \"Policy\" ở (D) là bẫy: chính sách là của anh Joyce, không phải điều cô ấy sẽ báo.","cls":{"A":4,"B":11,"C":4,"D":3},"of":22}]},{"title":"Hội thoại 35–37 · Thiệp chúc mau khỏe","audio":"../audio/mt5/c35.mp3","script":[{"sp":"W","t":"Good morning, James. (35) Here is a copy of your **expense report** from last month's business trip to Tokyo.","vi":"Chào buổi sáng, James. Đây là bản sao báo cáo chi phí chuyến công tác Tokyo tháng trước của anh."},{"sp":"M","t":"Thanks, Mary. (36) Oh, while you're here, can you **leave a message** in this get-well-soon card for Bryce? He had knee surgery yesterday and I was thinking this card might cheer him up.","vi":"Cảm ơn Mary. À, nhân tiện chị ở đây, chị viết vài lời vào tấm thiệp chúc mau khỏe cho Bryce được không? Hôm qua anh ấy mổ đầu gối, tôi nghĩ tấm thiệp này có thể làm anh ấy vui lên."},{"sp":"W","t":"Oh, did he? I didn't even know he was in the hospital. I was out of town yesterday. Is it serious?","vi":"Ồ, vậy à? Tôi còn không biết anh ấy nằm viện. Hôm qua tôi đi vắng. Có nghiêm trọng không?"},{"sp":"M","t":"Not that I know of. But he said he had to stay in the hospital for a few days. (37) I'm planning on **visiting him** this evening after work.","vi":"Theo tôi biết thì không. Nhưng anh ấy nói phải nằm viện vài ngày. Tôi định tối nay tan làm sẽ đến thăm anh ấy."}],"qs":[{"n":35,"q":"What did the woman make a copy of?","qvi":"Người phụ nữ đã sao (photo) cái gì?","opts":[{"t":"A receipt","vi":"Một hóa đơn"},{"t":"A meeting schedule","vi":"Lịch họp"},{"t":"An expense report","vi":"Báo cáo chi phí"},{"t":"A prescription","vi":"Đơn thuốc"}],"ans":["C"],"key":"\"a copy of your expense report\"","ex":"Câu đầu tiên, đáp án ở ngay câu đầu bài: a copy of your expense report (báo cáo chi phí).","cls":{"A":3,"B":7,"C":10,"D":2},"of":22},{"n":36,"q":"What does the man ask the woman to do?","qvi":"Người đàn ông nhờ người phụ nữ làm gì?","opts":[{"t":"Sign a contract","vi":"Ký hợp đồng"},{"t":"Write a message","vi":"Viết lời nhắn"},{"t":"Contact a receptionist","vi":"Liên hệ lễ tân"},{"t":"Go on a business trip to Tokyo","vi":"Đi công tác Tokyo"}],"ans":["B"],"key":"Bẫy \"Tokyo\": chuyến đi đã xong từ tháng trước","ex":"Bẫy điển hình: 7 bạn chọn (D) vì nghe thấy \"Tokyo\". Nhưng chuyến đi Tokyo là chuyện tháng trước, còn điều anh James nhờ là \"leave a message in this card\" = write a message.","cls":{"A":2,"B":8,"C":5,"D":7},"of":22},{"n":37,"q":"What does the man plan to do?","qvi":"Người đàn ông dự định làm gì?","opts":[{"t":"Visit his co-worker","vi":"Thăm đồng nghiệp"},{"t":"Submit a report","vi":"Nộp báo cáo"},{"t":"Make a new reservation","vi":"Đặt chỗ mới"},{"t":"Work overtime","vi":"Làm thêm giờ"}],"ans":["A"],"key":"visiting him (Bryce) = visit his co-worker","ex":"Bryce là đồng nghiệp → visit his co-worker. \"After work\" không có nghĩa là làm thêm giờ (D).","cls":{"A":11,"B":3,"C":6,"D":2},"of":22}]},{"title":"Hội thoại 38–40 · Trang trí nội thất","audio":"../audio/mt5/c38.mp3","script":[{"sp":"W","t":"(38) I need to talk to you about the **interior decorations** we are carrying out at the Carleton's property. They are a major client, so we need to make sure that they are completely satisfied. Have you consulted with them about the furniture for the master bedroom?","vi":"Tôi cần nói với anh về việc trang trí nội thất chúng ta đang làm ở nhà của gia đình Carleton. Họ là khách hàng lớn, nên phải đảm bảo họ hoàn toàn hài lòng. Anh đã hỏi ý họ về đồ nội thất cho phòng ngủ chính chưa?"},{"sp":"M","t":"I have. They agreed on all of our plans except for the choice for the master bed. (39) They're worried it is too big and will occupy too much space, so I'm looking for **something smaller** that still fits the color scheme of the room.","vi":"Rồi. Họ đồng ý mọi phương án của mình, trừ cái giường chính. Họ lo nó quá to và chiếm nhiều chỗ, nên tôi đang tìm một cái nhỏ hơn mà vẫn hợp tông màu của phòng."},{"sp":"W","t":"Okay. I was planning on ordering all of the furniture today. (40) But I think we have to wait until we get the **permission**.","vi":"Được. Tôi định hôm nay đặt toàn bộ đồ nội thất. Nhưng chắc mình phải đợi tới khi được cho phép đã."}],"qs":[{"n":38,"q":"What field do the speakers work in?","qvi":"Những người nói làm trong lĩnh vực nào?","opts":[{"t":"Education","vi":"Giáo dục"},{"t":"Manufacturing","vi":"Sản xuất"},{"t":"Product development","vi":"Phát triển sản phẩm"},{"t":"Interior design","vi":"Thiết kế nội thất"}],"ans":["D"],"key":"interior decorations = interior design","ex":"Câu hỏi nghề nghiệp: nghe ngay câu đầu, \"interior decorations\" → interior design. Các từ furniture, master bedroom, color scheme cũng xác nhận ngành trang trí nội thất.","cls":{"A":2,"B":2,"C":3,"D":15},"of":22},{"n":39,"q":"What does the man plan to do?","qvi":"Người đàn ông dự định làm gì?","opts":[{"t":"Choose different furniture","vi":"Chọn đồ nội thất khác"},{"t":"Share a building plan","vi":"Gửi bản vẽ tòa nhà"},{"t":"Change a color scheme","vi":"Đổi tông màu"},{"t":"Place an order for wallpaper","vi":"Đặt mua giấy dán tường"}],"ans":["A"],"key":"something smaller = different furniture","ex":"Anh ấy tìm một cái giường nhỏ hơn → choose different furniture. \"Color scheme\" có trong bài, nhưng anh ấy muốn GIỮ tông màu, không đổi, nên (C) là bẫy.","cls":{"A":5,"B":4,"C":8,"D":5},"of":22},{"n":40,"q":"According to the woman, why will the speakers have to wait?","qvi":"Theo người phụ nữ, vì sao họ phải chờ?","opts":[{"t":"A shipment has been delayed.","vi":"Một lô hàng bị giao trễ."},{"t":"A contract has not been signed yet.","vi":"Hợp đồng chưa được ký."},{"t":"Authorization must first be obtained.","vi":"Phải được cho phép trước đã."},{"t":"Some equipment is out of order.","vi":"Một số thiết bị bị hỏng."}],"ans":["C"],"key":"permission = authorization","ex":"Permission = authorization (sự cho phép). 5 bạn chọn (B) \"contract has not been signed\", nhưng bài chỉ nói đợi sự cho phép, không nhắc gì đến hợp đồng. Từ vựng cần nhớ: authorization, obtain.","cls":{"A":3,"B":5,"C":11,"D":1},"of":22}]},{"title":"Hội thoại 41–43 · Nhận nuôi chó","audio":"../audio/mt5/c41.mp3","script":[{"sp":"W","t":"(41) Hi, I'd like to **adopt a pet that doesn't have a home**. I live alone and feel that a dog would be great company.","vi":"Chào anh, tôi muốn nhận nuôi một con vật không có nhà. Tôi sống một mình và nghĩ có một chú chó làm bạn thì tuyệt."},{"sp":"M","t":"You came to the right place. (41) We have many cute dogs here who were **rescued from the street** and don't have a home. What kind of dog are you looking for specifically?","vi":"Chị đến đúng chỗ rồi. Ở đây có nhiều chú chó dễ thương được cứu từ ngoài đường về và không có nhà. Cụ thể chị đang tìm loại chó nào?"},{"sp":"W","t":"(42) Well, my house is not that big, so I was hoping for a dog **small enough** to hold in my lap.","vi":"À, nhà tôi không rộng lắm, nên tôi mong có một chú chó đủ nhỏ để ôm trong lòng."},{"sp":"M","t":"All right. (43) Before we can allow you to adopt a dog, we need you to **complete some official paperwork**. If you have a seat in the lobby, I'll bring you the documents immediately.","vi":"Được thôi. Trước khi cho chị nhận nuôi, chị cần điền một số giấy tờ chính thức. Chị ngồi ở sảnh, tôi mang giấy tờ ra ngay."}],"qs":[{"n":41,"q":"Where most likely are the speakers?","qvi":"Những người nói nhiều khả năng đang ở đâu?","opts":[{"t":"At a pet shop","vi":"Ở cửa hàng thú cưng"},{"t":"At a catering company","vi":"Ở công ty cung cấp đồ ăn (catering)"},{"t":"At a fire station","vi":"Ở trạm cứu hỏa"},{"t":"At an animal shelter","vi":"Ở trại cứu hộ động vật"}],"ans":["A","D"],"key":"Chấm cả (A) và (D). (D) sát script nhất: adopt, rescued from the street","ex":"Key gốc ghi (A) At a pet shop, nhưng nội dung bài nghe cho thấy đây là trại cứu hộ động vật: \"adopt a pet that doesn't have a home\", \"rescued from the street\" → (D) At an animal shelter. Đã chấm lại: cả (A) và (D) đều được tính điểm. 5 bạn chọn (B) catering company: bài không nói gì về đồ ăn.","cls":{"A":8,"B":5,"C":2,"D":7},"of":22},{"n":42,"q":"What aspect of the woman's needs is mentioned?","qvi":"Yêu cầu nào của người phụ nữ được nhắc tới?","opts":[{"t":"The price","vi":"Giá"},{"t":"The size","vi":"Kích thước"},{"t":"The age","vi":"Tuổi"},{"t":"The color","vi":"Màu lông"}],"ans":["B"],"key":"small enough to hold in my lap → size","ex":"Nhà nhỏ nên cô ấy muốn một con chó đủ nhỏ để ôm trong lòng → kích thước (size).","cls":{"A":1,"B":15,"C":5,"D":1},"of":22},{"n":43,"q":"According to the man, what does the woman have to do?","qvi":"Theo người đàn ông, người phụ nữ phải làm gì?","opts":[{"t":"Make an advance payment","vi":"Trả tiền trước"},{"t":"Bring her identification","vi":"Mang giấy tờ tùy thân"},{"t":"Fill out some documents","vi":"Điền một số giấy tờ"},{"t":"Submit a letter of reference","vi":"Nộp thư giới thiệu"}],"ans":["C"],"key":"complete paperwork = fill out documents","ex":"Complete = fill out (điền), paperwork = documents (giấy tờ). Cặp paraphrase rất hay gặp trong TOEIC.","cls":{"A":4,"B":5,"C":11,"D":2},"of":22}]},{"title":"Hội thoại 44–46 · Buổi diễn cấm máy ảnh","audio":"../audio/mt5/c44.mp3","script":[{"sp":"M","t":"Hello, this is David Wright. (44) I **represent the guitar player** Joe Jackson, who will be performing at your venue this weekend. (45) I wanted to **remind you** that Mr. Jackson requests that no cameras be allowed during the duration of his performance.","vi":"Xin chào, tôi là David Wright. Tôi là người đại diện của nghệ sĩ guitar Joe Jackson, người sẽ biểu diễn ở địa điểm của chị cuối tuần này. Tôi muốn nhắc chị là anh Jackson yêu cầu không cho mang máy ảnh trong suốt buổi diễn."},{"sp":"W","t":"Yes, I remember. We have posted flyers at the entrance prohibiting cameras and have asked our staff to remind guests that photography is not allowed.","vi":"Vâng, tôi nhớ. Chúng tôi đã dán tờ thông báo cấm máy ảnh ở lối vào và dặn nhân viên nhắc khách là không được chụp ảnh."},{"sp":"M","t":"Thank you for your cooperation. As you know, Mr. Jackson is very sensitive when he plays.","vi":"Cảm ơn chị đã hợp tác. Như chị biết, anh Jackson rất nhạy cảm khi biểu diễn."},{"sp":"W","t":"(46) I'll **make an announcement** onstage before the show to inform the audience one more time about this restriction.","vi":"Tôi sẽ thông báo trên sân khấu trước buổi diễn để nhắc khán giả thêm một lần về quy định này."}],"qs":[{"n":44,"q":"Who most likely is the man?","qvi":"Người đàn ông nhiều khả năng là ai?","opts":[{"t":"A photographer","vi":"Nhiếp ảnh gia"},{"t":"A talent agent","vi":"Người quản lý, đại diện nghệ sĩ"},{"t":"A performer","vi":"Người biểu diễn"},{"t":"A receptionist","vi":"Lễ tân"}],"ans":["B"],"key":"I represent the guitar player = talent agent","ex":"\"I represent the guitar player\" = tôi đại diện cho nghệ sĩ → talent agent (người quản lý nghệ sĩ). Người biểu diễn là Joe Jackson, không phải người gọi, nên (C) sai (8 bạn chọn). Đây là câu khó nhất bài, chỉ 4/22 bạn đúng.","cls":{"A":6,"B":4,"C":8,"D":4},"of":22},{"n":45,"q":"Why is the man calling?","qvi":"Vì sao người đàn ông gọi điện?","opts":[{"t":"To buy a ticket in advance","vi":"Để mua vé trước"},{"t":"To confirm a reservation","vi":"Để xác nhận đặt chỗ"},{"t":"To provide a reminder","vi":"Để nhắc nhở"},{"t":"To inquire about an advertisement","vi":"Để hỏi về một quảng cáo"}],"ans":["C"],"key":"I wanted to remind you = provide a reminder","ex":"\"I wanted to remind you\" → provide a reminder (nhắc nhở). Câu trả lời của cô ấy \"Yes, I remember\" cũng xác nhận đây là lời nhắc. 3 bạn chọn (D) quảng cáo, nhưng bài không có quảng cáo nào.","cls":{"A":3,"B":4,"C":12,"D":3},"of":22},{"n":46,"q":"What does the woman offer to do?","qvi":"Người phụ nữ đề nghị làm gì?","opts":[{"t":"Restrict backstage access","vi":"Hạn chế vào hậu trường"},{"t":"Take pictures of Mr. Jackson","vi":"Chụp ảnh anh Jackson"},{"t":"Show the man a list of guests","vi":"Cho người đàn ông xem danh sách khách mời"},{"t":"Make an official announcement","vi":"Thông báo chính thức"}],"ans":["D"],"key":"Bẫy \"cameras\": bài nói CẤM chụp ảnh","ex":"7 bạn chọn \"take pictures\" vì nghe thấy cameras, nhưng bài nói không được chụp ảnh. Cô ấy sẽ \"make an announcement onstage\" → make an official announcement.","cls":{"A":2,"B":7,"C":7,"D":6},"of":22}]},{"title":"Hội thoại 47–49 · Quảng cáo cần câu","audio":"../audio/mt5/c47.mp3","script":[{"sp":"M","t":"Hi, Kelly. Did you see our advertisement in this month's issue of Fishing Fanatic? (47) The accompanying graphic shows how our fishing rods are **stronger than any other product** on the market.","vi":"Chào Kelly. Chị đã xem quảng cáo của mình trên tạp chí Fishing Fanatic số tháng này chưa? Hình minh họa đi kèm cho thấy cần câu của mình chắc hơn mọi sản phẩm khác trên thị trường."},{"sp":"W","t":"Yeah, I saw it this morning. (48) I'm hoping the advertisement will help convince customers to purchase our **newest line** of fishing rods.","vi":"Có, sáng nay tôi xem rồi. Tôi mong quảng cáo này sẽ giúp thuyết phục khách mua dòng cần câu mới nhất của mình."},{"sp":"M","t":"I'm sure it will. (49) I'll **get in touch with the advertising agency** and request that the ad be placed in other magazines as well.","vi":"Chắc chắn là được. Tôi sẽ liên hệ công ty quảng cáo và đề nghị đăng quảng cáo trên cả các tạp chí khác nữa."}],"qs":[{"n":47,"q":"What is mentioned about the product?","qvi":"Điều gì được nói về sản phẩm?","opts":[{"t":"It is affordable.","vi":"Giá phải chăng."},{"t":"It is superior to competitors'.","vi":"Tốt hơn sản phẩm của đối thủ."},{"t":"It is safe for children to use.","vi":"An toàn cho trẻ em."},{"t":"It is simple to install.","vi":"Dễ lắp đặt."}],"ans":["B"],"key":"stronger than any other = superior to competitors'","ex":"\"Stronger than any other product on the market\" = tốt hơn sản phẩm đối thủ → superior to competitors'. Bài không nói gì về trẻ em, nên (C) sai dù có 5 bạn chọn.","cls":{"A":2,"B":12,"C":5,"D":3},"of":22},{"n":48,"q":"According to the man, what will the advertisement help to do?","qvi":"Quảng cáo sẽ giúp làm gì?","opts":[{"t":"Promote new products","vi":"Quảng bá sản phẩm mới"},{"t":"Increase stock value","vi":"Tăng giá cổ phiếu"},{"t":"Encourage new innovations","vi":"Khuyến khích đổi mới"},{"t":"Reduce customer complaints","vi":"Giảm phàn nàn của khách"}],"ans":["A"],"key":"our newest line = new products","ex":"Quảng cáo giúp thuyết phục khách mua dòng sản phẩm mới nhất (newest line) → promote new products. Anh ấy đồng ý ngay sau đó: \"I'm sure it will\".","cls":{"A":10,"B":2,"C":9,"D":1},"of":22},{"n":49,"q":"What will the man do next?","qvi":"Người đàn ông sẽ làm gì tiếp theo?","opts":[{"t":"Create a website","vi":"Làm trang web"},{"t":"Buy a magazine","vi":"Mua tạp chí"},{"t":"Revise an article","vi":"Sửa một bài báo"},{"t":"Contact an agency","vi":"Liên hệ công ty quảng cáo"}],"ans":["D"],"key":"get in touch with = contact · bẫy \"magazines\"","ex":"\"Get in touch with\" = contact. 5 bạn chọn \"buy a magazine\" vì nghe thấy magazines ở cuối câu: lại là bẫy lặp từ. Câu hỏi \"do next\" thường nằm ở câu cuối bài, với \"I'll…\".","cls":{"A":5,"B":5,"C":4,"D":8},"of":22}]},{"title":"Hội thoại 50–52 · Chưa nhận được áo","audio":"../audio/mt5/c50.mp3","script":[{"sp":"M1 (Michael)","t":"Heights Department Store, Michael speaking, how can I help you?","vi":"Cửa hàng bách hóa Heights, Michael nghe, tôi giúp gì được ạ?"},{"sp":"W (Sarah)","t":"Hi, this is Sarah. (50) I purchased a Regan cashmere coat from you two weeks ago, but I **still haven't received it** yet. I was told that I'd get it in 2-3 days.","vi":"Chào anh, tôi là Sarah. Hai tuần trước tôi mua một chiếc áo khoác len cashmere hiệu Regan ở chỗ anh, nhưng đến giờ vẫn chưa nhận được. Tôi được báo là 2–3 ngày sẽ có."},{"sp":"M1 (Michael)","t":"Hold on a second, (51) you'll **need to speak with a representative from the Regan boutique**. I'll transfer your call.","vi":"Chị chờ một chút, chị cần nói chuyện với nhân viên của cửa hàng Regan. Tôi sẽ chuyển máy cho chị."},{"sp":"W (Sarah)","t":"No problem.","vi":"Không sao."},{"sp":"M2 (Brian)","t":"Hello, this is Regan Luxury Boutique, Brian speaking, what can I help you with?","vi":"Xin chào, cửa hàng cao cấp Regan, Brian nghe, tôi giúp gì được ạ?"},{"sp":"W (Sarah)","t":"Yes, Brian, this is Sarah. I bought a coat from you two weeks ago and I'm wondering what happened to the shipment.","vi":"Vâng Brian, tôi là Sarah. Tôi mua một chiếc áo khoác ở chỗ anh hai tuần trước và muốn biết đơn hàng bị sao rồi."},{"sp":"M2 (Brian)","t":"Oh, hello Sarah, I'm sorry to hear that you haven't received it yet. Let me check the computer here. (52) Can you give me your **full name**?","vi":"À, chào chị Sarah, rất tiếc chị vẫn chưa nhận được hàng. Để tôi kiểm tra trên máy. Chị cho tôi xin họ tên đầy đủ được không?"},{"sp":"W (Sarah)","t":"Sure, it's Sarah Jane Park.","vi":"Vâng, Sarah Jane Park."}],"qs":[{"n":50,"q":"Why is the woman calling?","qvi":"Vì sao người phụ nữ gọi điện?","opts":[{"t":"She hasn't received her product.","vi":"Cô ấy chưa nhận được hàng."},{"t":"She was overcharged for the item.","vi":"Cô ấy bị tính tiền quá cao."},{"t":"She wants a product exchanged.","vi":"Cô ấy muốn đổi hàng."},{"t":"She wants to return a product.","vi":"Cô ấy muốn trả hàng."}],"ans":["A"],"key":"still haven't received it","ex":"Hội thoại 3 người: chú ý tên. Michael ở cửa hàng bách hóa, Brian ở cửa hàng Regan. Câu 50: cô ấy chưa nhận được áo → hasn't received her product.","cls":{"A":11,"B":5,"C":3,"D":3},"of":22},{"n":51,"q":"Why does Michael transfer the call?","qvi":"Vì sao Michael chuyển máy?","opts":[{"t":"He is busy with another customer.","vi":"Anh ấy đang bận tiếp khách khác."},{"t":"She requests another representative.","vi":"Cô ấy yêu cầu nói chuyện với nhân viên khác."},{"t":"She called the wrong department.","vi":"Cô ấy gọi nhầm bộ phận."},{"t":"The manager is unavailable.","vi":"Quản lý không có mặt."}],"ans":["C"],"key":"phải nói với bên Regan = gọi nhầm bộ phận","ex":"Michael chuyển máy vì cô ấy cần nói chuyện với bên Regan, tức là gọi nhầm bộ phận. Cô ấy không tự yêu cầu đổi người, nên (B) sai.","cls":{"A":2,"B":10,"C":7,"D":2},"of":22},{"n":52,"q":"What does Brian ask the woman for?","qvi":"Brian hỏi người phụ nữ thông tin gì?","opts":[{"t":"The tracking number","vi":"Mã vận đơn"},{"t":"Her receipt","vi":"Hóa đơn"},{"t":"Her full name","vi":"Họ tên đầy đủ"},{"t":"The product name","vi":"Tên sản phẩm"}],"ans":["C"],"key":"\"Can you give me your full name?\"","ex":"Brian hỏi họ tên đầy đủ, không hỏi mã vận đơn (tracking number). Nghe đến \"shipment\" dễ đoán tracking number, nhưng phải nghe câu hỏi thật của Brian.","cls":{"A":5,"B":5,"C":11,"D":0},"of":22}],"tag":"3 người"},{"title":"Hội thoại 53–55 · Tiệc kỷ niệm","audio":"../audio/mt5/c53.mp3","script":[{"sp":"M","t":"Hi, Mrs. West. (53) Everything is set up for your **anniversary party** tonight. If you can arrive at about 6:00 P.M., that would be great.","vi":"Chào chị West. Mọi thứ cho tiệc kỷ niệm tối nay của chị đã chuẩn bị xong. Nếu chị đến được lúc khoảng 6 giờ tối thì tuyệt."},{"sp":"W","t":"6:00 P.M.? I have meetings until 8:00 P.M. tonight. You know we are merging with another company at the moment; it's a very important time for our company.","vi":"6 giờ tối á? Tối nay tôi họp tới 8 giờ. Anh biết đấy, công ty tôi đang sáp nhập với một công ty khác, đây là giai đoạn rất quan trọng."},{"sp":"M","t":"Oh no... I've scheduled the band to play from six to ten o'clock. And dinner will be served at seven o'clock.","vi":"Ôi không… Tôi đã xếp ban nhạc chơi từ 6 đến 10 giờ. Và bữa tối sẽ dọn lúc 7 giờ."},{"sp":"W","t":"Well, I wish you would have told me about this earlier.","vi":"Chà, giá mà anh nói với tôi sớm hơn."},{"sp":"M","t":"(54) **But it's your fifth year anniversary party**...","vi":"Nhưng đây là tiệc kỷ niệm 5 năm của chị mà…"},{"sp":"W","t":"OK. (55) I will **cancel my last meeting** tonight and arrive around six thirty. So don't worry; everything will be fine. I will just be a little late.","vi":"Thôi được. Tôi sẽ hủy cuộc họp cuối tối nay và đến khoảng 6 giờ rưỡi. Anh đừng lo, mọi thứ sẽ ổn. Tôi chỉ đến muộn một chút thôi."}],"qs":[{"n":53,"q":"What are the speakers mainly discussing?","qvi":"Những người nói chủ yếu bàn về chuyện gì?","opts":[{"t":"Merging with another company","vi":"Sáp nhập với công ty khác"},{"t":"Last month's sales reports","vi":"Báo cáo doanh số tháng trước"},{"t":"The woman's anniversary party","vi":"Tiệc kỷ niệm của người phụ nữ"},{"t":"When the band will arrive","vi":"Khi nào ban nhạc tới"}],"ans":["C"],"key":"your anniversary party tonight","ex":"Lớp làm tốt câu này. Chủ đề chính nằm ngay câu đầu: tiệc kỷ niệm của chị West.","cls":{"A":5,"B":4,"C":13,"D":0},"of":22},{"n":54,"q":"What does the man mean when he says \"But it's your fifth year anniversary party\"?","qvi":"Người đàn ông có ý gì khi nói \"Nhưng đây là tiệc kỷ niệm 5 năm của chị mà\"?","opts":[{"t":"He wants her to change her schedule.","vi":"Anh ấy muốn cô ấy đổi lịch."},{"t":"He thinks it's not important.","vi":"Anh ấy nghĩ việc này không quan trọng."},{"t":"He will tell the band not to come.","vi":"Anh ấy sẽ bảo ban nhạc đừng đến."},{"t":"He wants her to go to the meetings.","vi":"Anh ấy muốn cô ấy đi họp."}],"ans":["A"],"key":"Nhìn câu ngay sau: cô ấy hủy họp","ex":"Câu hỏi ý định. Anh ấy nhắc \"nhưng đây là tiệc kỷ niệm 5 năm của chị mà\" → ý là chị nên sắp xếp lại lịch để đến tiệc. Câu trả lời ngay sau (\"I will cancel my last meeting\") xác nhận anh ấy muốn cô đổi lịch.","cls":{"A":7,"B":5,"C":4,"D":5},"of":22},{"n":55,"q":"What solution does the woman provide?","qvi":"Người phụ nữ đưa ra giải pháp gì?","opts":[{"t":"She will cancel the band.","vi":"Cô ấy sẽ hủy ban nhạc."},{"t":"She will cancel the dinner service.","vi":"Cô ấy sẽ hủy bữa tối."},{"t":"She will cancel her meetings.","vi":"Cô ấy sẽ hủy cuộc họp."},{"t":"She will fire the man.","vi":"Cô ấy sẽ sa thải người đàn ông."}],"ans":["C"],"key":"cancel my last meeting","ex":"Ba đáp án đầu đều có \"cancel\", phải nghe cô ấy hủy CÁI GÌ: cuộc họp cuối → cancel her meetings.","cls":{"A":2,"B":6,"C":12,"D":2},"of":22}]},{"title":"Hội thoại 56–58 · Bó hoa hướng dương","audio":"../audio/mt5/c56.mp3","script":[{"sp":"M","t":"Hi, Susan. This is Rob. (56) Did you **get the flowers** I sent you?","vi":"Chào Susan. Anh là Rob đây. Em nhận được hoa anh gửi chưa?"},{"sp":"W","t":"Yes, I did, but unfortunately, I'm allergic to sunflowers. I had to go to the hospital because they were in my office for several hours.","vi":"Nhận rồi, nhưng tiếc là em bị dị ứng hoa hướng dương. Em đã phải đi viện vì hoa để trong văn phòng em mấy tiếng liền."},{"sp":"M","t":"(58) Oh, **I thought you would like them**.","vi":"Ồ, anh tưởng em sẽ thích chúng."},{"sp":"W","t":"You know I'm allergic to pollen, Rob. How could you forget? (57) You should **take me to dinner** tomorrow night to apologize.","vi":"Anh biết em dị ứng phấn hoa mà Rob. Sao anh quên được chứ? Tối mai anh phải mời em đi ăn tối để xin lỗi đấy."},{"sp":"M","t":"OK. I will! I'll take you somewhere nice. Sorry about the flowers!","vi":"Được. Nhất định rồi! Anh sẽ đưa em đến chỗ thật đẹp. Xin lỗi chuyện bó hoa nhé!"}],"qs":[{"n":56,"q":"Why is the man calling the woman?","qvi":"Vì sao người đàn ông gọi cho người phụ nữ?","opts":[{"t":"To check the sales figures","vi":"Để kiểm tra doanh số"},{"t":"To check if she received the flowers","vi":"Để hỏi cô ấy đã nhận được hoa chưa"},{"t":"To check if she wanted to go to dinner","vi":"Để hỏi cô ấy có muốn đi ăn tối không"},{"t":"To check if the documents were ready","vi":"Để hỏi tài liệu đã xong chưa"}],"ans":["B"],"key":"Câu dễ nhất bài","ex":"Câu dễ, đa số lớp làm đúng: \"Did you get the flowers I sent you?\" → to check if she received the flowers.","cls":{"A":0,"B":14,"C":5,"D":3},"of":22},{"n":57,"q":"What does the woman say he should do?","qvi":"Người phụ nữ bảo anh ấy nên làm gì?","opts":[{"t":"Take her to the hospital","vi":"Đưa cô ấy đi viện"},{"t":"Pay her hospital bills","vi":"Trả viện phí cho cô ấy"},{"t":"Take her out for dinner","vi":"Mời cô ấy đi ăn tối"},{"t":"Buy her more flowers","vi":"Mua thêm hoa cho cô ấy"}],"ans":["C"],"key":"hospital = chuyện đã xảy ra rồi","ex":"Chú ý thì: \"had to go to the hospital\" là chuyện đã qua; điều cô ấy muốn anh làm là \"take me to dinner tomorrow night\". Câu 57 nằm SAU câu 58 trong bài.","cls":{"A":5,"B":4,"C":9,"D":3},"of":22},{"n":58,"q":"Why does the man say \"I thought you would like them\"?","qvi":"Vì sao người đàn ông nói \"Anh tưởng em sẽ thích chúng\"?","opts":[{"t":"To express disappointment","vi":"Để bày tỏ sự thất vọng"},{"t":"To show appreciation","vi":"Để thể hiện sự cảm kích"},{"t":"To show respect","vi":"Để thể hiện sự tôn trọng"},{"t":"To show he thinks it's funny","vi":"Để cho thấy anh ấy thấy chuyện đó buồn cười"}],"ans":["A"],"key":"tưởng chị sẽ thích → thất vọng","ex":"\"I thought you would like them\" = anh tưởng chị sẽ thích (nhưng hóa ra không) → giọng thất vọng (disappointment).","cls":{"A":9,"B":3,"C":6,"D":3},"of":22}]},{"title":"Hội thoại 59–61 · Chi phí tiếp khách","audio":"../audio/mt5/c59.mp3","script":[{"sp":"M1","t":"Hi Bob, hi Karen. The reason I called you in is to talk about the budget for the last two months. (59) The biggest issue is that our **entertainment expenses are way too high**. I think we need to reduce the amount we are spending on company lunches and dinners.","vi":"Chào Bob, chào Karen. Tôi gọi hai bạn vào để bàn về ngân sách hai tháng qua. Vấn đề lớn nhất là chi phí tiếp khách của mình quá cao. Tôi nghĩ phải giảm tiền chi cho các bữa trưa và tối của công ty."},{"sp":"W (Karen)","t":"(60) Yes, I agree. I think we need to start **paying for our own lunches**.","vi":"Vâng, tôi đồng ý. Tôi nghĩ mọi người nên bắt đầu tự trả tiền bữa trưa của mình."},{"sp":"M2 (Bob)","t":"I agree with both of you, but I think we need to keep entertaining clients. I think if we pay for our own lunches, then that will leave money to take clients out for dinner.","vi":"Tôi đồng ý với cả hai, nhưng tôi nghĩ mình vẫn phải tiếp khách hàng. Nếu mình tự trả tiền bữa trưa thì sẽ còn tiền để mời khách đi ăn tối."},{"sp":"M1","t":"That's a pretty good idea, Bob. Karen, does that sound OK with you?","vi":"Ý hay đấy Bob. Karen, chị thấy được không?"},{"sp":"W (Karen)","t":"I think that's a great compromise, Bob. (61) I will make a **monthly budget plan** and e-mail it to you this afternoon.","vi":"Tôi thấy đó là cách dung hòa rất hay, Bob. Chiều nay tôi sẽ lập kế hoạch ngân sách hằng tháng và gửi email cho anh."}],"qs":[{"n":59,"q":"What is the main problem the speakers are discussing?","qvi":"Vấn đề chính họ đang bàn là gì?","opts":[{"t":"What they should eat for lunch","vi":"Nên ăn gì vào bữa trưa"},{"t":"Going out for dinner","vi":"Đi ăn tối"},{"t":"High entertainment expenses","vi":"Chi phí tiếp khách quá cao"},{"t":"Getting more customers","vi":"Có thêm khách hàng"}],"ans":["C"],"key":"entertainment expenses are way too high","ex":"Hội thoại 3 người. Vấn đề chính được nói rõ: \"The biggest issue is…\" → chi phí tiếp khách quá cao.","cls":{"A":3,"B":3,"C":14,"D":2},"of":22},{"n":60,"q":"What does the woman suggest they do?","qvi":"Người phụ nữ đề xuất họ làm gì?","opts":[{"t":"Stop going out for dinner","vi":"Thôi đi ăn tối"},{"t":"Reduce client numbers","vi":"Giảm số khách hàng"},{"t":"Stop having lunches","vi":"Thôi ăn trưa"},{"t":"Pay for their own lunches","vi":"Tự trả tiền bữa trưa"}],"ans":["D"],"key":"Chỉ nghe Karen (the woman)","ex":"Câu hỏi nói \"the woman\" nên chỉ nghe Karen: \"paying for our own lunches\". Ý \"vẫn tiếp khách\" là của Bob, nên (B) giảm số khách hàng là sai.","cls":{"A":3,"B":3,"C":6,"D":10},"of":22},{"n":61,"q":"What does the woman say she will send the man?","qvi":"Người phụ nữ nói sẽ gửi cho người đàn ông cái gì?","opts":[{"t":"A monthly budget plan","vi":"Kế hoạch ngân sách hằng tháng"},{"t":"This month's sales report","vi":"Báo cáo doanh số tháng này"},{"t":"The old budget plan","vi":"Kế hoạch ngân sách cũ"},{"t":"Last month's marketing materials","vi":"Tài liệu marketing tháng trước"}],"ans":["A"],"key":"make a monthly budget plan and e-mail it","ex":"Câu cuối, đáp án ở câu cuối bài và nhắc gần như nguyên văn: a monthly budget plan. (C) \"the old budget plan\" là bẫy: cô ấy làm kế hoạch MỚI.","cls":{"A":12,"B":3,"C":4,"D":3},"of":22}],"tag":"3 người"}],"recap":"<h2>Ghi nhớ: đáp án nói lại ý<\/h2><table><tbody><tr><td><b>Trong bài nghe<\/b><\/td><td><b>Trong đáp án<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>short-term jobs<\/td><td>a part-time job<\/td><td>32<\/td><\/tr><tr><td>be paid in advance<\/td><td>an advance payment<\/td><td>33<\/td><\/tr><tr><td>get the permission<\/td><td>authorization<\/td><td>40<\/td><\/tr><tr><td>complete some official paperwork<\/td><td>fill out some documents<\/td><td>43<\/td><\/tr><tr><td>I represent the guitar player<\/td><td>a talent agent<\/td><td>44<\/td><\/tr><tr><td>I wanted to remind you<\/td><td>provide a reminder<\/td><td>45<\/td><\/tr><tr><td>stronger than any other product<\/td><td>superior to competitors'<\/td><td>47<\/td><\/tr><tr><td>get in touch with the agency<\/td><td>contact an agency<\/td><td>49<\/td><\/tr><\/tbody><\/table><p><b>Bẫy lặp từ:<\/b> Tokyo (câu 36), color scheme (39), cameras → take pictures (46), magazines (49). Nghe thấy từ quen chưa chắc là đáp án đúng.<\/p>\n<p><b>Bài tập về nhà gợi ý:<\/b> nghe lại audio từng đoạn, với mỗi câu tìm câu gốc trong lời thoại và câu trả lời tương ứng (paraphrase), ghi vào vở theo bảng trên.<\/p>"};</script>
